<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEPS 330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TEPS 330</title>
<style>
/* 토큰: 역할 이름으로 정의하고 다크 모드는 같은 토큰을 다시 정의 (다크-09, 색-28) */
:root{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--line:#dfe3ea;--line-strong:#7a8394;--on-ok:#ffffff;--knob:#ffffff;
  --text:#1b2230;--sub:#545e70;--faint:#646c7d;
  --primary:#2557c7;--on-primary:#ffffff;--primary-soft:#e7eefc;
  --ok:#18733f;--ok-soft:#e5f4ea;--bad:#c5322b;--bad-soft:#fbe9e8;--warn:#8a5a00;--warn-soft:#fdf3dc;
  --sh:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
  --r:14px;--r-s:10px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --f-xs:.8125rem;--f-s:.875rem;--f-m:1rem;--f-l:1.125rem;--f-xl:1.375rem;--f-xxl:1.75rem;
  --t-fast:90ms;--t-med:200ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  --bg:#14171d;--surface:#1d2129;--surface2:#262b35;--line:#323844;--line-strong:#7d8696;
  --text:#e8ebf1;--sub:#b3bac7;--faint:#9aa2b1;
  --primary:#7ea6ff;--on-primary:#0d1630;--primary-soft:#243150;
  --ok:#5fcf8c;--ok-soft:#1c3326;--bad:#ff8a80;--bad-soft:#3a2222;--warn:#f0c060;--warn-soft:#3a3020;
  --sh:none;--on-ok:#0d2416;--knob:#0d1630;
}}
:root[data-theme=dark]{--bg:#14171d;--surface:#1d2129;--surface2:#262b35;--line:#323844;--line-strong:#7d8696;
  --text:#e8ebf1;--sub:#b3bac7;--faint:#9aa2b1;
  --primary:#7ea6ff;--on-primary:#0d1630;--primary-soft:#243150;
  --ok:#5fcf8c;--ok-soft:#1c3326;--bad:#ff8a80;--bad-soft:#3a2222;--warn:#f0c060;--warn-soft:#3a3020;
  --sh:none;--on-ok:#0d2416;--knob:#0d1630;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
@media (prefers-contrast: more){:root{--sub:var(--text);--faint:var(--text);--line:var(--line-strong)}}
@media (forced-colors: active){.toggle,.task input{border:2px solid ButtonText}.toggle:checked,.task input:checked{background:Highlight}}
@media (prefers-reduced-motion: reduce){:root{--t-fast:0ms;--t-med:0ms}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom));scroll-padding-top:72px}
main:focus{outline:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:var(--f-m);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.num,table,.tnum{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 0 calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s2);display:flex;align-items:center;gap:var(--s2)}
header.top h1{font-size:var(--f-xl);margin:0;flex:1;font-weight:700;letter-spacing:-.2px;min-width:0}
header.top .meta{font-size:var(--f-xs);color:var(--sub);text-align:right}
main{padding:0 var(--s4)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:var(--s4);margin:0 0 var(--s3)}
h2{font-size:var(--f-l);margin:0 0 var(--s2);font-weight:700}
h3{font-size:var(--f-m);margin:var(--s4) 0 var(--s2);font-weight:700}
p{margin:0 0 var(--s2)}
.sub{color:var(--sub);font-size:var(--f-s)}
.row{display:flex;align-items:center;gap:var(--s2)}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 var(--s4);border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:0 var(--s3);font-size:var(--f-s)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
/* 진행 막대: 글과 함께 (시각화-16, 접근성-03) */
.meter{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0}
.bar{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>b{display:block;height:100%;background:var(--primary)}
.bar>b.full{background:var(--ok)}
.meter .v{font-weight:700;min-width:4.5em;text-align:right}
/* 할 일 */
.task{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.task input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid var(--line-strong);border-radius:50%;flex:none;margin:0;display:grid;place-content:center;cursor:pointer;background:var(--surface)}
.task input:checked{background:var(--ok);border-color:var(--ok)}
.task input:checked::after{content:"✓";color:var(--on-ok);font-weight:800;font-size:15px}
.task .t{font-weight:600}
.task .k{font-size:var(--f-s);color:var(--sub);margin-top:2px}
.task.done .t{text-decoration:line-through;color:var(--sub)}
.tag{display:inline-block;font-size:var(--f-xs);font-weight:700;border-radius:6px;padding:0 6px;margin-right:6px;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.why{font-size:var(--f-xs);color:var(--faint);margin-top:2px}
.badge-done{font-size:var(--f-xs);color:var(--ok);font-weight:700}
/* 하단 탭 (내비-03·04·09, 레이아웃-13) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;min-height:60px;padding:6px 0 8px;font-size:var(--f-xs);color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}
nav.tabs button[aria-current="page"] svg{fill:var(--primary-soft);stroke-width:2.2}
/* 달력 */
.cal-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.cal-head h2{flex:1;margin:0}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk div{font-size:var(--f-xs);color:var(--sub);text-align:center;padding:4px 0}
.cell{min-width:0;min-height:4rem;border-top:1px solid var(--line);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit}
.cell[disabled]{opacity:.35;cursor:default}
.cell .d{min-width:1.9em;height:1.9em;line-height:1.9em;white-space:nowrap;text-align:center;border-radius:50%;font-weight:600;font-size:var(--f-s)}
.cell.today .d{background:var(--primary);color:var(--on-primary)}
.cell[aria-pressed="true"]{background:var(--primary-soft);border-radius:var(--r-s);box-shadow:inset 0 0 0 2px var(--primary)}
.cell .ev{font-size:.75rem;text-overflow:ellipsis;line-height:1.35;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;padding:0 3px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.cell .ev.x{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell .ev.m{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cell .pg{font-size:.75rem;color:var(--sub);white-space:nowrap}
.cell .pg.full{color:var(--ok);font-weight:700}
/* 단어 */
.qcard{text-align:left}
.qprompt{font-size:var(--f-xxl);font-weight:700;margin:var(--s2) 0;line-height:1.25}
.qsent{font-size:var(--f-l);line-height:1.6;margin:var(--s2) 0}
.qsent .blank{display:inline-block;min-width:5em;border-bottom:2px solid var(--text)}
.opts{display:grid;gap:var(--s2);margin-top:var(--s3)}
.opt{text-align:left;min-height:52px;padding:var(--s3) var(--s4);border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:var(--f-m);display:flex;gap:var(--s3);align-items:center}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-content:center;font-size:var(--f-xs);font-weight:700}
.opt.right{background:var(--ok-soft);border-color:var(--ok);}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt .mark{margin-left:auto;font-weight:800}
.fb{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-s);background:var(--surface2)}
.fb.ok .h{color:var(--ok)}.fb.no .h{color:var(--bad)}
.fb .h{font-weight:800}
.learn .w{font-size:var(--f-xxl);font-weight:800;line-height:1.2}
.learn .pos{color:var(--sub);font-size:var(--f-s);margin-left:6px;font-weight:600}
.learn .ko{font-size:var(--f-l);font-weight:700;margin:var(--s2) 0}
.learn .ex{margin:var(--s2) 0 0}
.learn .exko{color:var(--sub);font-size:var(--f-s)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.chip{font-size:var(--f-s);padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.speak{border:1px solid var(--line-strong);background:var(--surface);border-radius:50%;width:44px;height:44px;display:inline-grid;place-content:center;cursor:pointer;flex:none}
.speak svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.stat{background:var(--surface2);border-radius:var(--r-s);padding:var(--s3);text-align:center}
.stat b{display:block;font-size:var(--f-xl)}
.stat span{font-size:var(--f-xs);color:var(--sub)}
/* 표 (표-02·03·05) */
table{width:100%;border-collapse:collapse;font-size:var(--f-s)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
caption{text-align:left;font-weight:700;margin-bottom:var(--s2);font-size:var(--f-m)}
th,td{padding:8px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{white-space:normal}
input.time{width:9.5em;flex:none}
th{color:var(--sub);font-weight:600;text-align:right}
td{text-align:right}
th.l,td.l{text-align:left}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--bad);font-weight:800}
/* 폼 (폼-01·03·04) */
label.f{display:block;font-weight:600;margin:var(--s3) 0 var(--s1)}
.hint{font-size:var(--f-s);color:var(--sub);margin-top:2px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select{width:100%;min-height:48px;padding:0 var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface)}
input.narrow{width:7.5em}
.err{color:var(--bad);font-size:var(--f-s);margin-top:4px;font-weight:600}
.err::before{content:"⚠ "}
.sw{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);min-height:56px;border-top:1px solid var(--line);padding:4px 0}
.btn{white-space:nowrap}
.alist.off{opacity:.45}
.sticky-act{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:8px 0}
.toast button{margin-left:12px;background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:32px;cursor:pointer}
.sw:first-of-type{border-top:0}
.sw .lab{flex:1}
.toggle{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background var(--t-fast)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--knob);transition:transform var(--t-fast) ease-out}
.toggle:checked{background:var(--primary)}
.toggle:checked::after{transform:translateX(20px)}
.note{background:var(--surface2);border-radius:var(--r-s);padding:var(--s3);font-size:var(--f-s);color:var(--sub);margin-top:var(--s2)}
.banner{border-radius:var(--r-s);padding:var(--s3);margin:0 0 var(--s3);font-size:var(--f-s);display:flex;gap:var(--s2);align-items:flex-start;background:var(--warn-soft);color:var(--text);border:1px solid var(--line)}
.banner b{color:var(--warn)}
.banner.info{background:var(--primary-soft)}
.banner.info b{color:var(--text)}
.list-plain{margin:0;padding-left:1.2em}
.list-plain li{margin:4px 0}
details{border-top:1px solid var(--line);padding:var(--s2) 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.ocr-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.ocr-row input[type=checkbox]{width:28px;height:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:var(--f-s);z-index:9;max-width:90%}
.alarm-hero{text-align:center;padding:var(--s4) 0 var(--s2)}
.alarm-hero .clock{font-size:3rem;font-weight:800;line-height:1.1}
@media (min-width:600px){.cell{min-height:80px}}
/* 머리글 뒤로·닫기 (내비-17) */
.hb{border:0;background:none;min-width:44px;min-height:44px;margin-left:-10px;border-radius:50%;display:grid;place-content:center;cursor:pointer;color:var(--text)}
.hb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2}
/* 집중 화면: 시험·익히기는 탭 막대를 숨기고 손이 닿는 아래쪽에 조작을 모음 (내비-22, 레이아웃-13) */
body.focus nav.tabs{display:none}
body.focus .app{padding-bottom:0}
body.focus .sticky-act{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.focus-wrap{min-height:calc(100dvh - 76px - env(safe-area-inset-top));display:flex;flex-direction:column}
.focus-wrap .spacer{flex:1;min-height:var(--s3)}
.qbar{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s3)}
.qbar .bar{height:8px}
.qbar .v{font-size:var(--f-s);color:var(--sub);white-space:nowrap}
/* 오늘: 지금 할 것 하나 (원칙-04·05, 대시보드-04) */
.hero{padding:var(--s5) var(--s4)}
.hero .lead{font-size:var(--f-s);color:var(--sub);margin:0 0 var(--s1)}
.hero h2{font-size:var(--f-xl);line-height:1.35;margin:0 0 var(--s2)}
.hero .btn{margin-top:var(--s4)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s4)}
.mini div{background:var(--surface2);border-radius:var(--r-s);padding:var(--s2) var(--s3)}
.mini b{display:block;font-size:var(--f-l)}
.mini span{font-size:var(--f-xs);color:var(--sub)}
.linkrow{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;border:0;background:none;padding:var(--s2) 0;text-align:left;cursor:pointer;color:var(--text);border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0}
.linkrow .grow b{display:block}
.linkrow .chev{color:var(--sub);font-size:1.25rem}
.resume{border:2px solid var(--primary)}
input:disabled,.toggle:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <header class="top"><span id="hbx"></span><h1 id="title">오늘</h1><div class="meta" id="meta"></div></header>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabs" aria-label="주 메뉴"><div class="in">
  <button data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>오늘</button>
  <button data-v="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>단어</button>
  <button data-v="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
  <button data-v="score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>기록</button>
  <button data-v="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg>설정</button>

<script id="wordsData" type="application/json">[{"w":"abandon","pos":"v","ko":"버리다, 포기하다","ex":"The company decided to abandon the project after its budget was cut by nearly half last quarter.","ans":"abandon","exKo":"그 회사는 지난 분기 예산이 거의 절반으로 삭감된 뒤 그 프로젝트를 포기하기로 했다.","syn":["give up","desert"],"ant":["continue","keep"],"lv":1,"cat":"voc"},{"w":"abide by","pos":"phr","ko":"(규칙 등을) 지키다, 따르다","ex":"All tenants must abide by the building regulations, including the ban on smoking in common areas.","ans":"abide by","exKo":"모든 세입자는 공용 공간 흡연 금지를 포함한 건물 규정을 지켜야 한다.","syn":["comply with","obey","follow"],"ant":["violate","break"],"lv":1,"cat":"voc"},{"w":"absorb","pos":"v","ko":"흡수하다, 받아들이다","ex":"Dense forests absorb large amounts of carbon dioxide, which helps slow the pace of climate change.","ans":"absorb","exKo":"울창한 숲은 많은 양의 이산화탄소를 흡수하여 기후 변화의 속도를 늦추는 데 도움을 준다.","syn":["soak up","take in"],"ant":["emit","release"],"lv":1,"cat":"voc"},{"w":"abstract","pos":"adj","ko":"추상적인, 관념적인","ex":"The professor used concrete examples because many students found the theory too abstract to follow.","ans":"abstract","exKo":"많은 학생이 그 이론을 너무 추상적이라 따라가기 어려워해서 교수는 구체적인 예를 들었다.","syn":["theoretical","conceptual"],"ant":["concrete"],"lv":2,"cat":"voc"},{"w":"abundant","pos":"adj","ko":"풍부한, 많은","ex":"The region has abundant natural resources, but it lacks the infrastructure to export them efficiently.","ans":"abundant","exKo":"그 지역은 천연자원이 풍부하지만 이를 효율적으로 수출할 기반 시설이 부족하다.","syn":["plentiful","ample"],"ant":["scarce","sparse"],"lv":1,"cat":"voc"},{"w":"accelerate","pos":"v","ko":"가속하다, 촉진하다","ex":"The government introduced tax incentives to accelerate the transition to electric vehicles nationwide.","ans":"accelerate","exKo":"정부는 전국적인 전기차 전환을 가속하기 위해 세금 혜택을 도입했다.","syn":["speed up","hasten"],"ant":["slow down","decelerate"],"lv":1,"cat":"voc"},{"w":"accommodate","pos":"v","ko":"수용하다, 편의를 제공하다","ex":"The new conference hall can accommodate up to five hundred guests and is fully accessible by wheelchair.","ans":"accommodate","exKo":"새 회의장은 최대 500명의 손님을 수용할 수 있고 휠체어로 완전히 이용할 수 있다.","syn":["hold","house","cater to"],"ant":[],"lv":1,"cat":"voc"},{"w":"accomplish","pos":"v","ko":"성취하다, 완수하다","ex":"The team managed to accomplish its sales target two weeks ahead of schedule despite the market slowdown.","ans":"accomplish","exKo":"그 팀은 시장 둔화에도 불구하고 일정보다 2주 앞서 매출 목표를 달성했다.","syn":["achieve","complete","fulfill"],"ant":["fail"],"lv":1,"cat":"voc"},{"w":"accordingly","pos":"adv","ko":"그에 따라, 따라서","ex":"The weather forecast predicts heavy rain tomorrow, so please plan your outdoor activities accordingly.","ans":"accordingly","exKo":"일기예보에 내일 폭우가 예상되니 야외 활동을 그에 맞춰 계획하시기 바랍니다.","syn":["correspondingly","therefore"],"ant":[],"lv":2,"cat":"voc"},{"w":"account for","pos":"phr","ko":"설명하다, (비율을) 차지하다","ex":"Online purchases now account for more than thirty percent of total retail sales in the country.","ans":"account for","exKo":"온라인 구매는 현재 그 나라 전체 소매 판매의 30% 이상을 차지한다.","syn":["explain","make up","constitute"],"ant":[],"lv":1,"cat":"voc"},{"w":"accumulate","pos":"v","ko":"축적하다, 모으다","ex":"Over the years, she accumulated enough savings to open her own bakery in the downtown area.","ans":"accumulated","exKo":"수년에 걸쳐 그녀는 시내에 자신의 빵집을 열 만큼 충분한 저축을 모았다.","syn":["amass","gather","build up"],"ant":["disperse","spend"],"lv":2,"cat":"voc"},{"w":"accuse","pos":"v","ko":"고발하다, 비난하다","ex":"The former manager was accused of leaking confidential client information to a rival firm.","ans":"accused","exKo":"전 관리자는 기밀 고객 정보를 경쟁사에 유출한 혐의로 고발되었다.","syn":["charge","blame"],"ant":["acquit"],"lv":2,"cat":"voc"},{"w":"acknowledge","pos":"v","ko":"인정하다, (수령을) 알리다","ex":"The minister acknowledged that the new policy had caused confusion among small business owners.","ans":"acknowledged","exKo":"장관은 새 정책이 소상공인들 사이에 혼란을 일으켰다는 것을 인정했다.","syn":["admit","recognize","concede"],"ant":["deny"],"lv":1,"cat":"voc"},{"w":"adequate","pos":"adj","ko":"충분한, 적절한","ex":"Workers complained that the factory did not provide adequate safety equipment for handling chemicals.","ans":"adequate","exKo":"근로자들은 공장이 화학 물질을 다루기 위한 충분한 안전 장비를 제공하지 않는다고 불평했다.","syn":["sufficient","enough"],"ant":["inadequate","insufficient"],"lv":1,"cat":"voc"},{"w":"adhere to","pos":"phr","ko":"고수하다, 지키다","ex":"Researchers must adhere to strict ethical guidelines when conducting experiments involving human participants.","ans":"adhere to","exKo":"연구자들은 사람이 참여하는 실험을 할 때 엄격한 윤리 지침을 지켜야 한다.","syn":["stick to","follow","observe"],"ant":["deviate from"],"lv":2,"cat":"voc"},{"w":"adjacent","pos":"adj","ko":"인접한, 이웃한","ex":"Guests can park their cars in the lot adjacent to the hotel at no extra charge.","ans":"adjacent","exKo":"투숙객은 호텔에 인접한 주차장에 추가 요금 없이 차를 세울 수 있다.","syn":["neighboring","next to","adjoining"],"ant":["distant"],"lv":2,"cat":"voc"},{"w":"administer","pos":"v","ko":"관리하다, (약을) 투여하다, 시행하다","ex":"Only trained nurses are allowed to administer the vaccine at the community health center.","ans":"administer","exKo":"지역 보건소에서는 훈련받은 간호사만 백신을 투여할 수 있다.","syn":["manage","give","dispense"],"ant":[],"lv":2,"cat":"voc"},{"w":"adopt","pos":"v","ko":"채택하다, 입양하다","ex":"The city council voted to adopt a new recycling program that will start early next year.","ans":"adopt","exKo":"시의회는 내년 초에 시작될 새 재활용 프로그램을 채택하기로 투표로 결정했다.","syn":["embrace","take up","accept"],"ant":["reject","abandon"],"lv":1,"cat":"voc"},{"w":"advocate","pos":"v","ko":"옹호하다, 지지하다","ex":"Environmental groups advocate stricter limits on plastic packaging used by large supermarket chains.","ans":"advocate","exKo":"환경 단체들은 대형 슈퍼마켓 체인이 쓰는 플라스틱 포장에 대한 더 엄격한 제한을 지지한다.","syn":["support","champion","promote"],"ant":["oppose"],"lv":1,"cat":"voc"},{"w":"affluent","pos":"adj","ko":"부유한, 풍족한","ex":"Housing prices have soared in affluent neighborhoods where many young professionals want to live.","ans":"affluent","exKo":"많은 젊은 전문직 종사자가 살고 싶어 하는 부유한 동네에서 집값이 치솟았다.","syn":["wealthy","prosperous","rich"],"ant":["poor","impoverished"],"lv":2,"cat":"voc"},{"w":"aggravate","pos":"v","ko":"악화시키다, 짜증 나게 하다","ex":"Doctors warned that lifting heavy objects could aggravate his back injury and delay recovery.","ans":"aggravate","exKo":"의사들은 무거운 물건을 들면 그의 허리 부상이 악화되어 회복이 늦어질 수 있다고 경고했다.","syn":["worsen","exacerbate"],"ant":["alleviate","ease"],"lv":2,"cat":"voc"},{"w":"allocate","pos":"v","ko":"할당하다, 배분하다","ex":"The school board allocated extra funds to upgrade computers in classrooms across the district.","ans":"allocated","exKo":"교육위원회는 학군 전체 교실의 컴퓨터를 교체하기 위해 추가 자금을 배정했다.","syn":["assign","distribute","allot"],"ant":[],"lv":1,"cat":"voc"},{"w":"alleviate","pos":"v","ko":"완화하다, 경감하다","ex":"The new subway line is expected to alleviate traffic congestion in the city center during rush hour.","ans":"alleviate","exKo":"새 지하철 노선은 출퇴근 시간 도심의 교통 혼잡을 완화할 것으로 기대된다.","syn":["relieve","ease","mitigate"],"ant":["aggravate","worsen"],"lv":1,"cat":"voc"},{"w":"alter","pos":"v","ko":"바꾸다, 변경하다","ex":"The airline reserves the right to alter flight schedules due to weather or technical problems.","ans":"alter","exKo":"항공사는 날씨나 기술적 문제로 비행 일정을 변경할 권리를 가진다.","syn":["change","modify","revise"],"ant":["preserve"],"lv":1,"cat":"voc"},{"w":"ambiguous","pos":"adj","ko":"모호한, 애매한","ex":"The wording of the contract was so ambiguous that both parties interpreted it in different ways.","ans":"ambiguous","exKo":"계약서 문구가 너무 모호해서 양측이 서로 다르게 해석했다.","syn":["vague","unclear","equivocal"],"ant":["clear","explicit"],"lv":1,"cat":"voc"},{"w":"amend","pos":"v","ko":"개정하다, 수정하다","ex":"Lawmakers are considering a proposal to amend the labor law to limit weekly working hours.","ans":"amend","exKo":"국회의원들은 주당 근로 시간을 제한하도록 노동법을 개정하자는 제안을 검토하고 있다.","syn":["revise","modify","correct"],"ant":[],"lv":2,"cat":"voc"},{"w":"ample","pos":"adj","ko":"충분한, 넓은","ex":"Applicants will be given ample time to prepare their presentations before the final interview.","ans":"ample","exKo":"지원자들에게는 최종 면접 전에 발표를 준비할 충분한 시간이 주어진다.","syn":["plenty of","sufficient","abundant"],"ant":["insufficient","meager"],"lv":2,"cat":"voc"},{"w":"anticipate","pos":"v","ko":"예상하다, 기대하다","ex":"Economists anticipate a slight rise in interest rates as inflation continues to exceed the target.","ans":"anticipate","exKo":"인플레이션이 계속 목표치를 웃돌면서 경제학자들은 금리의 소폭 인상을 예상한다.","syn":["expect","foresee","predict"],"ant":[],"lv":1,"cat":"voc"},{"w":"apparent","pos":"adj","ko":"명백한, 겉보기의","ex":"It soon became apparent that the new software was not compatible with the older office computers.","ans":"apparent","exKo":"새 소프트웨어가 오래된 사무실 컴퓨터와 호환되지 않는다는 것이 곧 명백해졌다.","syn":["obvious","evident","clear"],"ant":["hidden","obscure"],"lv":1,"cat":"voc"},{"w":"applicable","pos":"adj","ko":"적용할 수 있는, 해당되는","ex":"The discount is applicable only to orders placed through our official website before Friday.","ans":"applicable","exKo":"할인은 금요일 전에 공식 웹사이트를 통해 한 주문에만 적용된다.","syn":["relevant","valid","pertinent"],"ant":["inapplicable","irrelevant"],"lv":2,"cat":"voc"},{"w":"apprehensive","pos":"adj","ko":"불안한, 걱정하는","ex":"Many employees felt apprehensive about the merger because they feared losing their jobs.","ans":"apprehensive","exKo":"많은 직원이 일자리를 잃을까 두려워 합병에 대해 불안해했다.","syn":["anxious","worried","uneasy"],"ant":["confident","calm"],"lv":3,"cat":"voc"},{"w":"appropriate","pos":"adj","ko":"적절한, 알맞은","ex":"Jeans and sneakers are not considered appropriate attire for the formal awards ceremony tonight.","ans":"appropriate","exKo":"청바지와 운동화는 오늘 밤 공식 시상식에 적절한 복장으로 여겨지지 않는다.","syn":["suitable","proper","fitting"],"ant":["inappropriate","improper"],"lv":1,"cat":"voc"},{"w":"approximately","pos":"adv","ko":"대략, 거의","ex":"The renovation of the city library will take approximately eight months and cost two million dollars.","ans":"approximately","exKo":"시립 도서관 보수 공사는 대략 8개월이 걸리고 200만 달러가 들 것이다.","syn":["about","roughly","around"],"ant":["exactly","precisely"],"lv":1,"cat":"voc"},{"w":"arbitrary","pos":"adj","ko":"임의의, 독단적인","ex":"Critics argued that the selection of winners seemed arbitrary because no clear criteria were published.","ans":"arbitrary","exKo":"비평가들은 명확한 기준이 공개되지 않아 수상자 선정이 임의적으로 보인다고 주장했다.","syn":["random","capricious"],"ant":["reasoned","systematic"],"lv":2,"cat":"voc"},{"w":"assess","pos":"v","ko":"평가하다, 산정하다","ex":"Insurance experts arrived to assess the damage caused by the flood in the low-lying villages.","ans":"assess","exKo":"보험 전문가들이 저지대 마을의 홍수 피해를 평가하러 도착했다.","syn":["evaluate","appraise","judge"],"ant":[],"lv":1,"cat":"voc"},{"w":"assure","pos":"v","ko":"보장하다, 안심시키다","ex":"The manager assured customers that all defective products would be replaced free of charge.","ans":"assured","exKo":"관리자는 고객들에게 모든 불량품을 무료로 교환해 주겠다고 장담했다.","syn":["guarantee","reassure","promise"],"ant":[],"lv":1,"cat":"voc"},{"w":"attain","pos":"v","ko":"달성하다, 이르다","ex":"Few athletes ever attain the level of skill required to compete in the Olympic Games.","ans":"attain","exKo":"올림픽에 출전하는 데 필요한 수준의 기량에 이르는 선수는 거의 없다.","syn":["achieve","reach","accomplish"],"ant":["fail"],"lv":2,"cat":"voc"},{"w":"attribute","pos":"v","ko":"(원인을) ~의 탓으로 돌리다","ex":"Analysts attribute the drop in sales to rising prices and weaker demand from overseas markets.","ans":"attribute","exKo":"분석가들은 매출 감소를 가격 상승과 해외 시장의 수요 약화 탓으로 본다.","syn":["ascribe","credit","assign"],"ant":[],"lv":1,"cat":"voc"},{"w":"authentic","pos":"adj","ko":"진짜의, 진품인","ex":"Experts confirmed that the painting found in the attic was an authentic work by the famous artist.","ans":"authentic","exKo":"전문가들은 다락방에서 발견된 그림이 그 유명 화가의 진품이라고 확인했다.","syn":["genuine","real"],"ant":["fake","counterfeit"],"lv":2,"cat":"voc"},{"w":"avert","pos":"v","ko":"피하다, 막다","ex":"Quick action by the pilots helped avert a serious accident when one engine suddenly failed.","ans":"avert","exKo":"엔진 하나가 갑자기 고장 났을 때 조종사들의 빠른 대응이 심각한 사고를 막았다.","syn":["prevent","avoid","ward off"],"ant":["cause"],"lv":3,"cat":"voc"},{"w":"avid","pos":"adj","ko":"열렬한, 열심인","ex":"As an avid reader, he usually finishes at least three novels a month during his commute.","ans":"avid","exKo":"열렬한 독서가인 그는 보통 출퇴근 중에 한 달에 최소 세 권의 소설을 읽는다.","syn":["keen","eager","enthusiastic"],"ant":["indifferent"],"lv":3,"cat":"voc"},{"w":"backlash","pos":"n","ko":"반발, 역풍","ex":"The company faced a strong public backlash after it announced plans to raise subscription fees again.","ans":"backlash","exKo":"그 회사는 구독료를 또 인상할 계획을 발표한 뒤 강한 대중의 반발에 직면했다.","syn":["reaction","outcry","opposition"],"ant":["support"],"lv":2,"cat":"voc"},{"w":"bankrupt","pos":"adj","ko":"파산한","ex":"The airline went bankrupt after years of losses and was forced to cancel all remaining flights.","ans":"bankrupt","exKo":"그 항공사는 수년간의 적자 끝에 파산하여 남은 모든 항공편을 취소해야 했다.","syn":["insolvent","broke"],"ant":["solvent","prosperous"],"lv":2,"cat":"voc"},{"w":"belated","pos":"adj","ko":"뒤늦은","ex":"She sent her friend a belated birthday card along with an apology for forgetting the date.","ans":"belated","exKo":"그녀는 날짜를 잊은 것에 대한 사과와 함께 친구에게 뒤늦은 생일 카드를 보냈다.","syn":["late","overdue","tardy"],"ant":["timely","early"],"lv":3,"cat":"voc"},{"w":"beneficial","pos":"adj","ko":"유익한, 이로운","ex":"Studies show that regular walking is beneficial for both physical health and emotional well-being.","ans":"beneficial","exKo":"연구에 따르면 규칙적인 걷기는 신체 건강과 정서적 안녕 모두에 유익하다.","syn":["advantageous","helpful","favorable"],"ant":["harmful","detrimental"],"lv":1,"cat":"voc"},{"w":"bewildered","pos":"adj","ko":"당황한, 어리둥절한","ex":"Tourists looked bewildered as the announcement about the platform change was made only in Korean.","ans":"bewildered","exKo":"승강장 변경 안내가 한국어로만 나오자 관광객들은 어리둥절한 표정이었다.","syn":["confused","puzzled","baffled"],"ant":["unperturbed"],"lv":3,"cat":"voc"},{"w":"bias","pos":"n","ko":"편견, 편향","ex":"The survey was criticized for its bias because it only included responses from wealthy urban residents.","ans":"bias","exKo":"그 설문 조사는 부유한 도시 거주자의 응답만 포함해 편향되었다는 비판을 받았다.","syn":["prejudice","partiality"],"ant":["impartiality","fairness"],"lv":1,"cat":"voc"},{"w":"bind","pos":"v","ko":"묶다, 구속하다","ex":"The agreement will legally bind both companies to share research data for the next five years.","ans":"bind","exKo":"이 협정은 두 회사가 향후 5년간 연구 데이터를 공유하도록 법적으로 구속할 것이다.","syn":["obligate","tie","commit"],"ant":["release","free"],"lv":2,"cat":"voc"},{"w":"bland","pos":"adj","ko":"(맛이) 싱거운, 단조로운","ex":"Many patients complain that hospital food is bland because it contains very little salt or spice.","ans":"bland","exKo":"많은 환자가 병원 음식이 소금이나 양념이 거의 없어 싱겁다고 불평한다.","syn":["tasteless","plain","dull"],"ant":["spicy","flavorful"],"lv":2,"cat":"voc"},{"w":"boast","pos":"v","ko":"자랑하다, (좋은 것을) 갖추고 있다","ex":"The resort boasts an outdoor pool, three restaurants, and a stunning view of the mountains.","ans":"boasts","exKo":"그 리조트는 야외 수영장과 식당 세 곳, 그리고 멋진 산 전망을 자랑한다.","syn":["brag","feature","pride oneself on"],"ant":[],"lv":2,"cat":"voc"},{"w":"boost","pos":"v","ko":"증대시키다, 북돋우다","ex":"The festival is expected to boost local tourism and create hundreds of temporary jobs this summer.","ans":"boost","exKo":"그 축제는 이번 여름 지역 관광을 활성화하고 수백 개의 임시 일자리를 만들 것으로 기대된다.","syn":["increase","enhance","stimulate"],"ant":["reduce","hinder"],"lv":1,"cat":"voc"},{"w":"breach","pos":"n","ko":"위반, (보안) 침해","ex":"The bank apologized for a security breach that exposed the personal data of thousands of customers.","ans":"breach","exKo":"은행은 수천 명의 고객 개인정보를 노출시킨 보안 침해에 대해 사과했다.","syn":["violation","infringement","break"],"ant":["compliance"],"lv":2,"cat":"voc"},{"w":"bulk","pos":"n","ko":"대부분, 대량","ex":"The bulk of the budget was spent on staff salaries, leaving little for new equipment.","ans":"bulk","exKo":"예산의 대부분이 직원 급여에 쓰여 새 장비에 쓸 돈이 거의 남지 않았다.","syn":["majority","most","mass"],"ant":["minority"],"lv":2,"cat":"voc"},{"w":"bureaucracy","pos":"n","ko":"관료주의, 관료 체제","ex":"Small business owners often complain that excessive bureaucracy delays the approval of their permits.","ans":"bureaucracy","exKo":"소상공인들은 지나친 관료주의 때문에 허가 승인이 늦어진다고 자주 불평한다.","syn":["red tape","administration"],"ant":[],"lv":3,"cat":"voc"},{"w":"bustling","pos":"adj","ko":"북적거리는, 붐비는","ex":"The once quiet fishing village has become a bustling tourist destination with cafes and shops.","ans":"bustling","exKo":"한때 조용했던 어촌 마을은 카페와 상점이 있는 북적이는 관광지가 되었다.","syn":["busy","lively","crowded"],"ant":["quiet","deserted"],"lv":3,"cat":"voc"},{"w":"bypass","pos":"v","ko":"우회하다, 건너뛰다","ex":"Some users found a way to bypass the security system and access the files without a password.","ans":"bypass","exKo":"일부 사용자는 보안 시스템을 우회해 비밀번호 없이 파일에 접근하는 방법을 찾았다.","syn":["circumvent","avoid","get around"],"ant":[],"lv":3,"cat":"voc"},{"w":"by and large","pos":"phr","ko":"대체로, 전반적으로","ex":"By and large, the participants were satisfied with the workshop, though some found it too long.","ans":"By and large","exKo":"일부는 너무 길다고 느꼈지만 참가자들은 대체로 워크숍에 만족했다.","syn":["on the whole","generally","overall"],"ant":[],"lv":3,"cat":"voc"},{"w":"candid","pos":"adj","ko":"솔직한","ex":"In a candid interview, the actor spoke openly about his struggles with anxiety and depression.","ans":"candid","exKo":"솔직한 인터뷰에서 그 배우는 불안과 우울증으로 힘들었던 일을 터놓고 이야기했다.","syn":["frank","honest","open"],"ant":["evasive","guarded"],"lv":2,"cat":"voc"},{"w":"cater to","pos":"phr","ko":"(요구에) 맞추다, 부응하다","ex":"The new restaurant menu was designed to cater to customers with various dietary restrictions.","ans":"cater to","exKo":"새 식당 메뉴는 다양한 식이 제한이 있는 고객에게 맞추도록 만들어졌다.","syn":["serve","accommodate","provide for"],"ant":["neglect"],"lv":2,"cat":"voc"},{"w":"cautious","pos":"adj","ko":"조심스러운, 신중한","ex":"Investors remain cautious about buying stocks until the central bank clarifies its interest rate plans.","ans":"cautious","exKo":"투자자들은 중앙은행이 금리 계획을 분명히 할 때까지 주식 매수에 신중한 태도를 유지한다.","syn":["careful","wary","prudent"],"ant":["reckless","careless"],"lv":1,"cat":"voc"},{"w":"chronic","pos":"adj","ko":"만성적인","ex":"Patients with chronic back pain are encouraged to try physical therapy before considering surgery.","ans":"chronic","exKo":"만성 허리 통증 환자는 수술을 고려하기 전에 물리 치료를 시도해 보도록 권장된다.","syn":["persistent","long-term","lasting"],"ant":["acute","temporary"],"lv":1,"cat":"voc"},{"w":"circulate","pos":"v","ko":"순환하다, 유포하다","ex":"False rumors about the company's financial troubles began to circulate on social media last week.","ans":"circulate","exKo":"지난주 그 회사의 재정난에 관한 허위 소문이 소셜 미디어에 퍼지기 시작했다.","syn":["spread","distribute","flow"],"ant":[],"lv":2,"cat":"voc"},{"w":"cite","pos":"v","ko":"인용하다, (이유로) 들다","ex":"The mayor cited budget shortages as the main reason for postponing the new park project.","ans":"cited","exKo":"시장은 새 공원 사업을 연기하는 주된 이유로 예산 부족을 들었다.","syn":["quote","mention","refer to"],"ant":[],"lv":1,"cat":"voc"},{"w":"clarify","pos":"v","ko":"명확히 하다, 해명하다","ex":"Could you clarify what you mean by flexible hours before I sign the employment contract?","ans":"clarify","exKo":"근로 계약서에 서명하기 전에 유연 근무가 무슨 뜻인지 분명히 설명해 주시겠어요?","syn":["explain","make clear","elucidate"],"ant":["confuse","obscure"],"lv":1,"cat":"voc"},{"w":"coherent","pos":"adj","ko":"일관성 있는, 논리 정연한","ex":"The committee asked the agency to present a coherent plan rather than a list of unrelated ideas.","ans":"coherent","exKo":"위원회는 그 기관에 서로 관련 없는 아이디어 목록 대신 일관된 계획을 제시하라고 요청했다.","syn":["logical","consistent","clear"],"ant":["incoherent","confused"],"lv":2,"cat":"voc"},{"w":"coincide","pos":"v","ko":"동시에 일어나다, 일치하다","ex":"The opening of the new museum will coincide with the city's two hundredth anniversary celebration.","ans":"coincide","exKo":"새 박물관의 개관은 그 도시의 200주년 기념행사와 같은 시기에 열린다.","syn":["concur","correspond","happen together"],"ant":["differ"],"lv":2,"cat":"voc"},{"w":"collaborate","pos":"v","ko":"협력하다, 공동 작업하다","ex":"Scientists from five countries will collaborate on a project to monitor melting glaciers.","ans":"collaborate","exKo":"5개국의 과학자들이 녹고 있는 빙하를 관측하는 프로젝트에서 협력할 것이다.","syn":["cooperate","work together","team up"],"ant":["compete"],"lv":1,"cat":"voc"},{"w":"commence","pos":"v","ko":"시작하다, 개시하다","ex":"Construction of the new terminal will commence next spring once all permits have been approved.","ans":"commence","exKo":"모든 허가가 승인되면 새 터미널 공사가 내년 봄에 시작될 것이다.","syn":["begin","start","initiate"],"ant":["end","conclude"],"lv":2,"cat":"voc"},{"w":"commitment","pos":"n","ko":"약속, 헌신, 전념","ex":"The company reaffirmed its commitment to reducing carbon emissions by half within ten years.","ans":"commitment","exKo":"그 회사는 10년 안에 탄소 배출을 절반으로 줄이겠다는 약속을 재확인했다.","syn":["dedication","pledge","obligation"],"ant":[],"lv":1,"cat":"voc"},{"w":"commodity","pos":"n","ko":"상품, 원자재","ex":"Oil and wheat prices have risen sharply, pushing up the cost of almost every basic commodity.","ans":"commodity","exKo":"석유와 밀 가격이 급등하면서 거의 모든 기본 상품의 가격이 올랐다.","syn":["goods","product","raw material"],"ant":[],"lv":2,"cat":"voc"},{"w":"compatible","pos":"adj","ko":"호환되는, 양립할 수 있는","ex":"Before buying the printer, check whether it is compatible with your computer's operating system.","ans":"compatible","exKo":"프린터를 사기 전에 컴퓨터 운영 체제와 호환되는지 확인하세요.","syn":["consistent","suited","harmonious"],"ant":["incompatible"],"lv":1,"cat":"voc"},{"w":"compel","pos":"v","ko":"강요하다, 억지로 ~하게 하다","ex":"Rising rents compelled many artists to move their studios out of the city center.","ans":"compelled","exKo":"오르는 임대료 때문에 많은 예술가가 작업실을 도심 밖으로 옮길 수밖에 없었다.","syn":["force","oblige","require"],"ant":["allow"],"lv":2,"cat":"voc"},{"w":"compensate","pos":"v","ko":"보상하다, 메우다","ex":"The airline offered to compensate passengers whose luggage was lost during the international flight.","ans":"compensate","exKo":"항공사는 국제선에서 수하물을 분실한 승객에게 보상하겠다고 제안했다.","syn":["reimburse","make up for","repay"],"ant":[],"lv":1,"cat":"voc"},{"w":"competent","pos":"adj","ko":"유능한, 능숙한","ex":"We are looking for a competent accountant who can manage payroll and prepare monthly reports.","ans":"competent","exKo":"급여 관리와 월간 보고서 작성을 할 수 있는 유능한 회계사를 찾고 있습니다.","syn":["capable","skilled","proficient"],"ant":["incompetent","inept"],"lv":1,"cat":"voc"},{"w":"complement","pos":"v","ko":"보완하다, 덧붙여 완전하게 하다","ex":"The light white wine will complement the seafood dishes served at tonight's dinner party.","ans":"complement","exKo":"가벼운 화이트 와인은 오늘 밤 만찬에서 나오는 해산물 요리와 잘 어울릴 것이다.","syn":["go well with","enhance","supplement"],"ant":["clash with"],"lv":2,"cat":"voc"},{"w":"compliance","pos":"n","ko":"준수, 순응","ex":"Inspectors visit the plant every month to ensure compliance with environmental safety standards.","ans":"compliance","exKo":"검사관들은 환경 안전 기준 준수를 확인하기 위해 매달 공장을 방문한다.","syn":["conformity","adherence","obedience"],"ant":["violation","defiance"],"lv":2,"cat":"voc"},{"w":"comply with","pos":"phr","ko":"(규정을) 따르다, 준수하다","ex":"Restaurants that fail to comply with hygiene regulations may be fined or temporarily closed.","ans":"comply with","exKo":"위생 규정을 따르지 않는 식당은 벌금을 물거나 일시적으로 영업이 정지될 수 있다.","syn":["abide by","obey","conform to"],"ant":["violate","disobey"],"lv":1,"cat":"voc"},{"w":"comprehensive","pos":"adj","ko":"포괄적인, 종합적인","ex":"The hospital offers a comprehensive health checkup that includes blood tests and a full body scan.","ans":"comprehensive","exKo":"그 병원은 혈액 검사와 전신 촬영을 포함한 종합 건강 검진을 제공한다.","syn":["thorough","complete","extensive"],"ant":["partial","limited"],"lv":1,"cat":"voc"},{"w":"comprise","pos":"v","ko":"구성되다, 포함하다","ex":"The advisory board comprises twelve members from academia, industry, and civic organizations.","ans":"comprises","exKo":"자문 위원회는 학계, 산업계, 시민 단체 출신 12명으로 구성된다.","syn":["consist of","include","be made up of"],"ant":[],"lv":2,"cat":"voc"},{"w":"compromise","pos":"n","ko":"타협, 절충","ex":"After weeks of negotiation, the union and management finally reached a compromise on wages.","ans":"compromise","exKo":"몇 주간의 협상 끝에 노조와 경영진은 마침내 임금에 대해 타협에 이르렀다.","syn":["agreement","settlement","middle ground"],"ant":["disagreement"],"lv":1,"cat":"voc"},{"w":"concede","pos":"v","ko":"(마지못해) 인정하다, 양보하다","ex":"The candidate conceded defeat late on election night and congratulated his opponent on the victory.","ans":"conceded","exKo":"그 후보는 선거일 밤늦게 패배를 인정하고 상대의 승리를 축하했다.","syn":["admit","acknowledge","yield"],"ant":["deny","dispute"],"lv":2,"cat":"voc"},{"w":"conceive","pos":"v","ko":"생각해 내다, 상상하다","ex":"The idea for the app was conceived during a casual conversation between two university students.","ans":"conceived","exKo":"그 앱의 아이디어는 대학생 두 명의 가벼운 대화 중에 떠올랐다.","syn":["devise","think up","imagine"],"ant":[],"lv":3,"cat":"voc"},{"w":"concise","pos":"adj","ko":"간결한","ex":"Please keep your cover letter concise and limit it to one page if possible.","ans":"concise","exKo":"자기소개서는 간결하게 쓰고 가능하면 한 장으로 제한해 주세요.","syn":["brief","succinct","short"],"ant":["wordy","lengthy"],"lv":2,"cat":"voc"},{"w":"concur","pos":"v","ko":"동의하다, 일치하다","ex":"Most experts concur that early education has a lasting impact on a child's development.","ans":"concur","exKo":"대부분의 전문가는 조기 교육이 아이의 발달에 지속적인 영향을 미친다는 데 동의한다.","syn":["agree","accord"],"ant":["disagree","differ"],"lv":3,"cat":"voc"},{"w":"condemn","pos":"v","ko":"비난하다, 규탄하다","ex":"World leaders condemned the attack and called for an immediate investigation into the incident.","ans":"condemned","exKo":"세계 지도자들은 그 공격을 규탄하고 사건에 대한 즉각적인 조사를 촉구했다.","syn":["denounce","criticize","censure"],"ant":["praise","approve"],"lv":2,"cat":"voc"},{"w":"confidential","pos":"adj","ko":"기밀의, 은밀한","ex":"All information provided in this survey will be kept strictly confidential and used only for research.","ans":"confidential","exKo":"이 설문에 제공된 모든 정보는 엄격히 기밀로 유지되며 연구에만 사용된다.","syn":["secret","private","classified"],"ant":["public"],"lv":1,"cat":"voc"},{"w":"confine","pos":"v","ko":"제한하다, 가두다","ex":"Please confine your comments to the topic on the agenda so that the meeting ends on time.","ans":"confine","exKo":"회의가 제시간에 끝나도록 의견은 안건 주제로 한정해 주세요.","syn":["limit","restrict","restrain"],"ant":["free","release"],"lv":2,"cat":"voc"},{"w":"conform","pos":"v","ko":"(규칙에) 따르다, 순응하다","ex":"All electrical products sold in the country must conform to national safety standards.","ans":"conform","exKo":"그 나라에서 팔리는 모든 전기 제품은 국가 안전 기준에 맞아야 한다.","syn":["comply","adhere","follow"],"ant":["deviate","rebel"],"lv":2,"cat":"voc"},{"w":"confront","pos":"v","ko":"직면하다, 맞서다","ex":"The new government must confront rising unemployment and a growing national debt.","ans":"confront","exKo":"새 정부는 늘어나는 실업과 커지는 국가 부채에 맞서야 한다.","syn":["face","tackle","challenge"],"ant":["avoid","evade"],"lv":1,"cat":"voc"},{"w":"consecutive","pos":"adj","ko":"연속적인, 잇따른","ex":"The team has won five consecutive games and now leads the league by a wide margin.","ans":"consecutive","exKo":"그 팀은 5연승을 거두어 현재 큰 차이로 리그 선두를 달리고 있다.","syn":["successive","straight","in a row"],"ant":["intermittent"],"lv":2,"cat":"voc"},{"w":"consensus","pos":"n","ko":"합의, 일치된 의견","ex":"There is a growing consensus among scientists that human activity is driving global warming.","ans":"consensus","exKo":"인간 활동이 지구 온난화를 일으키고 있다는 과학자들 사이의 합의가 커지고 있다.","syn":["agreement","accord","unanimity"],"ant":["disagreement","dissent"],"lv":1,"cat":"voc"},{"w":"consent","pos":"n","ko":"동의, 허락","ex":"Patients must give written consent before undergoing any surgical procedure at the clinic.","ans":"consent","exKo":"환자는 그 병원에서 어떤 수술을 받기 전에 서면 동의를 해야 한다.","syn":["permission","approval","agreement"],"ant":["refusal","objection"],"lv":1,"cat":"voc"},{"w":"considerable","pos":"adj","ko":"상당한, 많은","ex":"The project required a considerable amount of time and money, but the results were worth it.","ans":"considerable","exKo":"그 프로젝트에는 상당한 시간과 돈이 들었지만 결과는 그만한 가치가 있었다.","syn":["substantial","significant","sizable"],"ant":["negligible","slight"],"lv":1,"cat":"voc"},{"w":"consistent","pos":"adj","ko":"일관된, 한결같은","ex":"The coach praised her for delivering consistent performances throughout the long season.","ans":"consistent","exKo":"코치는 긴 시즌 내내 한결같은 경기력을 보여 준 그녀를 칭찬했다.","syn":["steady","uniform","constant"],"ant":["inconsistent","erratic"],"lv":1,"cat":"voc"},{"w":"conspicuous","pos":"adj","ko":"눈에 잘 띄는, 뚜렷한","ex":"Warning signs should be placed in conspicuous locations so that every visitor can see them.","ans":"conspicuous","exKo":"경고 표지는 모든 방문객이 볼 수 있도록 눈에 잘 띄는 곳에 두어야 한다.","syn":["noticeable","visible","prominent"],"ant":["inconspicuous","hidden"],"lv":3,"cat":"voc"},{"w":"constitute","pos":"v","ko":"구성하다, ~에 해당하다","ex":"Women now constitute nearly half of the workforce in the country's financial sector.","ans":"constitute","exKo":"현재 여성은 그 나라 금융 부문 인력의 거의 절반을 차지한다.","syn":["make up","form","compose"],"ant":[],"lv":2,"cat":"voc"},{"w":"constraint","pos":"n","ko":"제약, 제한","ex":"Due to time constraints, the speaker had to skip several slides during her presentation.","ans":"constraints","exKo":"시간 제약 때문에 연사는 발표 중 몇 장의 슬라이드를 건너뛰어야 했다.","syn":["limitation","restriction","restraint"],"ant":["freedom"],"lv":2,"cat":"voc"},{"w":"contaminate","pos":"v","ko":"오염시키다","ex":"Chemicals leaking from the abandoned mine have contaminated the river that supplies drinking water.","ans":"contaminated","exKo":"폐광에서 새어 나온 화학 물질이 식수를 공급하는 강을 오염시켰다.","syn":["pollute","taint","infect"],"ant":["purify","cleanse"],"lv":2,"cat":"voc"},{"w":"contemplate","pos":"v","ko":"고려하다, 심사숙고하다","ex":"He is contemplating a career change after spending ten years in the banking industry.","ans":"contemplating","exKo":"그는 은행업계에서 10년을 보낸 후 진로 변경을 고려하고 있다.","syn":["consider","ponder","think about"],"ant":["ignore"],"lv":2,"cat":"voc"},{"w":"contend","pos":"v","ko":"주장하다, 다투다","ex":"Some economists contend that raising the minimum wage will reduce jobs for young workers.","ans":"contend","exKo":"일부 경제학자들은 최저임금 인상이 청년 일자리를 줄일 것이라고 주장한다.","syn":["argue","claim","maintain"],"ant":[],"lv":3,"cat":"voc"},{"w":"contradict","pos":"v","ko":"모순되다, 반박하다","ex":"The witness's statement contradicted the evidence collected by the police at the scene.","ans":"contradicted","exKo":"그 목격자의 진술은 경찰이 현장에서 수집한 증거와 모순되었다.","syn":["conflict with","refute","counter"],"ant":["confirm","support"],"lv":2,"cat":"voc"},{"w":"contribute","pos":"v","ko":"기여하다, 기부하다, ~의 원인이 되다","ex":"Poor sleep habits can contribute to weight gain and a weaker immune system.","ans":"contribute","exKo":"나쁜 수면 습관은 체중 증가와 면역력 약화의 원인이 될 수 있다.","syn":["add to","donate","lead to"],"ant":[],"lv":1,"cat":"voc"},{"w":"controversial","pos":"adj","ko":"논란이 많은","ex":"The controversial decision to close the public hospital sparked protests across the region.","ans":"controversial","exKo":"공공 병원을 폐쇄한다는 논란 많은 결정이 그 지역 전역에서 시위를 촉발했다.","syn":["disputed","contentious","debatable"],"ant":["uncontroversial"],"lv":1,"cat":"voc"},{"w":"convene","pos":"v","ko":"(회의를) 소집하다, 모이다","ex":"The board of directors will convene next Tuesday to discuss the proposed merger.","ans":"convene","exKo":"이사회는 제안된 합병을 논의하기 위해 다음 주 화요일에 소집된다.","syn":["assemble","gather","summon"],"ant":["adjourn","disband"],"lv":3,"cat":"voc"},{"w":"convey","pos":"v","ko":"전달하다, 나르다","ex":"Good writers use simple language to convey complex ideas clearly to a general audience.","ans":"convey","exKo":"좋은 작가는 쉬운 말로 복잡한 생각을 일반 독자에게 명확히 전달한다.","syn":["communicate","express","transmit"],"ant":[],"lv":1,"cat":"voc"},{"w":"cope with","pos":"phr","ko":"대처하다, 극복하다","ex":"Many hospitals are struggling to cope with the sudden increase in flu patients this winter.","ans":"cope with","exKo":"많은 병원이 이번 겨울 독감 환자의 갑작스러운 증가에 대처하느라 애쓰고 있다.","syn":["deal with","handle","manage"],"ant":["give in to"],"lv":1,"cat":"voc"},{"w":"correspond","pos":"v","ko":"일치하다, 서신을 주고받다","ex":"The numbers in your receipt do not correspond to the amount charged on your credit card.","ans":"correspond","exKo":"영수증의 숫자가 신용카드로 청구된 금액과 일치하지 않는다.","syn":["match","agree with","coincide"],"ant":["differ"],"lv":2,"cat":"voc"},{"w":"counterpart","pos":"n","ko":"상대, 대응 관계에 있는 사람","ex":"The foreign minister will meet his Japanese counterpart in Tokyo to discuss trade issues.","ans":"counterpart","exKo":"외무장관은 무역 문제를 논의하기 위해 도쿄에서 일본 외무장관을 만날 것이다.","syn":["equivalent","peer","opposite number"],"ant":[],"lv":2,"cat":"voc"},{"w":"credible","pos":"adj","ko":"믿을 만한, 신뢰할 수 있는","ex":"Journalists must rely on credible sources and verify facts before publishing a story.","ans":"credible","exKo":"기자는 기사를 내기 전에 믿을 만한 출처에 의존하고 사실을 확인해야 한다.","syn":["believable","reliable","trustworthy"],"ant":["unreliable","implausible"],"lv":1,"cat":"voc"},{"w":"crucial","pos":"adj","ko":"매우 중요한, 결정적인","ex":"Regular maintenance is crucial for keeping older aircraft safe and reliable over time.","ans":"crucial","exKo":"정기 정비는 오래된 항공기를 오랫동안 안전하고 믿을 수 있게 유지하는 데 매우 중요하다.","syn":["vital","essential","critical"],"ant":["trivial","minor"],"lv":1,"cat":"voc"},{"w":"curb","pos":"v","ko":"억제하다, 제한하다","ex":"The central bank raised interest rates again in an effort to curb rising inflation.","ans":"curb","exKo":"중앙은행은 오르는 물가를 억제하기 위해 다시 금리를 올렸다.","syn":["restrain","limit","control"],"ant":["encourage","boost"],"lv":1,"cat":"voc"},{"w":"defer","pos":"v","ko":"미루다, 연기하다","ex":"Students facing financial hardship may apply to defer their tuition payment until next semester.","ans":"defer","exKo":"경제적 어려움을 겪는 학생은 등록금 납부를 다음 학기로 미루도록 신청할 수 있다.","syn":["postpone","delay","put off"],"ant":["expedite"],"lv":2,"cat":"voc"},{"w":"deficit","pos":"n","ko":"적자, 부족","ex":"The country's trade deficit widened as imports of energy grew faster than exports.","ans":"deficit","exKo":"에너지 수입이 수출보다 빠르게 늘면서 그 나라의 무역 적자가 커졌다.","syn":["shortfall","shortage","loss"],"ant":["surplus"],"lv":1,"cat":"voc"},{"w":"delegate","pos":"v","ko":"위임하다, 대표로 파견하다","ex":"Effective managers know how to delegate routine tasks so they can focus on long-term planning.","ans":"delegate","exKo":"유능한 관리자는 일상 업무를 위임해 장기 계획에 집중하는 법을 안다.","syn":["assign","entrust","hand over"],"ant":[],"lv":2,"cat":"voc"},{"w":"deliberate","pos":"adj","ko":"고의적인, 신중한","ex":"Police believe the fire was a deliberate act rather than an accident caused by faulty equipment.","ans":"deliberate","exKo":"경찰은 그 화재가 장비 결함으로 인한 사고가 아니라 고의적인 행위라고 보고 있다.","syn":["intentional","planned","careful"],"ant":["accidental","unintentional"],"lv":1,"cat":"voc"},{"w":"demolish","pos":"v","ko":"철거하다, 파괴하다","ex":"The city plans to demolish the old stadium and build an apartment complex on the site.","ans":"demolish","exKo":"시는 오래된 경기장을 철거하고 그 자리에 아파트 단지를 지을 계획이다.","syn":["tear down","destroy","raze"],"ant":["build","construct"],"lv":2,"cat":"voc"},{"w":"denounce","pos":"v","ko":"공개적으로 비난하다","ex":"Human rights groups denounced the arrests of journalists who had criticized the government.","ans":"denounced","exKo":"인권 단체들은 정부를 비판한 기자들의 체포를 공개적으로 비난했다.","syn":["condemn","criticize","censure"],"ant":["praise","endorse"],"lv":3,"cat":"voc"},{"w":"deplete","pos":"v","ko":"고갈시키다, 대폭 줄이다","ex":"Overfishing has severely depleted fish stocks in many parts of the Pacific Ocean.","ans":"depleted","exKo":"남획으로 태평양 여러 지역의 어류 자원이 심각하게 고갈되었다.","syn":["exhaust","drain","use up"],"ant":["replenish","restore"],"lv":2,"cat":"voc"},{"w":"deprive","pos":"v","ko":"빼앗다, 박탈하다","ex":"Long working hours deprive many parents of the chance to spend time with their children.","ans":"deprive","exKo":"긴 근무 시간은 많은 부모에게서 아이와 시간을 보낼 기회를 빼앗는다.","syn":["rob","strip","deny"],"ant":["provide","supply"],"lv":2,"cat":"voc"},{"w":"designate","pos":"v","ko":"지정하다, 지명하다","ex":"The area has been designated as a protected zone where hunting and fishing are prohibited.","ans":"designated","exKo":"그 지역은 사냥과 낚시가 금지된 보호 구역으로 지정되었다.","syn":["appoint","assign","name"],"ant":[],"lv":2,"cat":"voc"},{"w":"deteriorate","pos":"v","ko":"악화되다, 나빠지다","ex":"The patient's condition began to deteriorate rapidly, so doctors moved him to intensive care.","ans":"deteriorate","exKo":"환자의 상태가 급격히 악화되기 시작해서 의사들은 그를 중환자실로 옮겼다.","syn":["worsen","decline","degenerate"],"ant":["improve"],"lv":1,"cat":"voc"},{"w":"deter","pos":"v","ko":"단념시키다, 억제하다","ex":"Security cameras were installed in the parking lot to deter theft and vandalism at night.","ans":"deter","exKo":"야간 절도와 기물 파손을 막기 위해 주차장에 보안 카메라가 설치되었다.","syn":["discourage","prevent","dissuade"],"ant":["encourage"],"lv":2,"cat":"voc"},{"w":"detrimental","pos":"adj","ko":"해로운, 불리한","ex":"Spending too much time on smartphones can be detrimental to teenagers' sleep and concentration.","ans":"detrimental","exKo":"스마트폰에 너무 많은 시간을 쓰면 십 대의 수면과 집중력에 해로울 수 있다.","syn":["harmful","damaging","adverse"],"ant":["beneficial"],"lv":2,"cat":"voc"},{"w":"devastate","pos":"v","ko":"황폐화하다, 큰 충격을 주다","ex":"The earthquake devastated several coastal towns and left thousands of people without homes.","ans":"devastated","exKo":"지진은 여러 해안 마을을 황폐화하고 수천 명을 집 없이 만들었다.","syn":["destroy","ruin","wreck"],"ant":["rebuild"],"lv":2,"cat":"voc"},{"w":"dilemma","pos":"n","ko":"딜레마, 진퇴양난","ex":"Many graduates face the dilemma of choosing between a stable job and a career they love.","ans":"dilemma","exKo":"많은 졸업생은 안정된 직업과 좋아하는 진로 중 하나를 골라야 하는 딜레마에 놓인다.","syn":["predicament","quandary"],"ant":[],"lv":2,"cat":"voc"},{"w":"diligent","pos":"adj","ko":"부지런한, 성실한","ex":"Thanks to her diligent research, the team discovered an error that had gone unnoticed for years.","ans":"diligent","exKo":"그녀의 성실한 조사 덕분에 팀은 수년간 발견되지 않았던 오류를 찾아냈다.","syn":["hardworking","industrious","thorough"],"ant":["lazy","negligent"],"lv":1,"cat":"voc"},{"w":"diminish","pos":"v","ko":"줄어들다, 약화시키다","ex":"The painkillers will diminish the discomfort, but they will not cure the underlying problem.","ans":"diminish","exKo":"진통제는 불편함을 줄여 주겠지만 근본적인 문제를 고치지는 못한다.","syn":["reduce","lessen","decrease"],"ant":["increase","enhance"],"lv":1,"cat":"voc"},{"w":"discern","pos":"v","ko":"분별하다, 알아차리다","ex":"In the thick fog, drivers could barely discern the road signs ahead of them.","ans":"discern","exKo":"짙은 안개 속에서 운전자들은 앞의 도로 표지판을 거의 알아볼 수 없었다.","syn":["perceive","detect","distinguish"],"ant":["overlook"],"lv":3,"cat":"voc"},{"w":"disclose","pos":"v","ko":"공개하다, 밝히다","ex":"The company refused to disclose the terms of the agreement, citing confidentiality reasons.","ans":"disclose","exKo":"그 회사는 기밀 유지를 이유로 계약 조건 공개를 거부했다.","syn":["reveal","divulge","make known"],"ant":["conceal","hide"],"lv":1,"cat":"voc"},{"w":"discrepancy","pos":"n","ko":"불일치, 차이","ex":"The auditor found a discrepancy between the inventory records and the actual stock in the warehouse.","ans":"discrepancy","exKo":"감사관은 재고 기록과 창고의 실제 재고 사이의 불일치를 발견했다.","syn":["inconsistency","difference","mismatch"],"ant":["agreement","consistency"],"lv":2,"cat":"voc"},{"w":"disperse","pos":"v","ko":"흩어지다, 해산시키다","ex":"The crowd began to disperse slowly after the police announced that the concert had been canceled.","ans":"disperse","exKo":"경찰이 콘서트 취소를 발표하자 군중은 천천히 흩어지기 시작했다.","syn":["scatter","spread","dissipate"],"ant":["gather","assemble"],"lv":3,"cat":"voc"},{"w":"disrupt","pos":"v","ko":"방해하다, 지장을 주다","ex":"The heavy snowstorm disrupted train services and forced many schools to close for the day.","ans":"disrupted","exKo":"폭설은 열차 운행에 지장을 주었고 많은 학교가 하루 휴교했다.","syn":["interrupt","disturb","upset"],"ant":["maintain"],"lv":1,"cat":"voc"},{"w":"distinguish","pos":"v","ko":"구별하다, 두드러지게 하다","ex":"Young children often find it hard to distinguish between advertisements and regular television programs.","ans":"distinguish","exKo":"어린아이들은 광고와 일반 텔레비전 프로그램을 구별하기 어려워하는 경우가 많다.","syn":["differentiate","tell apart","discriminate"],"ant":["confuse"],"lv":1,"cat":"voc"},{"w":"dominate","pos":"v","ko":"지배하다, 우세하다","ex":"A few large companies dominate the smartphone market, making it difficult for newcomers to compete.","ans":"dominate","exKo":"몇몇 대기업이 스마트폰 시장을 지배해서 신규 업체가 경쟁하기 어렵다.","syn":["control","rule","prevail"],"ant":[],"lv":1,"cat":"voc"},{"w":"drastic","pos":"adj","ko":"과감한, 급격한","ex":"The hospital took drastic measures, including canceling all visits, to stop the virus from spreading.","ans":"drastic","exKo":"병원은 바이러스 확산을 막기 위해 모든 면회 취소를 포함한 과감한 조치를 취했다.","syn":["radical","extreme","severe"],"ant":["mild","moderate"],"lv":1,"cat":"voc"},{"w":"dubious","pos":"adj","ko":"의심스러운, 미심쩍은","ex":"Consumers should be careful about dubious websites that offer luxury goods at extremely low prices.","ans":"dubious","exKo":"소비자는 명품을 지나치게 싼 값에 파는 의심스러운 웹사이트를 조심해야 한다.","syn":["doubtful","suspicious","questionable"],"ant":["reliable","trustworthy"],"lv":2,"cat":"voc"},{"w":"durable","pos":"adj","ko":"내구성 있는, 오래가는","ex":"These hiking boots are made of durable leather that can withstand rough mountain trails.","ans":"durable","exKo":"이 등산화는 험한 산길을 견딜 수 있는 튼튼한 가죽으로 만들어졌다.","syn":["sturdy","long-lasting","tough"],"ant":["fragile","flimsy"],"lv":1,"cat":"voc"},{"w":"dwindle","pos":"v","ko":"점점 줄어들다","ex":"The village population has dwindled to fewer than two hundred as young people move to cities.","ans":"dwindled","exKo":"젊은이들이 도시로 떠나면서 마을 인구는 200명 미만으로 줄어들었다.","syn":["shrink","decrease","diminish"],"ant":["grow","increase"],"lv":2,"cat":"voc"},{"w":"defy","pos":"v","ko":"거역하다, 무시하다","ex":"Thousands of protesters defied the government's order and gathered in the main square.","ans":"defied","exKo":"수천 명의 시위대가 정부 명령을 거스르고 중앙 광장에 모였다.","syn":["disobey","resist","challenge"],"ant":["obey","comply"],"lv":2,"cat":"voc"},{"w":"deduct","pos":"v","ko":"공제하다, 빼다","ex":"The cost of the damaged equipment will be deducted from your security deposit when you move out.","ans":"deducted","exKo":"파손된 장비 비용은 이사 나갈 때 보증금에서 공제될 것이다.","syn":["subtract","take off","withhold"],"ant":["add"],"lv":2,"cat":"voc"},{"w":"deem","pos":"v","ko":"(~으로) 여기다, 간주하다","ex":"The building was deemed unsafe after inspectors found cracks in its main support columns.","ans":"deemed","exKo":"검사관들이 주 기둥에서 균열을 발견한 뒤 그 건물은 안전하지 않은 것으로 판정되었다.","syn":["consider","regard","judge"],"ant":[],"lv":2,"cat":"voc"},{"w":"default","pos":"v","ko":"채무를 이행하지 않다","ex":"Analysts fear that the struggling developer may default on its loans by the end of the year.","ans":"default","exKo":"분석가들은 어려움을 겪는 그 개발사가 연말까지 대출을 갚지 못할까 우려한다.","syn":["fail to pay","renege"],"ant":["pay","repay"],"lv":3,"cat":"voc"},{"w":"delinquent","pos":"adj","ko":"(세금 등이) 연체된, 비행의","ex":"Customers with delinquent accounts will not be able to make new purchases until they pay.","ans":"delinquent","exKo":"연체된 계정이 있는 고객은 대금을 낼 때까지 새로 구매할 수 없다.","syn":["overdue","in arrears","unpaid"],"ant":["paid up"],"lv":3,"cat":"voc"},{"w":"elaborate","pos":"v","ko":"자세히 설명하다","ex":"The spokesperson declined to elaborate on the reasons behind the chief executive's sudden resignation.","ans":"elaborate","exKo":"대변인은 최고경영자의 갑작스러운 사임 이유에 대해 자세히 설명하기를 거부했다.","syn":["expand on","explain","detail"],"ant":["summarize","condense"],"lv":1,"cat":"voc"},{"w":"eligible","pos":"adj","ko":"자격이 있는, 적격의","ex":"Only full-time employees who have worked here for a year are eligible for the bonus program.","ans":"eligible","exKo":"이곳에서 1년 이상 근무한 정규직 직원만 보너스 제도의 대상이 된다.","syn":["qualified","entitled","suitable"],"ant":["ineligible","unqualified"],"lv":1,"cat":"voc"},{"w":"eliminate","pos":"v","ko":"제거하다, 없애다","ex":"The new automated system will eliminate many errors caused by manual data entry.","ans":"eliminate","exKo":"새 자동화 시스템은 수작업 데이터 입력으로 생기는 많은 오류를 없앨 것이다.","syn":["remove","get rid of","eradicate"],"ant":["add","include"],"lv":1,"cat":"voc"},{"w":"eloquent","pos":"adj","ko":"웅변의, 설득력 있는","ex":"Her eloquent speech about education inequality moved many members of the audience to tears.","ans":"eloquent","exKo":"교육 불평등에 관한 그녀의 설득력 있는 연설은 많은 청중을 울렸다.","syn":["articulate","persuasive","expressive"],"ant":["inarticulate"],"lv":3,"cat":"voc"},{"w":"embark on","pos":"phr","ko":"착수하다, 시작하다","ex":"The company is about to embark on an ambitious expansion into Southeast Asian markets.","ans":"embark on","exKo":"그 회사는 동남아시아 시장으로의 야심 찬 확장에 막 착수하려 한다.","syn":["begin","undertake","launch"],"ant":["finish","abandon"],"lv":2,"cat":"voc"},{"w":"embrace","pos":"v","ko":"받아들이다, 포옹하다","ex":"Older workers are increasingly willing to embrace new technology to stay competitive in the job market.","ans":"embrace","exKo":"나이 든 근로자들도 구직 시장에서 경쟁력을 유지하기 위해 점점 더 기꺼이 새 기술을 받아들인다.","syn":["adopt","accept","welcome"],"ant":["reject","resist"],"lv":1,"cat":"voc"},{"w":"emerge","pos":"v","ko":"나타나다, 부상하다","ex":"New details have emerged about the cause of the power outage that affected the entire city.","ans":"emerged","exKo":"도시 전체에 영향을 준 정전의 원인에 대한 새로운 세부 사항이 드러났다.","syn":["appear","surface","arise"],"ant":["disappear","vanish"],"lv":1,"cat":"voc"},{"w":"emit","pos":"v","ko":"(빛·가스 등을) 내뿜다, 배출하다","ex":"Older diesel trucks emit far more pollutants than newer models equipped with modern filters.","ans":"emit","exKo":"오래된 디젤 트럭은 최신 필터를 갖춘 신형보다 훨씬 많은 오염 물질을 배출한다.","syn":["release","discharge","give off"],"ant":["absorb"],"lv":2,"cat":"voc"},{"w":"enact","pos":"v","ko":"(법을) 제정하다","ex":"The parliament enacted a law requiring all new buildings to install solar panels on their roofs.","ans":"enacted","exKo":"의회는 모든 신축 건물 지붕에 태양광 패널 설치를 의무화하는 법을 제정했다.","syn":["pass","legislate","establish"],"ant":["repeal","abolish"],"lv":2,"cat":"voc"},{"w":"encounter","pos":"v","ko":"(뜻밖에) 마주치다, 겪다","ex":"If you encounter any problems while installing the program, please contact our technical support team.","ans":"encounter","exKo":"프로그램을 설치하다가 문제가 생기면 기술 지원팀에 연락해 주세요.","syn":["face","come across","experience"],"ant":["avoid"],"lv":1,"cat":"voc"},{"w":"endorse","pos":"v","ko":"지지하다, 보증하다, (광고) 홍보하다","ex":"Several famous athletes have been paid millions of dollars to endorse the new sports drink.","ans":"endorse","exKo":"몇몇 유명 운동선수가 새 스포츠음료를 홍보하는 대가로 수백만 달러를 받았다.","syn":["support","back","approve"],"ant":["oppose","reject"],"lv":1,"cat":"voc"},{"w":"endure","pos":"v","ko":"견디다, 참다","ex":"Residents had to endure weeks of noise and dust while the road was being repaired.","ans":"endure","exKo":"주민들은 도로 보수 공사 동안 몇 주간 소음과 먼지를 견뎌야 했다.","syn":["bear","tolerate","withstand"],"ant":["give in"],"lv":1,"cat":"voc"},{"w":"enforce","pos":"v","ko":"(법을) 시행하다, 집행하다","ex":"The police have started to enforce the new speed limit near schools more strictly.","ans":"enforce","exKo":"경찰은 학교 주변의 새 제한 속도를 더 엄격히 단속하기 시작했다.","syn":["implement","impose","apply"],"ant":["waive"],"lv":1,"cat":"voc"},{"w":"enhance","pos":"v","ko":"향상시키다, 높이다","ex":"The hotel renovated its lobby and rooms to enhance the overall experience of its guests.","ans":"enhance","exKo":"그 호텔은 투숙객의 전반적인 경험을 높이기 위해 로비와 객실을 보수했다.","syn":["improve","boost","strengthen"],"ant":["diminish","weaken"],"lv":1,"cat":"voc"},{"w":"entail","pos":"v","ko":"수반하다, 필요로 하다","ex":"The position entails frequent travel abroad, so candidates must hold a valid passport.","ans":"entails","exKo":"그 직책은 잦은 해외 출장을 수반하므로 지원자는 유효한 여권을 가지고 있어야 한다.","syn":["involve","require","necessitate"],"ant":[],"lv":2,"cat":"voc"},{"w":"entitle","pos":"v","ko":"자격을 주다","ex":"This coupon will entitle you to a free dessert with any main course at our restaurant.","ans":"entitle","exKo":"이 쿠폰이 있으면 저희 식당에서 주요리를 주문할 때 디저트를 무료로 받을 수 있다.","syn":["qualify","authorize","allow"],"ant":["disqualify"],"lv":1,"cat":"voc"},{"w":"equivalent","pos":"adj","ko":"동등한, 상응하는","ex":"A degree from a foreign university may be accepted if it is equivalent to a local bachelor's degree.","ans":"equivalent","exKo":"외국 대학의 학위는 국내 학사 학위와 동등하면 인정될 수 있다.","syn":["equal","comparable","corresponding"],"ant":["different","unequal"],"lv":1,"cat":"voc"},{"w":"eradicate","pos":"v","ko":"근절하다, 뿌리 뽑다","ex":"International health organizations hope to eradicate the disease completely within the next decade.","ans":"eradicate","exKo":"국제 보건 기구들은 향후 10년 안에 그 질병을 완전히 근절하기를 바란다.","syn":["eliminate","wipe out","abolish"],"ant":["spread"],"lv":2,"cat":"voc"},{"w":"erode","pos":"v","ko":"침식하다, 약화시키다","ex":"Repeated political scandals have steadily eroded public trust in the country's political institutions.","ans":"eroded","exKo":"잇따른 스캔들이 그 나라 정치 제도에 대한 대중의 신뢰를 약화시켰다.","syn":["wear away","weaken","undermine"],"ant":["strengthen","build"],"lv":2,"cat":"voc"},{"w":"escalate","pos":"v","ko":"확대되다, 고조되다","ex":"Diplomats are working hard to prevent the border dispute from escalating into a full-scale war.","ans":"escalating","exKo":"외교관들은 국경 분쟁이 전면전으로 확대되지 않도록 애쓰고 있다.","syn":["intensify","worsen","increase"],"ant":["de-escalate","subside"],"lv":2,"cat":"voc"},{"w":"evacuate","pos":"v","ko":"대피시키다, 비우다","ex":"Authorities ordered residents to evacuate the coastal area as the typhoon approached the island.","ans":"evacuate","exKo":"태풍이 섬에 다가오자 당국은 주민들에게 해안 지역에서 대피하라고 명령했다.","syn":["leave","vacate","clear"],"ant":["occupy","enter"],"lv":1,"cat":"voc"},{"w":"evoke","pos":"v","ko":"(감정·기억을) 불러일으키다","ex":"The smell of freshly baked bread can evoke warm memories of childhood for many people.","ans":"evoke","exKo":"갓 구운 빵 냄새는 많은 사람에게 어린 시절의 따뜻한 기억을 불러일으킬 수 있다.","syn":["arouse","bring to mind","elicit"],"ant":["suppress"],"lv":3,"cat":"voc"},{"w":"exceed","pos":"v","ko":"초과하다, 넘다","ex":"Passengers whose luggage exceeds the weight limit will have to pay an additional fee.","ans":"exceeds","exKo":"수하물이 무게 제한을 초과하는 승객은 추가 요금을 내야 한다.","syn":["surpass","go beyond","outdo"],"ant":["fall short of"],"lv":1,"cat":"voc"},{"w":"excessive","pos":"adj","ko":"과도한, 지나친","ex":"Excessive use of antibiotics has led to the spread of drug-resistant bacteria worldwide.","ans":"Excessive","exKo":"항생제의 과도한 사용은 전 세계적으로 약물 내성 세균의 확산을 불러왔다.","syn":["too much","extreme","undue"],"ant":["moderate","reasonable"],"lv":1,"cat":"voc"},{"w":"exempt","pos":"adj","ko":"면제된","ex":"Small businesses with annual sales below a certain level are exempt from the new tax.","ans":"exempt","exKo":"연 매출이 일정 수준 미만인 소규모 사업체는 새 세금이 면제된다.","syn":["free","excused","immune"],"ant":["liable","subject to"],"lv":2,"cat":"voc"},{"w":"exhaust","pos":"v","ko":"다 써 버리다, 지치게 하다","ex":"The rescue team had nearly exhausted its supplies by the time help finally arrived.","ans":"exhausted","exKo":"마침내 지원이 도착했을 때 구조대는 물자를 거의 다 써 버린 상태였다.","syn":["use up","deplete","tire out"],"ant":["replenish","refresh"],"lv":1,"cat":"voc"},{"w":"expedite","pos":"v","ko":"신속히 처리하다, 촉진하다","ex":"For an additional fee, the embassy can expedite the visa process to three working days.","ans":"expedite","exKo":"추가 요금을 내면 대사관은 비자 처리를 영업일 3일로 앞당겨 줄 수 있다.","syn":["speed up","hasten","accelerate"],"ant":["delay","hinder"],"lv":2,"cat":"voc"},{"w":"explicit","pos":"adj","ko":"명시적인, 분명한","ex":"The manual gives explicit instructions on how to assemble the furniture without any special tools.","ans":"explicit","exKo":"설명서는 특별한 도구 없이 가구를 조립하는 방법을 명확하게 안내한다.","syn":["clear","specific","direct"],"ant":["implicit","vague"],"lv":1,"cat":"voc"},{"w":"exploit","pos":"v","ko":"착취하다, (잘) 활용하다","ex":"The report revealed that some factories exploit migrant workers by paying them far below the minimum wage.","ans":"exploit","exKo":"보고서는 일부 공장이 이주 노동자에게 최저임금보다 훨씬 낮은 임금을 주며 착취한다는 사실을 밝혔다.","syn":["take advantage of","abuse","utilize"],"ant":[],"lv":2,"cat":"voc"},{"w":"extensive","pos":"adj","ko":"광범위한, 대규모의","ex":"The storm caused extensive damage to farms and roads throughout the southern part of the country.","ans":"extensive","exKo":"폭풍은 그 나라 남부 전역의 농장과 도로에 광범위한 피해를 입혔다.","syn":["widespread","broad","vast"],"ant":["limited","narrow"],"lv":1,"cat":"voc"},{"w":"extinct","pos":"adj","ko":"멸종된, (화산이) 활동을 멈춘","ex":"Scientists warn that many species of frogs could become extinct within the next few decades.","ans":"extinct","exKo":"과학자들은 많은 개구리 종이 앞으로 수십 년 안에 멸종할 수 있다고 경고한다.","syn":["vanished","died out"],"ant":["living","extant"],"lv":2,"cat":"voc"},{"w":"expire","pos":"v","ko":"(기한이) 만료되다","ex":"Your membership will expire at the end of this month unless you renew it online.","ans":"expire","exKo":"온라인으로 갱신하지 않으면 회원 자격이 이달 말에 만료된다.","syn":["run out","lapse","end"],"ant":["renew","begin"],"lv":1,"cat":"voc"},{"w":"acclaim","pos":"n","ko":"찬사, 호평","ex":"The director's latest film received wide critical acclaim and won several international awards.","ans":"acclaim","exKo":"그 감독의 최신 영화는 평단의 폭넓은 호평을 받았고 여러 국제상을 받았다.","syn":["praise","applause","approval"],"ant":["criticism"],"lv":3,"cat":"voc"},{"w":"adverse","pos":"adj","ko":"불리한, 부정적인","ex":"The drug was withdrawn from the market after several patients reported adverse side effects.","ans":"adverse","exKo":"여러 환자가 부작용을 보고한 뒤 그 약은 시장에서 회수되었다.","syn":["harmful","unfavorable","negative"],"ant":["favorable","beneficial"],"lv":1,"cat":"voc"},{"w":"bolster","pos":"v","ko":"강화하다, 북돋우다","ex":"The government cut taxes in an attempt to bolster consumer spending during the recession.","ans":"bolster","exKo":"정부는 경기 침체기에 소비 지출을 북돋우려고 세금을 인하했다.","syn":["strengthen","reinforce","support"],"ant":["weaken","undermine"],"lv":3,"cat":"voc"},{"w":"clientele","pos":"n","ko":"고객층","ex":"The boutique hotel has built a loyal clientele of business travelers who appreciate its quiet location.","ans":"clientele","exKo":"그 부티크 호텔은 조용한 위치를 좋아하는 출장객들로 충성 고객층을 쌓았다.","syn":["customers","patrons","clients"],"ant":[],"lv":3,"cat":"voc"},{"w":"complimentary","pos":"adj","ko":"무료의, 칭찬하는","ex":"All guests staying at the hotel receive complimentary breakfast and access to the fitness center.","ans":"complimentary","exKo":"호텔 투숙객은 모두 무료 조식과 피트니스 센터 이용 혜택을 받는다.","syn":["free","courtesy","flattering"],"ant":["paid","critical"],"lv":1,"cat":"voc"},{"w":"courteous","pos":"adj","ko":"공손한, 예의 바른","ex":"The staff were courteous and patient even when dealing with customers who were angry about the delay.","ans":"courteous","exKo":"직원들은 지연에 화가 난 고객을 응대할 때도 공손하고 참을성이 있었다.","syn":["polite","respectful","civil"],"ant":["rude","impolite"],"lv":2,"cat":"voc"},{"w":"customary","pos":"adj","ko":"관례적인, 습관적인","ex":"In many countries, it is customary to leave a tip of about fifteen percent at restaurants.","ans":"customary","exKo":"많은 나라에서는 식당에서 약 15%의 팁을 남기는 것이 관례이다.","syn":["usual","traditional","conventional"],"ant":["unusual"],"lv":2,"cat":"voc"},{"w":"decisive","pos":"adj","ko":"결정적인, 단호한","ex":"Strong leadership and decisive action helped the company recover quickly from the crisis.","ans":"decisive","exKo":"강한 리더십과 단호한 행동 덕분에 회사는 위기에서 빠르게 회복했다.","syn":["determined","resolute","conclusive"],"ant":["indecisive","hesitant"],"lv":2,"cat":"voc"},{"w":"dispute","pos":"n","ko":"분쟁, 논쟁","ex":"The two neighbors took their dispute over the property line to court after years of arguing.","ans":"dispute","exKo":"두 이웃은 수년간 다툰 끝에 땅 경계를 둘러싼 분쟁을 법정으로 가져갔다.","syn":["conflict","argument","disagreement"],"ant":["agreement"],"lv":1,"cat":"voc"},{"w":"dismiss","pos":"v","ko":"묵살하다, 해고하다","ex":"The judge dismissed the case due to a lack of evidence, and the defendant was released.","ans":"dismissed","exKo":"판사는 증거 부족으로 소송을 기각했고 피고인은 풀려났다.","syn":["reject","discharge","fire"],"ant":["accept","hire"],"lv":1,"cat":"voc"},{"w":"dispose of","pos":"phr","ko":"처리하다, 없애다","ex":"Residents are asked to dispose of old batteries at designated collection points, not in regular trash.","ans":"dispose of","exKo":"주민들은 오래된 배터리를 일반 쓰레기가 아니라 지정된 수거함에 버려 달라는 요청을 받는다.","syn":["get rid of","discard","throw away"],"ant":["keep"],"lv":2,"cat":"voc"},{"w":"downturn","pos":"n","ko":"(경기) 하강, 침체","ex":"Many small shops were forced to close during the economic downturn that began two years ago.","ans":"downturn","exKo":"2년 전 시작된 경기 침체기 동안 많은 작은 가게가 문을 닫아야 했다.","syn":["recession","decline","slump"],"ant":["upturn","boom"],"lv":2,"cat":"voc"},{"w":"exclusive","pos":"adj","ko":"독점적인, 배타적인, 고급의","ex":"Members of the loyalty program get exclusive access to sales before they open to the public.","ans":"exclusive","exKo":"고객 우대 프로그램 회원은 일반 공개 전에 할인 행사를 독점적으로 이용할 수 있다.","syn":["sole","restricted","private"],"ant":["inclusive","shared"],"lv":1,"cat":"voc"},{"w":"enclose","pos":"v","ko":"동봉하다, 둘러싸다","ex":"Please enclose a copy of your receipt with the returned item so that we can process your refund.","ans":"enclose","exKo":"환불 처리를 위해 반품 물품에 영수증 사본을 동봉해 주세요.","syn":["include","attach","surround"],"ant":[],"lv":2,"cat":"voc"},{"w":"enlighten","pos":"v","ko":"계몽하다, 깨우치다","ex":"The documentary aims to enlighten viewers about the hidden costs of fast fashion.","ans":"enlighten","exKo":"그 다큐멘터리는 패스트 패션의 숨겨진 대가에 대해 시청자를 깨우치는 것을 목표로 한다.","syn":["inform","educate","illuminate"],"ant":["confuse"],"lv":3,"cat":"voc"},{"w":"envision","pos":"v","ko":"마음속에 그리다, 구상하다","ex":"The architect envisions a city center where cars are replaced by bicycles and green spaces.","ans":"envisions","exKo":"그 건축가는 자동차 대신 자전거와 녹지가 들어선 도심을 구상한다.","syn":["imagine","foresee","picture"],"ant":[],"lv":3,"cat":"voc"},{"w":"exceptional","pos":"adj","ko":"뛰어난, 예외적인","ex":"The scholarship is awarded to students who show exceptional talent in science or mathematics.","ans":"exceptional","exKo":"그 장학금은 과학이나 수학에서 뛰어난 재능을 보이는 학생에게 수여된다.","syn":["outstanding","remarkable","extraordinary"],"ant":["ordinary","average"],"lv":2,"cat":"voc"},{"w":"cumbersome","pos":"adj","ko":"번거로운, 거추장스러운","ex":"Many users found the old registration process cumbersome because it required printing several forms.","ans":"cumbersome","exKo":"많은 이용자가 옛 등록 절차가 여러 양식을 출력해야 해서 번거롭다고 느꼈다.","syn":["awkward","unwieldy","troublesome"],"ant":["convenient","handy"],"lv":3,"cat":"voc"},{"w":"curtail","pos":"v","ko":"축소하다, 단축하다","ex":"The airline had to curtail its international routes because of soaring fuel costs.","ans":"curtail","exKo":"그 항공사는 치솟는 연료비 때문에 국제선 노선을 축소해야 했다.","syn":["cut back","reduce","restrict"],"ant":["extend","expand"],"lv":3,"cat":"voc"},{"w":"dispatch","pos":"v","ko":"보내다, 파견하다","ex":"The store will dispatch your order within two business days after the payment is confirmed.","ans":"dispatch","exKo":"그 매장은 결제가 확인된 뒤 영업일 2일 안에 주문품을 발송할 것이다.","syn":["send","ship","deploy"],"ant":["receive"],"lv":2,"cat":"voc"},{"w":"discount","pos":"v","ko":"무시하다, 대수롭지 않게 여기다","ex":"Experts warn investors not to discount the possibility of another sharp fall in housing prices.","ans":"discount","exKo":"전문가들은 투자자들에게 집값이 또 급락할 가능성을 가볍게 보지 말라고 경고한다.","syn":["disregard","dismiss","ignore"],"ant":["consider"],"lv":3,"cat":"voc"},{"w":"brisk","pos":"adj","ko":"활발한, 빠른","ex":"Sales of winter clothing were brisk this month as temperatures dropped earlier than usual.","ans":"brisk","exKo":"기온이 평소보다 일찍 떨어지면서 이번 달 겨울옷 판매가 활발했다.","syn":["lively","busy","quick"],"ant":["slow","sluggish"],"lv":3,"cat":"voc"},{"w":"altruistic","pos":"adj","ko":"이타적인","ex":"Volunteers who work at the shelter every weekend are motivated by purely altruistic reasons.","ans":"altruistic","exKo":"매 주말 보호소에서 일하는 자원봉사자들은 순수하게 이타적인 이유로 움직인다.","syn":["selfless","generous","unselfish"],"ant":["selfish"],"lv":3,"cat":"voc"},{"w":"chaotic","pos":"adj","ko":"혼란스러운","ex":"The airport became chaotic after hundreds of flights were canceled because of the snowstorm.","ans":"chaotic","exKo":"눈보라로 수백 편의 항공편이 취소된 뒤 공항은 혼란에 빠졌다.","syn":["disorderly","confused","messy"],"ant":["orderly","calm"],"lv":2,"cat":"voc"},{"w":"depict","pos":"v","ko":"묘사하다, 그리다","ex":"The novel depicts the daily lives of factory workers during the early years of industrialization.","ans":"depicts","exKo":"그 소설은 산업화 초기 공장 노동자들의 일상을 묘사한다.","syn":["portray","describe","illustrate"],"ant":[],"lv":2,"cat":"voc"},{"w":"facilitate","pos":"v","ko":"촉진하다, 용이하게 하다","ex":"The new software is designed to facilitate communication between departments located in different cities.","ans":"facilitate","exKo":"새 소프트웨어는 여러 도시에 있는 부서 간의 소통을 원활하게 하도록 설계되었다.","syn":["ease","promote","enable"],"ant":["hinder"],"lv":1,"cat":"voc"},{"w":"feasible","pos":"adj","ko":"실현 가능한","ex":"The committee concluded that the proposed bridge project was not financially feasible under the current budget.","ans":"feasible","exKo":"위원회는 제안된 교량 사업이 현재 예산으로는 재정적으로 실현 가능하지 않다고 결론지었다.","syn":["viable","practicable","achievable"],"ant":["impractical"],"lv":1,"cat":"voc"},{"w":"fluctuate","pos":"v","ko":"변동하다, 오르내리다","ex":"Oil prices tend to fluctuate sharply whenever there is political instability in the Middle East.","ans":"fluctuate","exKo":"중동에 정치적 불안이 있을 때마다 유가는 급격히 변동하는 경향이 있다.","syn":["vary","swing","waver"],"ant":["stabilize"],"lv":1,"cat":"voc"},{"w":"forthcoming","pos":"adj","ko":"다가오는, 곧 나올, 협조적인","ex":"Details about the merger will be announced in the forthcoming issue of the company newsletter.","ans":"forthcoming","exKo":"합병에 관한 세부 사항은 다음 호 사내 소식지에 발표될 것이다.","syn":["upcoming","impending"],"ant":["past"],"lv":2,"cat":"voc"},{"w":"fragile","pos":"adj","ko":"깨지기 쉬운, 취약한","ex":"Please handle this package carefully because it contains fragile glassware ordered by a local restaurant.","ans":"fragile","exKo":"이 소포에는 동네 식당이 주문한 깨지기 쉬운 유리 제품이 들어 있으니 조심히 다뤄 주세요.","syn":["delicate","breakable","frail"],"ant":["sturdy","durable"],"lv":1,"cat":"voc"},{"w":"frugal","pos":"adj","ko":"검소한, 절약하는","ex":"Despite earning a high salary, she remained frugal and saved most of her income for retirement.","ans":"frugal","exKo":"높은 연봉을 받으면서도 그녀는 검소하게 지내며 수입 대부분을 노후를 위해 저축했다.","syn":["thrifty","economical"],"ant":["extravagant","wasteful"],"lv":2,"cat":"voc"},{"w":"fulfill","pos":"v","ko":"이행하다, 충족시키다","ex":"The contractor failed to fulfill the terms of the agreement and was asked to pay a penalty.","ans":"fulfill","exKo":"시공업자는 계약 조건을 이행하지 못해 위약금을 내라는 요구를 받았다.","syn":["carry out","meet","satisfy"],"ant":["neglect"],"lv":1,"cat":"voc"},{"w":"fabricate","pos":"v","ko":"조작하다, 꾸며 내다, 제조하다","ex":"The researcher was dismissed after it was revealed that he had fabricated data in several published studies.","ans":"fabricated","exKo":"그 연구원은 발표된 여러 연구에서 자료를 조작한 사실이 드러난 뒤 해고되었다.","syn":["falsify","invent","forge"],"ant":[],"lv":2,"cat":"voc"},{"w":"falter","pos":"v","ko":"흔들리다, 주춤하다","ex":"Consumer spending began to falter in the third quarter as interest rates continued to rise.","ans":"falter","exKo":"금리가 계속 오르면서 3분기에 소비 지출이 주춤하기 시작했다.","syn":["weaken","waver","stumble"],"ant":["strengthen"],"lv":3,"cat":"voc"},{"w":"feeble","pos":"adj","ko":"약한, 미약한","ex":"The government made only a feeble attempt to address the housing shortage in major cities.","ans":"feeble","exKo":"정부는 대도시의 주택 부족 문제를 해결하려고 미약한 시도만 했을 뿐이다.","syn":["weak","faint","ineffective"],"ant":["strong","vigorous"],"lv":3,"cat":"voc"},{"w":"flaw","pos":"n","ko":"결함, 흠","ex":"Engineers discovered a serious flaw in the design of the braking system and recalled thousands of vehicles.","ans":"flaw","exKo":"기술자들은 제동 장치 설계에서 심각한 결함을 발견하고 차량 수천 대를 회수했다.","syn":["defect","fault"
