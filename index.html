"respectively","pos":"adv","ko":"각각","ex":"The first and second prizes went to Ms. Kim and Mr. Lee, respectively, at the design contest.","ans":"respectively","exKo":"디자인 대회에서 1등과 2등 상은 각각 김 씨와 이 씨에게 돌아갔다.","syn":["each in turn","separately"],"ant":[],"lv":2,"cat":"voc"},{"w":"restore","pos":"v","ko":"복구하다, 회복시키다","ex":"Electricity was restored to most homes within six hours after the storm passed.","ans":"restored","exKo":"폭풍이 지나간 뒤 여섯 시간 안에 대부분의 가정에 전기가 복구되었다.","syn":["repair","bring back","reinstate"],"ant":["damage","destroy"],"lv":1,"cat":"voc"},{"w":"restrict","pos":"v","ko":"제한하다","ex":"The city has decided to restrict the number of cars allowed in the downtown area on weekends.","ans":"restrict","exKo":"시는 주말에 도심에 들어올 수 있는 차량 수를 제한하기로 했다.","syn":["limit","confine","control"],"ant":["permit","expand"],"lv":1,"cat":"voc"},{"w":"resume","pos":"v","ko":"재개하다, 다시 시작하다","ex":"The meeting will resume after a fifteen-minute break, so please return to your seats on time.","ans":"resume","exKo":"회의는 15분 휴식 후 재개되니 제시간에 자리로 돌아와 주십시오.","syn":["restart","continue","carry on"],"ant":["suspend","halt"],"lv":1,"cat":"voc"},{"w":"retail","pos":"n","ko":"소매, 소매업","ex":"She has worked in retail for ten years and now manages a large clothing store downtown.","ans":"retail","exKo":"그녀는 10년 동안 소매업에서 일했고 지금은 시내의 큰 옷 가게를 관리한다.","syn":["selling","store trade"],"ant":["wholesale"],"lv":1,"cat":"voc"},{"w":"retain","pos":"v","ko":"유지하다, 보유하다","ex":"Companies offer bonuses and flexible schedules to retain their most talented employees.","ans":"retain","exKo":"기업들은 가장 유능한 직원을 붙잡아 두기 위해 보너스와 유연한 근무 일정을 제공한다.","syn":["keep","maintain","hold"],"ant":["lose","release"],"lv":1,"cat":"voc"},{"w":"retrieve","pos":"v","ko":"되찾다, 회수하다, (정보를) 검색하다","ex":"The technician was able to retrieve most of the files from the damaged hard drive.","ans":"retrieve","exKo":"기술자는 손상된 하드 드라이브에서 파일 대부분을 복구할 수 있었다.","syn":["recover","get back","regain"],"ant":["lose"],"lv":2,"cat":"voc"},{"w":"retrospect","pos":"n","ko":"회고, 돌이켜 봄","ex":"In retrospect, we should have tested the software more carefully before releasing it to customers.","ans":"retrospect","exKo":"돌이켜 보면 우리는 소프트웨어를 고객에게 출시하기 전에 더 꼼꼼히 시험했어야 했다.","syn":["hindsight","looking back"],"ant":["foresight"],"lv":3,"cat":"voc"},{"w":"revenue","pos":"n","ko":"수익, 세입","ex":"The company's annual revenue rose by fifteen percent thanks to strong sales in overseas markets.","ans":"revenue","exKo":"해외 시장 판매 호조 덕분에 그 회사의 연간 수익이 15퍼센트 증가했다.","syn":["income","earnings","proceeds"],"ant":["expenditure","loss"],"lv":1,"cat":"voc"},{"w":"reverse","pos":"v","ko":"뒤집다, 번복하다","ex":"The court reversed its earlier decision after new evidence was presented by the defense.","ans":"reversed","exKo":"변호인 측이 새 증거를 제시하자 법원은 이전 판결을 번복했다.","syn":["overturn","undo","invert"],"ant":["uphold","maintain"],"lv":2,"cat":"voc"},{"w":"revise","pos":"v","ko":"수정하다, 개정하다","ex":"The author revised the second chapter several times based on feedback from her editor.","ans":"revised","exKo":"작가는 편집자의 의견을 바탕으로 2장을 여러 번 수정했다.","syn":["edit","amend","modify"],"ant":[],"lv":1,"cat":"voc"},{"w":"revoke","pos":"v","ko":"취소하다, 철회하다","ex":"His driver's license was revoked after he was caught driving under the influence of alcohol.","ans":"revoked","exKo":"그는 음주 운전으로 적발된 뒤 운전면허가 취소되었다.","syn":["cancel","withdraw","annul"],"ant":["grant","issue"],"lv":3,"cat":"voc"},{"w":"rigid","pos":"adj","ko":"경직된, 엄격한, 단단한","ex":"Some workers complain that the company's rigid rules leave no room for creativity.","ans":"rigid","exKo":"일부 직원은 회사의 경직된 규칙 때문에 창의성을 발휘할 여지가 없다고 불평한다.","syn":["strict","inflexible","stiff"],"ant":["flexible"],"lv":2,"cat":"voc"},{"w":"rigorous","pos":"adj","ko":"엄격한, 철저한","ex":"All new drugs must pass rigorous testing before they can be sold to the public.","ans":"rigorous","exKo":"모든 신약은 일반에 판매되기 전에 엄격한 시험을 통과해야 한다.","syn":["thorough","strict","meticulous"],"ant":["lax","careless"],"lv":2,"cat":"voc"},{"w":"robust","pos":"adj","ko":"튼튼한, 견고한, 활발한","ex":"Economists expect robust growth in consumer spending during the holiday season this year.","ans":"robust","exKo":"경제학자들은 올해 연말 쇼핑 시즌에 소비 지출이 크게 늘 것으로 예상한다.","syn":["strong","sturdy","vigorous"],"ant":["weak","fragile"],"lv":2,"cat":"voc"},{"w":"rudimentary","pos":"adj","ko":"기초적인, 초보적인","ex":"He has only a rudimentary knowledge of Spanish, but he can order food and ask for directions.","ans":"rudimentary","exKo":"그는 스페인어를 기초적인 수준밖에 모르지만 음식을 주문하고 길을 물을 수는 있다.","syn":["basic","elementary"],"ant":["advanced","sophisticated"],"lv":3,"cat":"voc"},{"w":"rule out","pos":"phr","ko":"배제하다, 제외하다","ex":"Police have not ruled out the possibility that the fire was started on purpose.","ans":"ruled out","exKo":"경찰은 화재가 고의로 일어났을 가능성을 배제하지 않았다.","syn":["exclude","eliminate"],"ant":["include","consider"],"lv":1,"cat":"voc"},{"w":"run out of","pos":"phr","ko":"~이 다 떨어지다, 바닥나다","ex":"We ran out of printer paper just before the meeting, so I had to borrow some from next door.","ans":"ran out of","exKo":"회의 직전에 프린터 용지가 다 떨어져서 옆 사무실에서 좀 빌려야 했다.","syn":["use up","exhaust"],"ant":["stock up on"],"lv":1,"cat":"voc"},{"w":"sanction","pos":"n","ko":"제재, 승인","ex":"The United Nations imposed economic sanctions on the country after it tested another missile.","ans":"sanctions","exKo":"그 나라가 또 미사일을 시험 발사하자 유엔은 경제 제재를 가했다.","syn":["penalty","embargo","approval"],"ant":["reward"],"lv":3,"cat":"voc"},{"w":"sanitation","pos":"n","ko":"위생, 공중위생 시설","ex":"Improved sanitation in rural villages has greatly reduced the spread of infectious diseases.","ans":"sanitation","exKo":"농촌 마을의 위생 개선으로 전염병 확산이 크게 줄었다.","syn":["hygiene","cleanliness"],"ant":["contamination"],"lv":3,"cat":"voc"},{"w":"scarce","pos":"adj","ko":"부족한, 드문","ex":"Clean drinking water is becoming scarce in many regions because of long periods of drought.","ans":"scarce","exKo":"오랜 가뭄 때문에 많은 지역에서 깨끗한 식수가 부족해지고 있다.","syn":["rare","insufficient","limited"],"ant":["abundant","plentiful"],"lv":1,"cat":"voc"},{"w":"scheme","pos":"n","ko":"계획, 제도, 책략","ex":"The government introduced a new scheme to help first-time buyers purchase affordable homes.","ans":"scheme","exKo":"정부는 생애 첫 주택 구입자가 저렴한 집을 살 수 있도록 돕는 새 제도를 도입했다.","syn":["plan","program","plot"],"ant":[],"lv":2,"cat":"voc"},{"w":"scrutinize","pos":"v","ko":"면밀히 조사하다","ex":"Investors carefully scrutinize a company's financial statements before deciding to buy its shares.","ans":"scrutinize","exKo":"투자자들은 주식을 사기로 결정하기 전에 회사의 재무제표를 면밀히 검토한다.","syn":["examine","inspect","analyze"],"ant":["overlook","ignore"],"lv":2,"cat":"voc"},{"w":"seasoned","pos":"adj","ko":"노련한, 경험 많은","ex":"Even seasoned travelers can feel lost when they arrive in a busy foreign airport at night.","ans":"seasoned","exKo":"노련한 여행자도 밤에 붐비는 외국 공항에 도착하면 길을 잃은 느낌이 들 수 있다.","syn":["experienced","veteran"],"ant":["inexperienced","novice"],"lv":3,"cat":"voc"},{"w":"secure","pos":"v","ko":"확보하다, 안전하게 하다","ex":"The startup finally secured enough funding from investors to launch its first product.","ans":"secured","exKo":"그 스타트업은 마침내 첫 제품을 출시할 만큼의 자금을 투자자들로부터 확보했다.","syn":["obtain","acquire","gain"],"ant":["lose"],"lv":1,"cat":"voc"},{"w":"sedentary","pos":"adj","ko":"주로 앉아서 지내는, 활동이 적은","ex":"Office workers who lead a sedentary lifestyle should try to take short walks during the day.","ans":"sedentary","exKo":"주로 앉아서 생활하는 사무직 노동자는 낮 동안 짧게라도 걸으려고 노력해야 한다.","syn":["inactive","desk-bound"],"ant":["active"],"lv":2,"cat":"voc"},{"w":"setback","pos":"n","ko":"차질, 좌절","ex":"The injury was a major setback for the athlete, who had hoped to compete in the Olympics.","ans":"setback","exKo":"그 부상은 올림픽 출전을 바라던 선수에게 큰 좌절이었다.","syn":["obstacle","delay","reversal"],"ant":["progress","breakthrough"],"lv":2,"cat":"voc"},{"w":"severe","pos":"adj","ko":"심각한, 혹독한","ex":"The region suffered severe damage from the earthquake, and thousands of people lost their homes.","ans":"severe","exKo":"그 지역은 지진으로 심각한 피해를 입었고 수천 명이 집을 잃었다.","syn":["serious","harsh","extreme"],"ant":["mild","minor"],"lv":1,"cat":"voc"},{"w":"shortage","pos":"n","ko":"부족, 결핍","ex":"Hospitals across the country are facing a serious shortage of nurses this winter.","ans":"shortage","exKo":"이번 겨울 전국의 병원이 심각한 간호사 부족에 직면해 있다.","syn":["lack","deficit","scarcity"],"ant":["surplus","abundance"],"lv":1,"cat":"voc"},{"w":"showcase","pos":"v","ko":"선보이다, 소개하다","ex":"The trade fair gives local companies a chance to showcase their newest products to foreign buyers.","ans":"showcase","exKo":"그 무역 박람회는 지역 기업들이 해외 바이어에게 최신 제품을 선보일 기회를 준다.","syn":["display","exhibit","present"],"ant":["hide"],"lv":2,"cat":"voc"},{"w":"shrink","pos":"v","ko":"줄어들다, 축소되다","ex":"The number of farmers in the country has continued to shrink as young people move to cities.","ans":"shrink","exKo":"젊은이들이 도시로 떠나면서 그 나라의 농민 수는 계속 줄어들고 있다.","syn":["decrease","contract","decline"],"ant":["grow","expand"],"lv":1,"cat":"voc"},{"w":"sign up","pos":"phr","ko":"등록하다, 가입하다","ex":"More than fifty students signed up for the free coding class offered by the community center.","ans":"signed up","exKo":"50명이 넘는 학생이 주민 센터에서 제공하는 무료 코딩 수업에 등록했다.","syn":["register","enroll"],"ant":["drop out"],"lv":1,"cat":"voc"},{"w":"simultaneously","pos":"adv","ko":"동시에","ex":"The new album was released simultaneously in Korea, Japan and the United States last Friday.","ans":"simultaneously","exKo":"새 앨범은 지난 금요일 한국, 일본, 미국에서 동시에 발매되었다.","syn":["at the same time","concurrently"],"ant":["separately"],"lv":1,"cat":"voc"},{"w":"skeptical","pos":"adj","ko":"회의적인, 의심하는","ex":"Many experts remain skeptical about the claim that the diet can cure serious diseases.","ans":"skeptical","exKo":"많은 전문가는 그 식단이 심각한 질병을 치료할 수 있다는 주장에 여전히 회의적이다.","syn":["doubtful","dubious","suspicious"],"ant":["convinced","trusting"],"lv":1,"cat":"voc"},{"w":"soar","pos":"v","ko":"급등하다, 치솟다","ex":"Housing prices soared last year, making it harder for young couples to buy their first home.","ans":"soared","exKo":"작년에 집값이 치솟아 젊은 부부가 첫 집을 사기가 더 어려워졌다.","syn":["skyrocket","surge","rise"],"ant":["plunge","plummet"],"lv":1,"cat":"voc"},{"w":"solicit","pos":"v","ko":"요청하다, 간청하다","ex":"The city is soliciting opinions from residents before making a final decision on the new bus routes.","ans":"soliciting","exKo":"시는 새 버스 노선을 최종 결정하기 전에 주민들의 의견을 구하고 있다.","syn":["request","seek","ask for"],"ant":[],"lv":3,"cat":"voc"},{"w":"sophisticated","pos":"adj","ko":"정교한, 세련된","ex":"Banks now use sophisticated software to detect suspicious transactions and prevent fraud.","ans":"sophisticated","exKo":"은행들은 이제 의심스러운 거래를 찾아내고 사기를 막기 위해 정교한 소프트웨어를 쓴다.","syn":["advanced","complex","refined"],"ant":["simple","crude"],"lv":2,"cat":"voc"},{"w":"specify","pos":"v","ko":"명시하다, 구체적으로 말하다","ex":"Please specify your preferred delivery date when you place your order on our website.","ans":"specify","exKo":"웹사이트에서 주문하실 때 원하시는 배송 날짜를 명시해 주십시오.","syn":["state","indicate","detail"],"ant":[],"lv":1,"cat":"voc"},{"w":"speculate","pos":"v","ko":"추측하다, 투기하다","ex":"Analysts speculate that the two companies will announce a merger before the end of the year.","ans":"speculate","exKo":"분석가들은 두 회사가 연말 전에 합병을 발표할 것이라고 추측한다.","syn":["guess","conjecture","suppose"],"ant":["know"],"lv":2,"cat":"voc"},{"w":"spontaneous","pos":"adj","ko":"자발적인, 즉흥적인","ex":"The audience broke into spontaneous applause when the young pianist finished her performance.","ans":"spontaneous","exKo":"젊은 피아니스트가 연주를 마치자 관객들이 저절로 박수를 쳤다.","syn":["impulsive","unplanned","natural"],"ant":["planned","deliberate"],"lv":2,"cat":"voc"},{"w":"sporadic","pos":"adj","ko":"산발적인, 이따금 일어나는","ex":"Weather forecasters expect sporadic showers throughout the day, so you may want to bring an umbrella.","ans":"sporadic","exKo":"기상 예보관들은 하루 종일 산발적인 소나기를 예상하니 우산을 챙기는 것이 좋겠다.","syn":["occasional","irregular","scattered"],"ant":["continuous","constant"],"lv":3,"cat":"voc"},{"w":"stagnant","pos":"adj","ko":"정체된, 침체된, 고인","ex":"Wages have remained stagnant for years while the cost of living has steadily increased.","ans":"stagnant","exKo":"생활비는 꾸준히 오르는데 임금은 수년째 제자리에 머물러 있다.","syn":["sluggish","inactive","still"],"ant":["growing","dynamic"],"lv":2,"cat":"voc"},{"w":"stake","pos":"n","ko":"지분, 이해관계","ex":"The investment fund bought a twenty percent stake in the struggling airline last month.","ans":"stake","exKo":"그 투자 펀드는 지난달 경영난을 겪는 항공사의 지분 20퍼센트를 사들였다.","syn":["share","interest","investment"],"ant":[],"lv":2,"cat":"voc"},{"w":"stand out","pos":"phr","ko":"두드러지다, 눈에 띄다","ex":"Her application stood out from the others because of her volunteer work in developing countries.","ans":"stood out","exKo":"그녀의 지원서는 개발도상국에서의 봉사 활동 덕분에 다른 지원서들보다 눈에 띄었다.","syn":["be noticeable","excel"],"ant":["blend in"],"lv":1,"cat":"voc"},{"w":"standstill","pos":"n","ko":"정지, 정체","ex":"Traffic came to a complete standstill after two trucks collided on the highway this morning.","ans":"standstill","exKo":"오늘 아침 고속도로에서 트럭 두 대가 충돌한 뒤 교통이 완전히 멈췄다.","syn":["halt","stop","deadlock"],"ant":["progress","movement"],"lv":3,"cat":"voc"},{"w":"stationery","pos":"n","ko":"문구류, 문방구","ex":"The office manager orders stationery such as pens, envelopes and sticky notes every month.","ans":"stationery","exKo":"사무실 관리자는 매달 펜, 봉투, 접착식 메모지 같은 문구류를 주문한다.","syn":["office supplies","writing materials"],"ant":[],"lv":2,"cat":"voc"},{"w":"steep","pos":"adj","ko":"가파른, 급격한, (값이) 터무니없는","ex":"The company reported a steep decline in profits after losing its biggest customer.","ans":"steep","exKo":"그 회사는 최대 고객을 잃은 뒤 이익이 급감했다고 발표했다.","syn":["sharp","sudden","excessive"],"ant":["gradual","gentle"],"lv":2,"cat":"voc"},{"w":"stipulate","pos":"v","ko":"규정하다, 명기하다","ex":"The lease stipulates that tenants must give two months' notice before moving out.","ans":"stipulates","exKo":"임대차 계약서에는 세입자가 이사하기 두 달 전에 통보해야 한다고 규정되어 있다.","syn":["specify","require","state"],"ant":[],"lv":3,"cat":"voc"},{"w":"strenuous","pos":"adj","ko":"격렬한, 몹시 힘든","ex":"Patients recovering from surgery should avoid strenuous exercise for at least six weeks.","ans":"strenuous","exKo":"수술 후 회복 중인 환자는 최소 6주 동안 격렬한 운동을 피해야 한다.","syn":["demanding","exhausting","vigorous"],"ant":["easy","effortless"],"lv":2,"cat":"voc"},{"w":"stringent","pos":"adj","ko":"엄격한, 철저한","ex":"Food factories must follow stringent hygiene standards to keep their products safe for consumers.","ans":"stringent","exKo":"식품 공장은 소비자에게 안전한 제품을 공급하기 위해 엄격한 위생 기준을 지켜야 한다.","syn":["strict","rigorous","tough"],"ant":["lenient","lax"],"lv":3,"cat":"voc"},{"w":"stumble","pos":"v","ko":"비틀거리다, (upon) 우연히 발견하다","ex":"While cleaning the attic, she stumbled upon a box of old letters written by her grandfather.","ans":"stumbled upon","exKo":"다락방을 청소하다가 그녀는 할아버지가 쓴 옛 편지 상자를 우연히 발견했다.","syn":["come across","trip","discover by chance"],"ant":[],"lv":3,"cat":"voc"},{"w":"subscribe","pos":"v","ko":"구독하다, 가입하다","ex":"If you subscribe to our newsletter, you will receive a ten percent discount on your next order.","ans":"subscribe","exKo":"뉴스레터를 구독하시면 다음 주문 시 10퍼센트 할인을 받으실 수 있습니다.","syn":["sign up","register"],"ant":["unsubscribe","cancel"],"lv":1,"cat":"voc"},{"w":"subsequent","pos":"adj","ko":"그 후의, 다음의","ex":"The first meeting was friendly, but subsequent discussions became tense as the deadline approached.","ans":"subsequent","exKo":"첫 회의는 우호적이었지만 마감일이 다가오면서 그 후의 논의는 팽팽해졌다.","syn":["following","later","succeeding"],"ant":["previous","prior"],"lv":1,"cat":"voc"},{"w":"subsidy","pos":"n","ko":"보조금, 장려금","ex":"Farmers receive a government subsidy to help them switch to environmentally friendly methods.","ans":"subsidy","exKo":"농민들은 친환경 농법으로 전환할 수 있도록 정부 보조금을 받는다.","syn":["grant","allowance","financial aid"],"ant":["tax"],"lv":2,"cat":"voc"},{"w":"substantial","pos":"adj","ko":"상당한, 많은","ex":"The new factory will create a substantial number of jobs for people living in the area.","ans":"substantial","exKo":"새 공장은 그 지역 주민들에게 상당한 수의 일자리를 만들어 줄 것이다.","syn":["considerable","significant","large"],"ant":["minor","negligible"],"lv":1,"cat":"voc"},{"w":"substitute","pos":"v","ko":"대체하다, 대신하다","ex":"You can substitute olive oil for butter if you want to make the recipe a little healthier.","ans":"substitute","exKo":"요리를 조금 더 건강하게 만들고 싶다면 버터 대신 올리브유를 써도 된다.","syn":["replace","swap","exchange"],"ant":[],"lv":1,"cat":"voc"},{"w":"subtle","pos":"adj","ko":"미묘한, 은근한","ex":"There are subtle differences between the two paintings that only an expert would notice.","ans":"subtle","exKo":"두 그림 사이에는 전문가만 알아챌 수 있는 미묘한 차이가 있다.","syn":["slight","delicate","faint"],"ant":["obvious","clear"],"lv":2,"cat":"voc"},{"w":"succinct","pos":"adj","ko":"간결한","ex":"The professor asked students to write a succinct summary of the article in under two hundred words.","ans":"succinct","exKo":"교수는 학생들에게 그 기사를 200단어 이내로 간결하게 요약하라고 했다.","syn":["concise","brief","short"],"ant":["wordy","lengthy"],"lv":3,"cat":"voc"},{"w":"sufficient","pos":"adj","ko":"충분한","ex":"The judge ruled that there was not sufficient evidence to prove that the man was guilty.","ans":"sufficient","exKo":"판사는 그 남자의 유죄를 입증할 충분한 증거가 없다고 판결했다.","syn":["enough","adequate","ample"],"ant":["insufficient","inadequate"],"lv":1,"cat":"voc"},{"w":"superficial","pos":"adj","ko":"피상적인, 표면적인","ex":"The report offers only a superficial analysis and does not explain the real causes of the problem.","ans":"superficial","exKo":"그 보고서는 피상적인 분석만 제시할 뿐 문제의 실제 원인은 설명하지 않는다.","syn":["shallow","surface-level","cursory"],"ant":["thorough","profound"],"lv":2,"cat":"voc"},{"w":"supervise","pos":"v","ko":"감독하다, 관리하다","ex":"Ms. Park will supervise the new interns and help them learn the company's procedures.","ans":"supervise","exKo":"박 씨가 신입 인턴들을 감독하고 회사 업무 절차를 익히도록 도울 것이다.","syn":["oversee","manage","direct"],"ant":[],"lv":1,"cat":"voc"},{"w":"supplement","pos":"n","ko":"보충제, 보충물","ex":"Doctors say that vitamin supplements cannot replace a balanced diet with plenty of vegetables.","ans":"supplements","exKo":"의사들은 비타민 보충제가 채소가 풍부한 균형 잡힌 식단을 대신할 수 없다고 말한다.","syn":["addition","extra","complement"],"ant":[],"lv":2,"cat":"voc"},{"w":"surpass","pos":"v","ko":"능가하다, 뛰어넘다","ex":"Sales of the new model surpassed all expectations, selling one million units in the first month.","ans":"surpassed","exKo":"새 모델의 판매량은 모든 예상을 뛰어넘어 첫 달에 100만 대가 팔렸다.","syn":["exceed","outdo","outperform"],"ant":["fall short of"],"lv":2,"cat":"voc"},{"w":"surplus","pos":"n","ko":"흑자, 잉여","ex":"The country recorded a trade surplus for the third straight year thanks to rising exports.","ans":"surplus","exKo":"그 나라는 수출 증가 덕분에 3년 연속 무역 흑자를 기록했다.","syn":["excess","extra","surfeit"],"ant":["deficit","shortage"],"lv":2,"cat":"voc"},{"w":"surveillance","pos":"n","ko":"감시","ex":"The bank installed new surveillance cameras after a series of thefts in the neighborhood.","ans":"surveillance","exKo":"그 은행은 동네에서 절도가 잇따르자 새 감시 카메라를 설치했다.","syn":["monitoring","observation"],"ant":[],"lv":3,"cat":"voc"},{"w":"susceptible","pos":"adj","ko":"영향을 받기 쉬운, 취약한","ex":"Elderly people are more susceptible to the flu, so they are encouraged to get vaccinated early.","ans":"susceptible","exKo":"노인은 독감에 더 걸리기 쉬우므로 일찍 예방 접종을 받도록 권장된다.","syn":["vulnerable","prone","liable"],"ant":["immune","resistant"],"lv":2,"cat":"voc"},{"w":"sustain","pos":"v","ko":"지속하다, 유지하다, (피해를) 입다","ex":"The driver sustained only minor injuries in the accident because he was wearing a seat belt.","ans":"sustained","exKo":"그 운전자는 안전띠를 매고 있어서 사고에서 가벼운 부상만 입었다.","syn":["suffer","maintain","keep up"],"ant":["abandon"],"lv":1,"cat":"voc"},{"w":"sustainable","pos":"adj","ko":"지속 가능한","ex":"The city aims to develop a sustainable transport system that relies less on fossil fuels.","ans":"sustainable","exKo":"그 도시는 화석 연료에 덜 의존하는 지속 가능한 교통 체계를 만드는 것을 목표로 한다.","syn":["renewable","eco-friendly","viable"],"ant":["unsustainable"],"lv":1,"cat":"voc"},{"w":"swamped","pos":"adj","ko":"몹시 바쁜, (일에) 파묻힌","ex":"I'm swamped with work this week, so could we move our lunch to next Tuesday?","ans":"swamped","exKo":"이번 주는 일이 너무 많아서 그런데 점심 약속을 다음 주 화요일로 옮길 수 있을까요?","syn":["overwhelmed","snowed under","busy"],"ant":["free","idle"],"lv":1,"cat":"voc"},{"w":"symptom","pos":"n","ko":"증상, 징후","ex":"Common symptoms of the virus include fever, coughing and a loss of taste or smell.","ans":"symptoms","exKo":"그 바이러스의 흔한 증상으로는 발열, 기침, 미각이나 후각 상실이 있다.","syn":["sign","indication"],"ant":[],"lv":1,"cat":"voc"},{"w":"tackle","pos":"v","ko":"(문제를) 다루다, 씨름하다","ex":"The new mayor promised to tackle the city's housing problem during her first year in office.","ans":"tackle","exKo":"새 시장은 취임 첫해에 도시의 주택 문제를 해결하겠다고 약속했다.","syn":["deal with","address","handle"],"ant":["ignore","avoid"],"lv":1,"cat":"voc"},{"w":"tailor","pos":"v","ko":"(목적에) 맞추다, 조정하다","ex":"The gym offers training programs tailored to the needs of each member.","ans":"tailored","exKo":"그 체육관은 회원 개개인의 필요에 맞춘 운동 프로그램을 제공한다.","syn":["customize","adapt","adjust"],"ant":["standardize"],"lv":2,"cat":"voc"},{"w":"take over","pos":"phr","ko":"인수하다, 떠맡다","ex":"A large foreign company plans to take over the local bank by the end of next year.","ans":"take over","exKo":"한 대형 외국 기업이 내년 말까지 그 지역 은행을 인수할 계획이다.","syn":["acquire","assume control of"],"ant":["hand over"],"lv":1,"cat":"voc"},{"w":"tamper","pos":"v","ko":"(with) 함부로 손대다, 조작하다","ex":"Anyone who tampers with the fire alarm system will be fined and reported to the police.","ans":"tampers","exKo":"화재경보 장치를 함부로 조작하는 사람은 벌금을 물고 경찰에 신고된다.","syn":["interfere","meddle","alter"],"ant":[],"lv":3,"cat":"voc"},{"w":"tangible","pos":"adj","ko":"실재하는, 명백한, 유형의","ex":"The training program produced tangible results, with sales rising by ten percent in three months.","ans":"tangible","exKo":"그 교육 프로그램은 석 달 만에 매출이 10퍼센트 오르는 가시적인 성과를 냈다.","syn":["concrete","real","visible"],"ant":["intangible","abstract"],"lv":2,"cat":"voc"},{"w":"tedious","pos":"adj","ko":"지루한, 싫증 나는","ex":"Entering customer data by hand is a tedious task that can now be done by software.","ans":"tedious","exKo":"고객 정보를 손으로 입력하는 것은 지루한 일인데 이제는 소프트웨어가 대신할 수 있다.","syn":["boring","dull","monotonous"],"ant":["exciting","interesting"],"lv":1,"cat":"voc"},{"w":"temporary","pos":"adj","ko":"일시적인, 임시의","ex":"The main road is closed for repairs, so drivers must use a temporary route until Friday.","ans":"temporary","exKo":"주요 도로가 보수 공사로 폐쇄되어 운전자들은 금요일까지 임시 경로를 이용해야 한다.","syn":["short-term","provisional","interim"],"ant":["permanent"],"lv":1,"cat":"voc"},{"w":"tenacious","pos":"adj","ko":"끈질긴, 집요한","ex":"Thanks to her tenacious efforts, the small charity grew into a national organization.","ans":"tenacious","exKo":"그녀의 끈질긴 노력 덕분에 그 작은 자선 단체는 전국적인 조직으로 성장했다.","syn":["persistent","determined","stubborn"],"ant":["irresolute","weak"],"lv":3,"cat":"voc"},{"w":"tenant","pos":"n","ko":"세입자, 임차인","ex":"The landlord told the tenants that the rent would increase by five percent next year.","ans":"tenants","exKo":"집주인은 세입자들에게 내년에 임대료가 5퍼센트 오를 것이라고 알렸다.","syn":["renter","occupant","lessee"],"ant":["landlord","owner"],"lv":1,"cat":"voc"},{"w":"tentative","pos":"adj","ko":"잠정적인, 임시의","ex":"We have made a tentative plan to meet in Busan, but the date has not been confirmed yet.","ans":"tentative","exKo":"부산에서 만나기로 잠정적인 계획을 세웠지만 날짜는 아직 확정되지 않았다.","syn":["provisional","preliminary","uncertain"],"ant":["definite","final"],"lv":2,"cat":"voc"},{"w":"terminate","pos":"v","ko":"종료하다, 해지하다","ex":"The landlord has the right to terminate the lease if the rent is not paid for three months.","ans":"terminate","exKo":"석 달 동안 임대료가 지급되지 않으면 집주인은 임대 계약을 해지할 권리가 있다.","syn":["end","cancel","conclude"],"ant":["begin","renew"],"lv":2,"cat":"voc"},{"w":"thorough","pos":"adj","ko":"철저한, 빈틈없는","ex":"The mechanic gave my car a thorough inspection before the long drive to the mountains.","ans":"thorough","exKo":"정비사는 산으로 장거리 운전을 떠나기 전에 내 차를 철저히 점검해 주었다.","syn":["complete","careful","meticulous"],"ant":["careless","superficial"],"lv":1,"cat":"voc"},{"w":"thrive","pos":"v","ko":"번창하다, 잘 자라다","ex":"Small cafes continue to thrive in the area despite competition from large coffee chains.","ans":"thrive","exKo":"대형 커피 체인점과의 경쟁에도 불구하고 그 지역의 작은 카페들은 계속 번창하고 있다.","syn":["flourish","prosper","succeed"],"ant":["decline","struggle"],"lv":1,"cat":"voc"},{"w":"tolerate","pos":"v","ko":"참다, 용인하다","ex":"Our school does not tolerate bullying of any kind, and every report is investigated seriously.","ans":"tolerate","exKo":"우리 학교는 어떤 종류의 괴롭힘도 용납하지 않으며 모든 신고를 진지하게 조사한다.","syn":["put up with","endure","accept"],"ant":["forbid","reject"],"lv":1,"cat":"voc"},{"w":"tranquil","pos":"adj","ko":"고요한, 평온한","ex":"The resort is located in a tranquil valley far away from the noise of the city.","ans":"tranquil","exKo":"그 휴양지는 도시의 소음에서 멀리 떨어진 고요한 계곡에 있다.","syn":["peaceful","calm","serene"],"ant":["noisy","chaotic"],"lv":3,"cat":"voc"},{"w":"transaction","pos":"n","ko":"거래, 처리","ex":"Customers will receive a text message every time a transaction is made with their credit card.","ans":"transaction","exKo":"고객은 신용카드로 거래가 이루어질 때마다 문자 메시지를 받게 된다.","syn":["deal","exchange","purchase"],"ant":[],"lv":1,"cat":"voc"},{"w":"transit","pos":"n","ko":"운송, 수송, 대중교통","ex":"Some of the packages were damaged in transit, so the store sent replacements free of charge.","ans":"transit","exKo":"일부 소포가 운송 중에 파손되어 가게에서 무료로 교환품을 보냈다.","syn":["transport","shipment","passage"],"ant":[],"lv":2,"cat":"voc"},{"w":"transparent","pos":"adj","ko":"투명한, 명료한","ex":"Citizens are demanding that the government be more transparent about how tax money is spent.","ans":"transparent","exKo":"시민들은 정부가 세금 사용 방식을 더 투명하게 공개할 것을 요구하고 있다.","syn":["open","clear","honest"],"ant":["opaque","secretive"],"lv":2,"cat":"voc"},{"w":"treacherous","pos":"adj","ko":"(길·날씨가) 위험한, 배신하는","ex":"Icy roads made driving conditions treacherous, and several accidents were reported overnight.","ans":"treacherous","exKo":"빙판길로 운전 여건이 매우 위험해졌고 밤사이 여러 건의 사고가 보고되었다.","syn":["dangerous","hazardous","disloyal"],"ant":["safe","loyal"],"lv":3,"cat":"voc"},{"w":"trigger","pos":"v","ko":"촉발하다, 일으키다","ex":"Even a small amount of peanuts can trigger a severe allergic reaction in some people.","ans":"trigger","exKo":"일부 사람에게는 땅콩을 조금만 먹어도 심한 알레르기 반응이 일어날 수 있다.","syn":["cause","set off","spark"],"ant":["prevent"],"lv":1,"cat":"voc"},{"w":"trivial","pos":"adj","ko":"사소한, 하찮은","ex":"Don't waste the meeting time arguing about trivial details like the color of the cover page.","ans":"trivial","exKo":"표지 색깔 같은 사소한 세부 사항을 두고 다투느라 회의 시간을 낭비하지 마세요.","syn":["minor","insignificant","petty"],"ant":["important","significant"],"lv":2,"cat":"voc"},{"w":"tuition","pos":"n","ko":"수업료, 등록금","ex":"Many students work part-time jobs to pay their tuition and living expenses.","ans":"tuition","exKo":"많은 학생이 등록금과 생활비를 내기 위해 아르바이트를 한다.","syn":["tuition fee","school fees"],"ant":[],"lv":1,"cat":"voc"},{"w":"turn down","pos":"phr","ko":"거절하다, (소리를) 줄이다","ex":"He turned down a job offer from a big firm because he wanted to start his own business.","ans":"turned down","exKo":"그는 자기 사업을 시작하고 싶어서 대기업의 일자리 제안을 거절했다.","syn":["reject","decline","refuse"],"ant":["accept"],"lv":1,"cat":"voc"},{"w":"turnout","pos":"n","ko":"투표율, 참가자 수","ex":"Voter turnout was unusually high this year, especially among people in their twenties.","ans":"turnout","exKo":"올해는 투표율이 특히 20대 사이에서 이례적으로 높았다.","syn":["attendance","participation"],"ant":["absence"],"lv":2,"cat":"voc"},{"w":"ubiquitous","pos":"adj","ko":"어디에나 있는, 아주 흔한","ex":"Smartphones have become ubiquitous, and it is now rare to see someone without one on the subway.","ans":"ubiquitous","exKo":"스마트폰은 어디에나 있게 되어 이제 지하철에서 스마트폰이 없는 사람을 보기 드물다.","syn":["omnipresent","pervasive","everywhere"],"ant":["rare","scarce"],"lv":3,"cat":"voc"},{"w":"unanimous","pos":"adj","ko":"만장일치의","ex":"The board reached a unanimous decision to appoint Mr. Choi as the new chief executive.","ans":"unanimous","exKo":"이사회는 최 씨를 새 최고경영자로 임명하기로 만장일치로 결정했다.","syn":["united","agreed","undivided"],"ant":["divided","split"],"lv":2,"cat":"voc"},{"w":"unbiased","pos":"adj","ko":"편견 없는, 공정한","ex":"Readers expect journalists to provide unbiased reports rather than their personal opinions.","ans":"unbiased","exKo":"독자들은 기자가 개인 의견이 아니라 공정한 보도를 해 주기를 기대한다.","syn":["impartial","objective","neutral"],"ant":["biased","partial"],"lv":2,"cat":"voc"},{"w":"undergo","pos":"v","ko":"겪다, (수술·검사를) 받다","ex":"The museum will undergo major renovations and remain closed to visitors until next spring.","ans":"undergo","exKo":"그 박물관은 대규모 보수 공사를 거치며 내년 봄까지 관람객에게 문을 닫는다.","syn":["experience","go through","be subjected to"],"ant":["avoid"],"lv":1,"cat":"voc"},{"w":"undermine","pos":"v","ko":"약화시키다, 훼손하다","ex":"Repeated scandals over the past two years have undermined public trust in the country's political leaders.","ans":"undermined","exKo":"지난 2년간 거듭된 추문이 그 나라 정치 지도자들에 대한 국민의 신뢰를 떨어뜨렸다.","syn":["weaken","erode","damage"],"ant":["strengthen","reinforce"],"lv":2,"cat":"voc"},{"w":"undertake","pos":"v","ko":"착수하다, 떠맡다","ex":"The university will undertake a large research project on the effects of air pollution on children.","ans":"undertake","exKo":"그 대학은 대기 오염이 아이들에게 미치는 영향에 관한 대규모 연구 사업에 착수할 것이다.","syn":["take on","embark on","assume"],"ant":["abandon"],"lv":2,"cat":"voc"},{"w":"unprecedented","pos":"adj","ko":"전례 없는","ex":"The heat wave this summer was unprecedented, with temperatures breaking records in over fifty cities.","ans":"unprecedented","exKo":"올여름 폭염은 전례가 없을 정도여서 50개가 넘는 도시에서 기온 기록이 깨졌다.","syn":["unparalleled","record-breaking","unheard-of"],"ant":["common","ordinary"],"lv":1,"cat":"voc"},{"w":"unveil","pos":"v","ko":"공개하다, 발표하다","ex":"The automaker will unveil its first fully electric truck at the motor show in Seoul next week.","ans":"unveil","exKo":"그 자동차 회사는 다음 주 서울 모터쇼에서 첫 순수 전기 트럭을 공개할 예정이다.","syn":["reveal","introduce","launch"],"ant":["conceal","hide"],"lv":2,"cat":"voc"},{"w":"unwind","pos":"v","ko":"긴장을 풀다, 쉬다","ex":"After a stressful week at work, I like to unwind by reading a novel at a quiet cafe.","ans":"unwind","exKo":"스트레스가 많았던 한 주를 보낸 뒤에는 조용한 카페에서 소설을 읽으며 쉬는 것을 좋아한다.","syn":["relax","rest","chill out"],"ant":["tense up"],"lv":2,"cat":"voc"},{"w":"upbeat","pos":"adj","ko":"낙관적인, 긍정적인","ex":"Despite the disappointing sales figures, the manager remained upbeat about next quarter's results.","ans":"upbeat","exKo":"실망스러운 판매 실적에도 불구하고 관리자는 다음 분기 실적에 대해 낙관적인 태도를 유지했다.","syn":["optimistic","positive","cheerful"],"ant":["pessimistic","gloomy"],"lv":3,"cat":"voc"},{"w":"upcoming","pos":"adj","ko":"다가오는, 곧 있을","ex":"The candidates will debate economic policy on national television ahead of the upcoming election.","ans":"upcoming","exKo":"후보들은 다가오는 선거를 앞두고 전국 방송에서 경제 정책을 토론할 것이다.","syn":["forthcoming","approaching","future"],"ant":["past","previous"],"lv":1,"cat":"voc"},{"w":"uphold","pos":"v","ko":"유지하다, 지지하다, (판결을) 확정하다","ex":"The Supreme Court upheld the lower court's ruling, so the company must pay the full fine.","ans":"upheld","exKo":"대법원이 하급 법원의 판결을 확정해 그 회사는 벌금을 전액 내야 한다.","syn":["support","maintain","confirm"],"ant":["overturn","reverse"],"lv":2,"cat":"voc"},{"w":"urge","pos":"v","ko":"촉구하다, 강력히 권하다","ex":"Health officials urged residents to stay indoors because of the high level of fine dust.","ans":"urged","exKo":"보건 당국은 미세먼지 농도가 높아 주민들에게 실내에 머물 것을 촉구했다.","syn":["encourage","press","advise"],"ant":["discourage"],"lv":1,"cat":"voc"},{"w":"utility","pos":"n","ko":"(전기·수도 등) 공공요금, 유용성","ex":"The monthly rent is eight hundred dollars, and utilities such as water and gas are included.","ans":"utilities","exKo":"월세는 800달러이며 수도와 가스 같은 공공요금이 포함되어 있다.","syn":["public services","usefulness"],"ant":[],"lv":1,"cat":"voc"},{"w":"utilize","pos":"v","ko":"활용하다, 이용하다","ex":"The factory utilizes solar energy to power most of its machines during the day.","ans":"utilizes","exKo":"그 공장은 낮 동안 대부분의 기계를 돌리는 데 태양 에너지를 활용한다.","syn":["use","employ","make use of"],"ant":["waste"],"lv":2,"cat":"voc"},{"w":"vacancy","pos":"n","ko":"빈방, 공석, 결원","ex":"Sorry, the hotel has no vacancies this weekend because of the international film festival.","ans":"vacancies","exKo":"죄송하지만 국제 영화제 때문에 이번 주말 호텔에 빈방이 없습니다.","syn":["opening","empty room","position"],"ant":["occupancy"],"lv":1,"cat":"voc"},{"w":"vague","pos":"adj","ko":"모호한, 희미한","ex":"The instructions were so vague that nobody knew exactly what they were supposed to do.","ans":"vague","exKo":"지시가 너무 모호해서 아무도 정확히 무엇을 해야 하는지 몰랐다.","syn":["unclear","ambiguous","hazy"],"ant":["clear","precise"],"lv":1,"cat":"voc"},{"w":"valid","pos":"adj","ko":"유효한, 타당한","ex":"This coupon is valid until the end of the month and cannot be combined with other offers.","ans":"valid","exKo":"이 쿠폰은 이달 말까지 유효하며 다른 할인과 함께 쓸 수 없다.","syn":["effective","legitimate","sound"],"ant":["invalid","expired"],"lv":1,"cat":"voc"},{"w":"venue","pos":"n","ko":"(행사) 장소","ex":"Because more people registered than expected, the conference was moved to a larger venue.","ans":"venue","exKo":"예상보다 많은 사람이 등록해서 학회는 더 큰 장소로 옮겨졌다.","syn":["location","site","place"],"ant":[],"lv":1,"cat":"voc"},{"w":"verify","pos":"v","ko":"확인하다, 검증하다","ex":"Please bring a photo ID so that we can verify your identity before issuing the documents.","ans":"verify","exKo":"서류를 발급하기 전에 본인 확인을 할 수 있도록 사진이 있는 신분증을 가져오세요.","syn":["confirm","check","validate"],"ant":["refute"],"lv":1,"cat":"voc"},{"w":"versatile","pos":"adj","ko":"다재다능한, 다용도의","ex":"This versatile jacket can be worn to the office as well as on weekend hiking trips.","ans":"versatile","exKo":"이 다용도 재킷은 사무실에서뿐 아니라 주말 등산 때도 입을 수 있다.","syn":["multipurpose","adaptable","all-round"],"ant":["limited"],"lv":2,"cat":"voc"},{"w":"viable","pos":"adj","ko":"실행 가능한, 성공할 수 있는","ex":"Experts doubt that the plan is financially viable without additional support from the government.","ans":"viable","exKo":"전문가들은 정부의 추가 지원 없이 그 계획이 재정적으로 실현 가능할지 의심한다.","syn":["feasible","workable","practical"],"ant":["unworkable","impractical"],"lv":2,"cat":"voc"},{"w":"vicinity","pos":"n","ko":"근처, 부근","ex":"There are several good restaurants in the vicinity of the convention center.","ans":"vicinity","exKo":"컨벤션 센터 근처에는 괜찮은 식당이 몇 군데 있다.","syn":["neighborhood","surrounding area","proximity"],"ant":[],"lv":2,"cat":"voc"},{"w":"vigorous","pos":"adj","ko":"활발한, 격렬한, 강력한","ex":"Doctors recommend at least seventy-five minutes of vigorous exercise every week for adults.","ans":"vigorous","exKo":"의사들은 성인에게 매주 최소 75분의 격렬한 운동을 권장한다.","syn":["energetic","intense","strenuous"],"ant":["feeble","weak"],"lv":2,"cat":"voc"},{"w":"vocational","pos":"adj","ko":"직업의, 직업 교육의","ex":"The government plans to expand vocational training for young people who do not go to university.","ans":"vocational","exKo":"정부는 대학에 진학하지 않는 청년을 위한 직업 훈련을 확대할 계획이다.","syn":["occupational","professional","job-related"],"ant":["academic"],"lv":3,"cat":"voc"},{"w":"volatile","pos":"adj","ko":"변동성이 큰, 불안정한","ex":"Investors are nervous because the stock market has been extremely volatile over the past few weeks.","ans":"volatile","exKo":"지난 몇 주 동안 주식 시장의 변동성이 매우 커서 투자자들이 불안해하고 있다.","syn":["unstable","unpredictable","erratic"],"ant":["stable","steady"],"lv":2,"cat":"voc"},{"w":"voucher","pos":"n","ko":"상품권, 할인권, 쿠폰","ex":"Customers who complete the online survey will receive a voucher for a free cup of coffee.","ans":"voucher","exKo":"온라인 설문을 완료한 고객은 무료 커피 한 잔 쿠폰을 받는다.","syn":["coupon","token","gift certificate"],"ant":[],"lv":2,"cat":"voc"},{"w":"vow","pos":"v","ko":"맹세하다, 다짐하다","ex":"The president vowed to create one million new jobs during his five-year term.","ans":"vowed","exKo":"대통령은 5년 임기 동안 일자리 100만 개를 새로 만들겠다고 다짐했다.","syn":["pledge","promise","swear"],"ant":[],"lv":3,"cat":"voc"},{"w":"vulnerable","pos":"adj","ko":"취약한, 상처받기 쉬운","ex":"Older computers that are not updated regularly are vulnerable to attacks from hackers.","ans":"vulnerable","exKo":"정기적으로 업데이트하지 않는 오래된 컴퓨터는 해커의 공격에 취약하다.","syn":["susceptible","exposed","defenseless"],"ant":["protected","resistant"],"lv":1,"cat":"voc"},{"w":"waive","pos":"v","ko":"(요금·권리를) 면제하다, 포기하다","ex":"The bank agreed to waive the late fee because the delay was caused by its own system error.","ans":"waive","exKo":"은행은 지연이 자체 시스템 오류로 생긴 것이어서 연체료를 면제해 주기로 했다.","syn":["exempt","drop","give up"],"ant":["impose","enforce"],"lv":2,"cat":"voc"},{"w":"warranty","pos":"n","ko":"(품질) 보증, 보증서","ex":"The laptop comes with a two-year warranty that covers repairs and replacement parts.","ans":"warranty","exKo":"그 노트북은 수리와 교체 부품을 보장하는 2년 품질 보증이 딸려 있다.","syn":["guarantee"],"ant":[],"lv":1,"cat":"voc"},{"w":"wary","pos":"adj","ko":"경계하는, 조심하는","ex":"Consumers should be wary of emails that ask for their bank account details or passwords.","ans":"wary","exKo":"소비자는 은행 계좌 정보나 비밀번호를 요구하는 이메일을 경계해야 한다.","syn":["cautious","careful","suspicious"],"ant":["trusting","careless"],"lv":2,"cat":"voc"},{"w":"weary","pos":"adj","ko":"지친, (of) 싫증 난","ex":"Many residents have grown weary of the constant construction noise in their neighborhood.","ans":"weary","exKo":"많은 주민이 동네의 끊임없는 공사 소음에 지쳐 버렸다.","syn":["tired","exhausted","fed up"],"ant":["energetic","refreshed"],"lv":3,"cat":"voc"},{"w":"wholesale","pos":"adj","ko":"도매의, 대규모의","ex":"Restaurant owners buy vegetables at wholesale prices from the market early in the morning.","ans":"wholesale","exKo":"식당 주인들은 이른 아침 시장에서 채소를 도매가로 산다.","syn":["bulk","mass","large-scale"],"ant":["retail"],"lv":3,"cat":"voc"},{"w":"withdraw","pos":"v","ko":"(돈을) 인출하다, 철회하다, 물러나다","ex":"You can withdraw up to one million won a day from this ATM without paying a fee.","ans":"withdraw","exKo":"이 현금 자동 인출기에서는 수수료 없이 하루 최대 100만 원까지 인출할 수 있다.","syn":["take out","retract","pull out"],"ant":["deposit"],"lv":1,"cat":"voc"},{"w":"withstand","pos":"v","ko":"견뎌 내다, 버티다","ex":"The new bridge was designed to withstand strong earthquakes and wind speeds of over two hundred kilometers per hour.","ans":"withstand","exKo":"새 다리는 강한 지진과 시속 200킬로미터가 넘는 바람을 견디도록 설계되었다.","syn":["endure","resist","survive"],"ant":["yield","succumb"],"lv":2,"cat":"voc"},{"w":"work out","pos":"phr","ko":"운동하다, (문제를) 해결하다, 잘 풀리다","ex":"The two sides finally worked out an agreement after negotiating for almost twelve hours.","ans":"worked out","exKo":"양측은 거의 12시간 동안 협상한 끝에 마침내 합의안을 마련했다.","syn":["solve","figure out","exercise"],"ant":["fail"],"lv":1,"cat":"voc"},{"w":"worthwhile","pos":"adj","ko":"가치 있는, 보람 있는","ex":"Although the course was expensive, most students said it was a worthwhile investment in their future.","ans":"worthwhile","exKo":"강좌가 비쌌지만 대부분의 학생은 자신의 미래를 위한 가치 있는 투자였다고 말했다.","syn":["valuable","rewarding","beneficial"],"ant":["worthless","pointless"],"lv":1,"cat":"voc"},{"w":"yearn","pos":"v","ko":"갈망하다, 동경하다","ex":"After years of living abroad, she yearned to return to her hometown and see her family.","ans":"yearned","exKo":"수년간 해외에서 살고 나니 그녀는 고향에 돌아가 가족을 보고 싶은 마음이 간절했다.","syn":["long","crave","desire"],"ant":[],"lv":3,"cat":"voc"},{"w":"yield","pos":"v","ko":"(결과를) 내다, 산출하다, 양보하다","ex":"The new farming method yielded twice as much rice as traditional methods in the trial.","ans":"yielded","exKo":"새 농법은 시험 재배에서 기존 방식보다 두 배 많은 쌀을 생산했다.","syn":["produce","generate","give way"],"ant":["resist"],"lv":2,"cat":"voc"},{"w":"zealous","pos":"adj","ko":"열성적인, 열심인","ex":"The zealous volunteers worked through the night to deliver food and blankets to flood victims.","ans":"zealous","exKo":"열성적인 자원봉사자들은 수재민에게 음식과 담요를 전달하기 위해 밤새 일했다.","syn":["enthusiastic","passionate","eager"],"ant":["apathetic","indifferent"],"lv":3,"cat":"voc"},{"w":"be swamped","pos":"phr","ko":"일이 너무 많아 정신없다","ex":"A: Can you help me with this report? B: Sorry, I'm swamped with my own work today.","ans":"I'm swamped","exKo":"A: 이 보고서 좀 도와줄래? B: 미안, 오늘 내 일만으로도 정신없어.","syn":["be extremely busy"],"ant":[],"lv":1,"cat":"idiom"},{"w":"take a rain check","pos":"phr","ko":"다음 기회로 미루다","ex":"A: Want to grab dinner tonight? B: Can I take a rain check? I have to work late.","ans":"take a rain check","exKo":"A: 오늘 저녁 먹을래? B: 다음에 해도 될까? 야근해야 해서.","syn":["postpone an offer to a later time"],"ant":[],"lv":1,"cat":"idiom"},{"w":"count me in","pos":"phr","ko":"나도 끼워 줘, 나도 할게","ex":"A: We're going hiking on Saturday. B: Sounds great. Count me in!","ans":"Count me in","exKo":"A: 우리 토요일에 등산 가. B: 좋다. 나도 갈게!","syn":["include me","I'll join"],"ant":["count me out"],"lv":1,"cat":"idiom"},{"w":"count me out","pos":"phr","ko":"난 빼 줘","ex":"A: Who's up for karaoke after the meeting? B: Count me out. I'm exhausted.","ans":"Count me out","exKo":"A: 회의 끝나고 노래방 갈 사람? B: 난 빼 줘. 너무 피곤해.","syn":["don't include me"],"ant":["count me in"],"lv":1,"cat":"idiom"},{"w":"slip one's mind","pos":"phr","ko":"깜빡 잊다","ex":"A: Did you mail the package? B: Oh no, it completely slipped my mind.","ans":"slipped my mind","exKo":"A: 소포 부쳤어? B: 아차, 완전히 깜빡했어.","syn":["forget"],"ant":[],"lv":1,"cat":"idiom"},{"w":"call it a day","pos":"phr","ko":"오늘은 그만하다","ex":"A: It's already eight o'clock. B: Let's call it a day and finish tomorrow.","ans":"call it a day","exKo":"A: 벌써 8시야. B: 오늘은 여기까지 하고 내일 마무리하자.","syn":["stop working for the day"],"ant":[],"lv":1,"cat":"idiom"},{"w":"no hard feelings","pos":"phr","ko":"악감정 없어, 서운해하지 마","ex":"A: Sorry I had to turn down your proposal. B: No hard feelings. I understand.","ans":"No hard feelings","exKo":"A: 제안을 거절해서 미안해. B: 괜찮아, 서운하지 않아. 이해해.","syn":["I'm not upset"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I'll pass","pos":"phr","ko":"난 사양할게","ex":"A: Would you like some more cake? B: I'll pass, thanks. I'm full.","ans":"I'll pass","exKo":"A: 케이크 더 먹을래? B: 괜찮아, 고마워. 배불러.","syn":["no, thank you"],"ant":[],"lv":1,"cat":"idiom"},{"w":"sleep on it","pos":"phr","ko":"하룻밤 생각해 보다","ex":"A: So, will you accept the job offer? B: I need to sleep on it before I decide.","ans":"sleep on it","exKo":"A: 그래서 그 일자리 제안 받을 거야? B: 결정하기 전에 하룻밤 더 생각해 봐야겠어.","syn":["think about it overnight"],"ant":[],"lv":1,"cat":"idiom"},{"w":"beats me","pos":"phr","ko":"나도 모르겠어","ex":"A: Why is the bus so late today? B: Beats me. Maybe there was an accident.","ans":"Beats me","exKo":"A: 오늘 버스가 왜 이렇게 늦지? B: 나도 몰라. 사고가 났나 봐.","syn":["I have no idea"],"ant":[],"lv":1,"cat":"idiom"},{"w":"my treat","pos":"phr","ko":"내가 살게","ex":"A: How much do I owe you for lunch? B: Nothing. It's my treat today.","ans":"my treat","exKo":"A: 점심값 얼마 주면 돼? B: 안 줘도 돼. 오늘은 내가 사는 거야.","syn":["I'll pay"],"ant":[],"lv":1,"cat":"idiom"},{"w":"it's on me","pos":"phr","ko":"내가 낼게","ex":"A: Let's split the bill. B: Don't worry about it. It's on me.","ans":"It's on me","exKo":"A: 나눠서 내자. B: 신경 쓰지 마. 내가 낼게.","syn":["I'll pay for it"],"ant":[],"lv":1,"cat":"idiom"},{"w":"go Dutch","pos":"phr","ko":"각자 내다","ex":"A: You paid last time, so let me pay. B: How about we go Dutch instead?","ans":"go Dutch","exKo":"A: 지난번에 네가 냈으니 이번엔 내가 낼게. B: 그냥 각자 내는 게 어때?","syn":["each pay for oneself","split the bill"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I'm all ears","pos":"phr","ko":"잘 듣고 있어, 말해 봐","ex":"A: I have an idea for our project. B: Really? I'm all ears.","ans":"I'm all ears","exKo":"A: 우리 프로젝트에 대한 아이디어가 있어. B: 정말? 어서 말해 봐.","syn":["I'm listening carefully"],"ant":[],"lv":1,"cat":"idiom"},{"w":"a piece of cake","pos":"phr","ko":"아주 쉬운 일","ex":"A: How was the driving test? B: It was a piece of cake.","ans":"a piece of cake","exKo":"A: 운전면허 시험 어땠어? B: 식은 죽 먹기였어.","syn":["very easy"],"ant":[],"lv":1,"cat":"idiom"},{"w":"under the weather","pos":"phr","ko":"몸이 좀 안 좋은","ex":"A: You look pale. Are you okay? B: I'm feeling a bit under the weather.","ans":"under the weather","exKo":"A: 얼굴이 창백하네. 괜찮아? B: 몸이 좀 안 좋아.","syn":["slightly sick"],"ant":[],"lv":1,"cat":"idiom"},{"w":"hit the road","pos":"phr","ko":"출발하다, 떠나다","ex":"A: It's getting dark. B: You're right. We should hit the road.","ans":"hit the road","exKo":"A: 날이 어두워지네. B: 맞아. 이제 출발해야겠다.","syn":["leave","set off"],"ant":[],"lv":1,"cat":"idiom"},{"w":"hang in there","pos":"phr","ko":"조금만 버텨, 힘내","ex":"A: I've failed the exam twice already. B: Hang in there. You'll pass next time.","ans":"Hang in there","exKo":"A: 벌써 시험에 두 번 떨어졌어. B: 힘내. 다음엔 붙을 거야.","syn":["don't give up"],"ant":[],"lv":1,"cat":"idiom"},{"w":"you can say that again","pos":"phr","ko":"정말 그래, 완전 동의해","ex":"A: This summer is unbearably hot. B: You can say that again.","ans":"You can say that again","exKo":"A: 올여름은 견딜 수 없이 덥네. B: 정말 그래.","syn":["I completely agree"],"ant":[],"lv":1,"cat":"idiom"},{"w":"tell me about it","pos":"phr","ko":"내 말이, 누가 아니래","ex":"A: Traffic was terrible this morning. B: Tell me about it. I was an hour late.","ans":"Tell me about it","exKo":"A: 오늘 아침 차가 엄청 막혔어. B: 내 말이. 난 한 시간 늦었어.","syn":["I know exactly what you mean"],"ant":[],"lv":1,"cat":"idiom"},{"w":"don't mention it","pos":"phr","ko":"별말씀을, 천만에","ex":"A: Thanks so much for the ride. B: Don't mention it.","ans":"Don't mention it","exKo":"A: 태워 줘서 정말 고마워. B: 별말을.","syn":["you're welcome"],"ant":[],"lv":1,"cat":"idiom"},{"w":"my bad","pos":"phr","ko":"내 잘못이야","ex":"A: You sent me the wrong file. B: Oh, my bad. I'll send the right one now.","ans":"my bad","exKo":"A: 파일을 잘못 보냈어. B: 아, 내 실수야. 지금 맞는 걸로 보낼게.","syn":["my mistake"],"ant":[],"lv":1,"cat":"idiom"},{"w":"keep me posted","pos":"phr","ko":"진행 상황을 계속 알려 줘","ex":"A: I'm still waiting to hear from the hospital. B: Keep me posted, okay?","ans":"Keep me posted","exKo":"A: 아직 병원 연락을 기다리는 중이야. B: 소식 있으면 알려 줘, 알았지?","syn":["keep me informed"],"ant":[],"lv":1,"cat":"idiom"},{"w":"get the hang of","pos":"phr","ko":"요령을 터득하다","ex":"A: Is the new software hard to use? B: A little, but I'm getting the hang of it.","ans":"getting the hang of","exKo":"A: 새 프로그램 쓰기 어려워? B: 조금. 그래도 요령이 생기고 있어.","syn":["learn how to do something"],"ant":[],"lv":1,"cat":"idiom"},{"w":"run late","pos":"phr","ko":"늦어지다","ex":"A: Where are you? The movie starts soon. B: Sorry, I'm running late. Go in without me.","ans":"running late","exKo":"A: 어디야? 영화 곧 시작해. B: 미안, 늦어지고 있어. 먼저 들어가.","syn":["be behind schedule"],"ant":[],"lv":1,"cat":"idiom"},{"w":"come down with","pos":"phr","ko":"(병에) 걸리다","ex":"A: Why wasn't Tom at work? B: He came down with the flu.","ans":"came down with","exKo":"A: 톰은 왜 출근 안 했어? B: 독감에 걸렸대.","syn":["catch an illness"],"ant":[],"lv":1,"cat":"idiom"},{"w":"make it","pos":"phr","ko":"(모임에) 가다, 시간 맞춰 가다","ex":"A: Are you coming to my party on Friday? B: I'm afraid I can't make it.","ans":"make it","exKo":"A: 금요일 내 파티에 올 거야? B: 아쉽지만 못 갈 것 같아.","syn":["attend","arrive in time"],"ant":[],"lv":1,"cat":"idiom"},{"w":"give it a shot","pos":"phr","ko":"한번 해 보다","ex":"A: I've never tried skiing before. B: Why don't you give it a shot?","ans":"give it a shot","exKo":"A: 스키는 한 번도 안 타 봤어. B: 한번 해 보는 게 어때?","syn":["try it"],"ant":[],"lv":1,"cat":"idiom"},{"w":"call off","pos":"phr","ko":"취소하다","ex":"A: Is the outdoor concert still on? B: No, they called it off because of the rain.","ans":"called it off","exKo":"A: 야외 공연 아직 하는 거야? B: 아니, 비 때문에 취소됐어.","syn":["cancel"],"ant":[],"lv":1,"cat":"idiom"},{"w":"drop by","pos":"phr","ko":"잠깐 들르다","ex":"A: I'm near your office. B: Great. Why don't you drop by for a coffee?","ans":"drop by","exKo":"A: 나 너희 사무실 근처야. B: 잘됐다. 커피 마시러 잠깐 들러.","syn":["visit briefly","stop by"],"ant":[],"lv":1,"cat":"idiom"},{"w":"pick up the tab","pos":"phr","ko":"계산하다, 비용을 내다","ex":"A: Who's paying for the team dinner? B: The manager said she'd pick up the tab.","ans":"pick up the tab","exKo":"A: 팀 회식은 누가 내? B: 부장님이 내신대.","syn":["pay the bill"],"ant":[],"lv":2,"cat":"idiom"},{"w":"cover for","pos":"phr","ko":"~의 일을 대신 맡아 주다","ex":"A: I have a doctor's appointment this afternoon. B: Go ahead. I'll cover for you.","ans":"cover for you","exKo":"A: 오늘 오후에 병원 예약이 있어. B: 다녀와. 내가 대신 해 줄게.","syn":["do someone's work while they are away"],"ant":[],"lv":2,"cat":"idiom"},{"w":"catch up on","pos":"phr","ko":"밀린 것을 따라잡다","ex":"A: What are you doing this weekend? B: I'm going to catch up on some sleep.","ans":"catch up on","exKo":"A: 이번 주말에 뭐 해? B: 밀린 잠 좀 잘 거야.","syn":["do what you didn't have time for earlier"],"ant":[],"lv":1,"cat":"idiom"},{"w":"back out","pos":"phr","ko":"(약속에서) 발을 빼다","ex":"A: Is Mark still coming on the trip? B: No, he backed out at the last minute.","ans":"backed out","exKo":"A: 마크도 여행 가는 거 맞지? B: 아니, 막판에 빠졌어.","syn":["withdraw from a promise"],"ant":[],"lv":2,"cat":"idiom"},{"w":"be up to","pos":"phr","ko":"~에게 달려 있다","ex":"A: Should we eat Chinese or Italian? B: It's up to you. I'm fine with either.","ans":"It's up to you","exKo":"A: 중식 먹을까, 이탈리아 음식 먹을까? B: 네가 정해. 난 둘 다 좋아.","syn":["you decide"],"ant":[],"lv":1,"cat":"idiom"},{"w":"what's the catch","pos":"phr","ko":"숨은 함정이 뭐야","ex":"A: This phone plan is free for six months. B: Really? What's the catch?","ans":"What's the catch","exKo":"A: 이 요금제는 6개월 동안 무료래. B: 정말? 무슨 조건이 있는 거야?","syn":["what is the hidden problem"],"ant":[],"lv":2,"cat":"idiom"},{"w":"a steal","pos":"phr","ko":"거저나 다름없는 싼 물건","ex":"A: I got this jacket for only twenty dollars. B: Wow, that's a steal!","ans":"a steal","exKo":"A: 이 재킷 20달러밖에 안 줬어. B: 와, 완전 거저네!","syn":["a very good bargain"],"ant":["a rip-off"],"lv":2,"cat":"idiom"},{"w":"a rip-off","pos":"phr","ko":"바가지","ex":"A: They charged me fifty dollars for a cab ride across town. B: That's a total rip-off.","ans":"a total rip-off","exKo":"A: 시내 건너가는 택시비로 50달러 냈어. B: 완전 바가지네.","syn":["something far too expensive"],"ant":["a steal"],"lv":1,"cat":"idiom"},{"w":"cost an arm and a leg","pos":"phr","ko":"엄청 비싸다","ex":"A: Did you get your car fixed? B: Yes, but it cost an arm and a leg.","ans":"cost an arm and a leg","exKo":"A: 차 고쳤어? B: 응, 그런데 돈이 엄청 들었어.","syn":["be very expensive"],"ant":[],"lv":1,"cat":"idiom"},{"w":"break the bank","pos":"phr","ko":"큰돈이 들다","ex":"A: Is that restaurant expensive? B: Not at all. It won't break the bank.","ans":"break the bank","exKo":"A: 그 식당 비싸? B: 전혀. 큰돈 안 들어.","syn":["cost too much money"],"ant":[],"lv":2,"cat":"idiom"},{"w":"on a tight budget","pos":"phr","ko":"예산이 빠듯한","ex":"A: Let's stay at that nice hotel. B: We can't. We're on a tight budget this trip.","ans":"on a tight budget","exKo":"A: 저 좋은 호텔에 묵자. B: 안 돼. 이번 여행은 예산이 빠듯해.","syn":["with little money to spend"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I'm broke","pos":"phr","ko":"빈털터리야","ex":"A: Want to go shopping this weekend? B: I wish I could, but I'm broke.","ans":"I'm broke","exKo":"A: 이번 주말에 쇼핑 갈래? B: 그러고 싶은데 돈이 하나도 없어.","syn":["I have no money"],"ant":[],"lv":1,"cat":"idiom"},{"w":"the last straw","pos":"phr","ko":"더는 못 참을 마지막 한계","ex":"A: Your neighbor played loud music again last night? B: Yes, and that was the last straw. I called the landlord.","ans":"the last straw","exKo":"A: 이웃이 어젯밤에 또 음악을 크게 틀었어? B: 응, 그걸로 더는 못 참겠더라. 집주인한테 전화했어.","syn":["the final problem that makes you lose patience"],"ant":[],"lv":2,"cat":"idiom"},{"w":"not my cup of tea","pos":"phr","ko":"내 취향이 아니다","ex":"A: Do you like horror movies? B: Not really. They're not my cup of tea.","ans":"not my cup of tea","exKo":"A: 공포 영화 좋아해? B: 별로. 내 취향은 아니야.","syn":["not something I like"],"ant":[],"lv":1,"cat":"idiom"},{"w":"not big on","pos":"phr","ko":"~을 별로 안 좋아하다","ex":"A: Let's go to the jazz bar tonight. B: Honestly, I'm not big on jazz.","ans":"I'm not big on","exKo":"A: 오늘 밤 재즈 바 가자. B: 솔직히 나 재즈는 별로야.","syn":["not really like"],"ant":[],"lv":2,"cat":"idiom"},{"w":"suit yourself","pos":"phr","ko":"마음대로 해","ex":"A: I don't want to come to the beach with you. B: Suit yourself. We'll go without you.","ans":"Suit yourself","exKo":"A: 너희랑 해변에 가기 싫어. B: 마음대로 해. 우리끼리 갈게.","syn":["do what you want"],"ant":[],"lv":2,"cat":"idiom"},{"w":"be my guest","pos":"phr","ko":"얼마든지 그러세요","ex":"A: Do you mind if I use your phone charger? B: Be my guest.","ans":"Be my guest","exKo":"A: 휴대폰 충전기 좀 써도 될까? B: 얼마든지.","syn":["please go ahead"],"ant":[],"lv":1,"cat":"idiom"},{"w":"go for it","pos":"phr","ko":"한번 해 봐, 밀어붙여","ex":"A: I'm thinking of applying for the scholarship. B: Go for it! You have nothing to lose.","ans":"Go for it","exKo":"A: 그 장학금에 지원해 볼까 해. B: 해 봐! 손해 볼 거 없잖아.","syn":["try it","do it"],"ant":[],"lv":1,"cat":"idiom"},{"w":"don't sweat it","pos":"phr","ko":"걱정하지 마","ex":"A: Sorry I spilled coffee on your desk. B: Don't sweat it. I'll wipe it up.","ans":"Don't sweat it","exKo":"A: 책상에 커피 쏟아서 미안해. B: 신경 쓰지 마. 내가 닦을게.","syn":["don't worry about it"],"ant":[],"lv":2,"cat":"idiom"},{"w":"no big deal","pos":"phr","ko":"별일 아니야","ex":"A: I'm so sorry I forgot your birthday. B: It's no big deal. Really.","ans":"no big deal","exKo":"A: 생일 잊어버려서 정말 미안해. B: 별거 아니야. 진짜로.","syn":["it's not important"],"ant":[],"lv":1,"cat":"idiom"},{"w":"not a chance","pos":"phr","ko":"절대 안 돼, 어림없어","ex":"A: Do you think we'll finish this by noon? B: Not a chance. There's too much left.","ans":"Not a chance","exKo":"A: 이거 정오까지 끝낼 수 있을까? B: 어림없어. 남은 게 너무 많아.","syn":["definitely not"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I wouldn't count on it","pos":"phr","ko":"너무 기대하지 마","ex":"A: Maybe the boss will give us Friday off. B: I wouldn't count on it.","ans":"I wouldn't count on it","exKo":"A: 사장님이 금요일에 쉬게 해 줄지도 몰라. B: 너무 기대하지 마.","syn":["it probably won't happen"],"ant":[],"lv":2,"cat":"idiom"},{"w":"don't hold your breath","pos":"phr","ko":"기대하지 마, 금방 안 될 거야","ex":"A: When will the landlord fix the heater? B: He said soon, but don't hold your breath.","ans":"don't hold your breath","exKo":"A: 집주인이 난방기 언제 고쳐 준대? B: 곧이라고 했는데 기대는 하지 마.","syn":["it will not happen soon"],"ant":[],"lv":2,"cat":"idiom"},{"w":"take one's word for it","pos":"phr","ko":"말을 그대로 믿다","ex":"A: Trust me, the shortcut is faster. B: Okay, I'll take your word for it.","ans":"I'll take your word for it","exKo":"A: 믿어 봐, 지름길이 더 빨라. B: 알았어, 네 말 믿을게.","syn":["believe what you say"],"ant":[],"lv":2,"cat":"idiom"},{"w":"on the fence","pos":"phr","ko":"결정을 못 하고 망설이는","ex":"A: Have you decided which university to attend? B: Not yet. I'm still on the fence.","ans":"on the fence","exKo":"A: 어느 대학 갈지 정했어? B: 아직. 여전히 고민 중이야.","syn":["undecided"],"ant":[],"lv":2,"cat":"idiom"},{"w":"on second thought","pos":"phr","ko":"다시 생각해 보니","ex":"A: So you'll have the steak? B: On second thought, I'll have the fish.","ans":"On second thought","exKo":"A: 그럼 스테이크 드시겠어요? B: 다시 생각해 보니 생선으로 할게요.","syn":["after reconsidering"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I've had it with","pos":"phr","ko":"~에 질렸다, 더는 못 참겠다","ex":"A: Is your computer acting up again? B: Yes. I've had it with this old thing.","ans":"I've had it with","exKo":"A: 컴퓨터가 또 말썽이야? B: 응. 이 고물은 이제 지긋지긋해.","syn":["I can't tolerate it any more"],"ant":[],"lv":2,"cat":"idiom"},{"w":"fed up with","pos":"phr","ko":"~에 진저리가 난","ex":"A: You look annoyed. B: I'm fed up with working every weekend.","ans":"fed up with","exKo":"A: 짜증 나 보이네. B: 주말마다 일하는 거 진절머리 나.","syn":["tired of","annoyed by"],"ant":[],"lv":1,"cat":"idiom"},{"w":"get on one's nerves","pos":"phr","ko":"신경을 거슬리게 하다","ex":"A: Why did you move seats? B: The guy next to me kept tapping his pen. It got on my nerves.","ans":"got on my nerves","exKo":"A: 왜 자리를 옮겼어? B: 옆 사람이 계속 펜을 두드려서 신경 쓰였어.","syn":["annoy"],"ant":[],"lv":1,"cat":"idiom"},{"w":"keep your chin up","pos":"phr","ko":"기운 내","ex":"A: I didn't get into the team. B: Keep your chin up. There's always next season.","ans":"Keep your chin up","exKo":"A: 팀에 못 들어갔어. B: 기운 내. 다음 시즌도 있잖아.","syn":["stay positive"],"ant":[],"lv":2,"cat":"idiom"},{"w":"look on the bright side","pos":"phr","ko":"좋은 면을 보다","ex":"A: Our flight got canceled. B: Look on the bright side. We get one more day here.","ans":"Look on the bright side","exKo":"A: 비행기가 취소됐어. B: 좋게 생각해. 여기서 하루 더 있잖아.","syn":["think about the positive part"],"ant":[],"lv":1,"cat":"idiom"},{"w":"it's not the end of the world","pos":"phr","ko":"세상이 끝난 건 아니야","ex":"A: I got a C on my midterm. B: It's not the end of the world. You can do better on the final.","ans":"It's not the end of the world","exKo":"A: 중간고사에서 C 받았어. B: 그게 큰일은 아니야. 기말에서 더 잘하면 돼.","syn":["it's not that serious"],"ant":[],"lv":1,"cat":"idiom"},{"w":"better late than never","pos":"phr","ko":"늦더라도 하는 게 낫다","ex":"A: Sorry this thank-you card is two months late. B: Better late than never!","ans":"Better late than never","exKo":"A: 감사 카드가 두 달이나 늦어서 미안해. B: 안 하는 것보단 늦게라도 하는 게 낫지!","syn":["doing it late is still good"],"ant":[],"lv":1,"cat":"idiom"},{"w":"it's about time","pos":"phr","ko":"진작 그랬어야지","ex":"A: I finally signed up for a gym membership. B: It's about time! You've been talking about it for months.","ans":"It's about time","exKo":"A: 드디어 헬스장 등록했어. B: 진작 했어야지! 몇 달째 말만 했잖아.","syn":["it should have happened earlier"],"ant":[],"lv":1,"cat":"idiom"},{"w":"now or never","pos":"phr","ko":"지금 아니면 기회가 없다","ex":"A: Should I ask her out before she moves? B: Yes. It's now or never.","ans":"It's now or never","exKo":"A: 그녀가 이사 가기 전에 데이트 신청할까? B: 응. 지금 아니면 기회 없어.","syn":["this is the only chance"],"ant":[],"lv":2,"cat":"idiom"},{"w":"by the skin of one's teeth","pos":"phr","ko":"간신히, 아슬아슬하게","ex":"A: Did you pass the course? B: Yes, but only by the skin of my teeth.","ans":"by the skin of my teeth","exKo":"A: 그 과목 통과했어? B: 응, 겨우겨우.","syn":["barely","just narrowly"],"ant":[],"lv":3,"cat":"idiom"},{"w":"cut it close","pos":"phr","ko":"시간을 아슬아슬하게 맞추다","ex":"A: The train leaves at 9:05 and it's 9:00 now. B: We're really cutting it close.","ans":"cutting it close","exKo":"A: 기차가 9시 5분에 출발하는데 지금 9시야. B: 정말 아슬아슬하다.","syn":["leave very little time"],"ant":[],"lv":3,"cat":"idiom"},{"w":"in the nick of time","pos":"phr","ko":"아슬아슬하게 때맞춰","ex":"A: Did you catch your flight? B: Yes, I got to the gate just in the nick of time.","ans":"in the nick of time","exKo":"A: 비행기 탔어? B: 응, 탑승구에 겨우 시간 맞춰 도착했어.","syn":["just in time"],"ant":[],"lv":2,"cat":"idiom"},{"w":"at the last minute","pos":"phr","ko":"마지막 순간에","ex":"A: Why didn't Jenny give the presentation? B: She got sick, so we had to change speakers at the last minute.","ans":"at the last minute","exKo":"A: 제니는 왜 발표를 안 했어? B: 아파서 막판에 발표자를 바꿔야 했어.","syn":["at the latest possible time"],"ant":[],"lv":1,"cat":"idiom"},{"w":"off the top of one's head","pos":"phr","ko":"얼핏 떠오르는 대로, 즉석에서","ex":"A: How many people work here? B: Off the top of my head, about two hundred.","ans":"Off the top of my head","exKo":"A: 여기 몇 명이 일해? B: 대충 떠오르는 대로 말하면 200명쯤.","syn":["without checking","from memory"],"ant":[],"lv":2,"cat":"idiom"},{"w":"on the tip of one's tongue","pos":"phr","ko":"혀끝에서 맴도는","ex":"A: What's the name of that actor? B: Hold on, it's on the tip of my tongue.","ans":"on the tip of my tongue","exKo":"A: 그 배우 이름이 뭐였지? B: 잠깐, 입안에서 맴도는데.","syn":["almost remembered"],"ant":[],"lv":2,"cat":"idiom"},{"w":"ring a bell","pos":"phr","ko":"들어 본 것 같다","ex":"A: Do you know someone called Kevin Park? B: The name rings a bell, but I can't place him.","ans":"rings a bell","exKo":"A: 케빈 박이라는 사람 알아? B: 이름은 들어 본 것 같은데 누군지는 모르겠어.","syn":["sound familiar"],"ant":[],"lv":1,"cat":"idiom"},{"w":"lose track of time","pos":"phr","ko":"시간 가는 줄 모르다","ex":"A: You're two hours late! B: Sorry, I was reading and lost track of time.","ans":"lost track of time","exKo":"A: 두 시간이나 늦었잖아! B: 미안, 책 읽다가 시간 가는 줄 몰랐어.","syn":["forget what time it is"],"ant":[],"lv":1,"cat":"idiom"},{"w":"lose one's train of thought","pos":"phr","ko":"무슨 말 하려던 건지 잊다","ex":"A: You were saying something about the budget? B: Sorry, I lost my train of thought.","ans":"lost my train of thought","exKo":"A: 예산 얘기 하던 중이었지? B: 미안, 무슨 말 하려던 건지 까먹었어.","syn":["forget what you were saying"],"ant":[],"lv":2,"cat":"idiom"},{"w":"play it by ear","pos":"phr","ko":"상황 봐서 하다","ex":"A: What time should we meet on Sunday? B: Let's play it by ear and text each other.","ans":"play it by ear","exKo":"A: 일요일에 몇 시에 만날까? B: 상황 봐서 문자로 정하자.","syn":["decide as things happen"],"ant":[],"lv":2,"cat":"idiom"},{"w":"touch base","pos":"phr","ko":"잠깐 연락을 주고받다","ex":"A: Do you have time to talk about the event? B: Let's touch base after lunch.","ans":"touch base","exKo":"A: 행사 얘기 할 시간 있어? B: 점심 먹고 잠깐 얘기하자.","syn":["contact briefly"],"ant":[],"lv":2,"cat":"idiom"},{"w":"get back to","pos":"phr","ko":"나중에 다시 연락하다","ex":"A: Can you tell me the price now? B: I'm not sure yet. I'll get back to you tomorrow.","ans":"get back to you","exKo":"A: 지금 가격을 알려 줄 수 있어요? B: 아직 잘 모르겠어요. 내일 다시 연락드릴게요.","syn":["reply later"],"ant":[],"lv":1,"cat":"idiom"},{"w":"run by","pos":"phr","ko":"~에게 의견을 물어보다","ex":"A: Can I change the meeting date? B: Sure, but run it by the director first.","ans":"run it by","exKo":"A: 회의 날짜 바꿔도 돼요? B: 그럼요, 근데 먼저 이사님께 확인받으세요.","syn":["ask someone's opinion about"],"ant":[],"lv":2,"cat":"idiom"},{"w":"fill me in","pos":"phr","ko":"(놓친 내용을) 알려 줘","ex":"A: You missed a lot at yesterday's meeting. B: Really? Can you fill me in?","ans":"fill me in","exKo":"A: 어제 회의에서 많은 걸 놓쳤어. B: 정말? 무슨 얘기 했는지 알려 줄래?","syn":["tell me the details"],"ant":[],"lv":1,"cat":"idiom"},{"w":"long time no see","pos":"phr","ko":"오랜만이야","ex":"A: Hey, Minji! Long time no see. B: I know! It's been almost a year.","ans":"Long time no see","exKo":"A: 야, 민지야! 오랜만이다. B: 그러게! 거의 1년 됐네.","syn":["it's been a while"],"ant":[],"lv":1,"cat":"idiom"},{"w":"what brings you here","pos":"phr","ko":"여긴 어쩐 일이야","ex":"A: What brings you here? B: I'm meeting a client in this building.","ans":"What brings you here","exKo":"A: 여긴 어쩐 일이야? B: 이 건물에서 고객을 만나기로 했어.","syn":["why are you here"],"ant":[],"lv":1,"cat":"idiom"},{"w":"what's up with","pos":"phr","ko":"~은 왜 그래","ex":"A: What's up with Sarah? She seems upset. B: She just had a fight with her sister.","ans":"What's up with","exKo":"A: 사라 왜 저래? 기분 안 좋아 보여. B: 방금 언니랑 싸웠대.","syn":["what is wrong with"],"ant":[],"lv":1,"cat":"idiom"},{"w":"don't get me wrong","pos":"phr","ko":"오해하지 마","ex":"A: So you don't like my plan? B: Don't get me wrong. It's good, but it's too expensive.","ans":"Don't get me wrong","exKo":"A: 그러니까 내 계획이 마음에 안 든다는 거야? B: 오해하지 마. 좋긴 한데 너무 비싸.","syn":["don't misunderstand me"],"ant":[],"lv":1,"cat":"idiom"},{"w":"that makes two of us","pos":"phr","ko":"나도 마찬가지야","ex":"A: I'm so nervous about the presentation. B: That makes two of us.","ans":"That makes two of us","exKo":"A: 발표 때문에 너무 긴장돼. B: 나도 그래.","syn":["I feel the same"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I couldn't agree more","pos":"phr","ko":"전적으로 동의해","ex":"A: We need more parking spaces in this area. B: I couldn't agree more.","ans":"I couldn't agree more","exKo":"A: 이 지역엔 주차 공간이 더 필요해. B: 전적으로 동의해.","syn":["I totally agree"],"ant":[],"lv":1,"cat":"idiom"},{"w":"point taken","pos":"phr","ko":"무슨 말인지 알겠어","ex":"A: You really should back up your files more often. B: Point taken. I'll do it tonight.","ans":"Point taken","exKo":"A: 파일 백업 좀 더 자주 해야 해. B: 알았어. 오늘 밤에 할게.","syn":["I accept what you said"],"ant":[],"lv":2,"cat":"idiom"},{"w":"fair enough","pos":"phr","ko":"그럴 만하네, 일리 있어","ex":"A: I can't lend you my car because I need it tomorrow. B: Fair enough.","ans":"Fair enough","exKo":"A: 내일 써야 해서 차를 못 빌려줘. B: 그럴 만하네.","syn":["that's reasonable"],"ant":[],"lv":1,"cat":"idiom"},{"w":"speak of the devil","pos":"phr","ko":"호랑이도 제 말 하면 온다더니","ex":"A: Has anyone seen Jason today? B: Speak of the devil. Here he comes now.","ans":"Speak of the devil","exKo":"A: 오늘 제이슨 본 사람? B: 호랑이도 제 말 하면 온다더니, 지금 오네.","syn":["the person we were talking about just appeared"],"ant":[],"lv":2,"cat":"idiom"},{"w":"burn the midnight oil","pos":"phr","ko":"밤늦게까지 일하거나 공부하다","ex":"A: You look tired. B: I was burning the midnight oil to finish my thesis.","ans":"burning the midnight oil","exKo":"A: 피곤해 보이네. B: 논문 끝내느라 밤늦게까지 했어.","syn":["work late into the night"],"ant":[],"lv":2,"cat":"idiom"},{"w":"pull an all-nighter","pos":"phr","ko":"밤을 새우다","ex":"A: Did you get any sleep last night? B: No, I pulled an all-nighter for my exam.","ans":"pulled an all-nighter","exKo":"A: 어젯밤에 잠 좀 잤어? B: 아니, 시험 때문에 밤샜어.","syn":["stay up all night"],"ant":[],"lv":1,"cat":"idiom"},{"w":"hit the books","pos":"phr","ko":"열심히 공부하다","ex":"A: Want to go to the movies tonight? B: I can't. I have to hit the books.","ans":"hit the books","exKo":"A: 오늘 밤 영화 보러 갈래? B: 안 돼. 공부해야 해.","syn":["study hard"],"ant":[],"lv":1,"cat":"idiom"},{"w":"learn the ropes","pos":"phr","ko":"요령을 배우다","ex":"A: How's your new job? B: I'm still learning the ropes, but everyone's helpful.","ans":"learning the ropes","exKo":"A: 새 직장 어때? B: 아직 일 배우는 중인데 다들 잘 도와줘.","syn":["learn how things work"],"ant":[],"lv":2,"cat":"idiom"},{"w":"a long shot","pos":"phr","ko":"가능성이 낮은 시도","ex":"A: Do you think I could win the contest? B: It's a long shot, but it's worth trying.","ans":"a long shot","exKo":"A: 내가 대회에서 우승할 수 있을까? B: 가능성은 낮지만 해 볼 만해.","syn":["something unlikely to succeed"],"ant":[],"lv":2,"cat":"idiom"},{"w":"out of the question","pos":"phr","ko":"불가능한, 논의할 여지가 없는","ex":"A: Can I take next week off? B: I'm afraid that's out of the question. We're too busy.","ans":"out of the question","exKo":"A: 다음 주에 휴가 써도 될까요? B: 그건 안 되겠어요. 너무 바빠요.","syn":["impossible","not allowed"],"ant":[],"lv":2,"cat":"idiom"},{"w":"up in the air","pos":"phr","ko":"아직 미정인","ex":"A: Where are you going for vacation? B: It's still up in the air.","ans":"up in the air","exKo":"A: 휴가 어디로 가? B: 아직 안 정했어.","syn":["undecided","uncertain"],"ant":[],"lv":2,"cat":"idiom"},{"w":"take your time","pos":"phr","ko":"천천히 해","ex":"A: Sorry, I need a few more minutes to decide. B: Take your time. There's no rush.","ans":"Take your time","exKo":"A: 미안, 정하는 데 몇 분 더 걸릴 것 같아. B: 천천히 해. 급할 거 없어.","syn":["don't hurry"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I'm easy","pos":"phr","ko":"난 아무거나 괜찮아","ex":"A: Do you want to sit inside or outside? B: I'm easy. You choose.","ans":"I'm easy","exKo":"A: 안에 앉을래, 밖에 앉을래? B: 난 아무 데나 좋아. 네가 골라.","syn":["I don't mind either way"],"ant":[],"lv":2,"cat":"idiom"},{"w":"not that I know of","pos":"phr","ko":"내가 알기론 아니야","ex":"A: Is there a meeting this afternoon? B: Not that I know of.","ans":"Not that I know of","exKo":"A: 오늘 오후에 회의 있어? B: 내가 알기론 없어.","syn":["I don't think so"],"ant":[],"lv":1,"cat":"idiom"},{"w":"so far so good","pos":"phr","ko":"아직까지는 괜찮아","ex":"A: How's the new apartment? B: So far so good. The neighbors are quiet.","ans":"So far so good","exKo":"A: 새 아파트 어때? B: 지금까진 좋아. 이웃들이 조용해.","syn":["it's going well until now"],"ant":[],"lv":1,"cat":"idiom"},{"w":"couldn't be better","pos":"phr","ko":"더할 나위 없이 좋아","ex":"A: How are things with you these days? B: Couldn't be better. I just got promoted.","ans":"Couldn't be better","exKo":"A: 요즘 어떻게 지내? B: 최고야. 막 승진했거든.","syn":["things are excellent"],"ant":["couldn't be worse"],"lv":1,"cat":"idiom"},{"w":"can't complain","pos":"phr","ko":"그럭저럭 괜찮아","ex":"A: How's business these days? B: Can't complain. Sales are steady.","ans":"Can't complain","exKo":"A: 요즘 장사 어때? B: 그럭저럭 괜찮아. 매출이 꾸준해.","syn":["things are fine"],"ant":[],"lv":1,"cat":"idiom"},{"w":"same old, same old","pos":"phr","ko":"늘 똑같지 뭐","ex":"A: What's new with you? B: Same old, same old. Just work and home.","ans":"Same old, same old","exKo":"A: 별일 없어? B: 늘 똑같지. 회사랑 집뿐이야.","syn":["nothing has changed"],"ant":[],"lv":2,"cat":"idiom"},{"w":"I've been better","pos":"phr","ko":"별로 좋지 않아","ex":"A: How are you feeling today? B: I've been better. My back still hurts.","ans":"I've been better","exKo":"A: 오늘 몸은 좀 어때? B: 썩 좋진 않아. 아직 허리가 아파.","syn":["not very well"],"ant":[],"lv":1,"cat":"idiom"},{"w":"things are looking up","pos":"phr","ko":"상황이 나아지고 있다","ex":"A: Did you find a new job? B: I have two interviews next week, so things are looking up.","ans":"things are looking up","exKo":"A: 새 직장 구했어? B: 다음 주에 면접이 두 개 있어서 좀 나아지고 있어.","syn":["the situation is improving"],"ant":[],"lv":2,"cat":"idiom"},{"w":"I'm all set","pos":"phr","ko":"준비 다 됐어, 필요한 거 없어","ex":"A: Do you need anything else for your trip? B: No, thanks. I'm all set.","ans":"I'm all set","exKo":"A: 여행에 더 필요한 거 있어? B: 아니, 고마워. 준비 다 됐어.","syn":["I'm ready","I have everything I need"],"ant":[],"lv":1,"cat":"idiom"},{"w":"think it over","pos":"phr","ko":"곰곰이 생각해 보다","ex":"A: Will you join our book club? B: Let me think it over and tell you on Monday.","ans":"think it over","exKo":"A: 우리 독서 모임에 들어올래? B: 생각해 보고 월요일에 알려 줄게.","syn":["consider carefully"],"ant":[],"lv":1,"cat":"idiom"},{"w":"hold on a sec","pos":"phr","ko":"잠깐만 기다려","ex":"A: Is Mr. Lee available? B: Hold on a sec. I'll check if he's in.","ans":"Hold on a sec","exKo":"A: 이 선생님 계세요? B: 잠깐만요. 계신지 확인해 볼게요.","syn":["wait a moment"],"ant":[],"lv":1,"cat":"idiom"},{"w":"I'll be right with you","pos":"phr","ko":"곧 <script>/* 파고다 뉴텝스 보카 쪽 사진 → [{w, ko}] (표제어와 뜻만)
   책 배치: 왼쪽 칸에 큰 표제어, 바로 밑에 발음기호, 그 밑에 파생어·유의어(한글 뜻이 같은 줄에 붙음)
            오른쪽 칸에 뜻(한글) → 예문(영어) → 해석(한글, 「~다.」로 끝남)
   app.html 과 node 시험에서 같이 쓴다. */
function pagodaParse(lines,opt){
  opt=opt||{};
  const isKo=s=>/[가-힣]/.test(s);
  const latinOnly=s=>/^[A-Za-z][A-Za-z\- ']*[A-Za-z]$/.test(s.trim());
  const ipaLike=s=>/[\[\]\(\)'ː:əɪʃʒθðæŋ]/.test(s)&&!isKo(s);
  const engSentence=s=>!isKo(s)&&(s.match(/[A-Za-z]+/g)||[]).length>=2&&/[A-Za-z]/.test(s);
  lines=lines.map(l=>Object.assign({},l,{t:String(l.t).replace(/\s+/g," ").trim()})).filter(l=>l.t);
  /* 1. 표제어 후보: 영어 글자만, 1~3낱말 */
  const cand=lines.filter(l=>latinOnly(l.t)&&l.t.split(" ").length<=3&&l.t.length>=3);
  /* 2. 발음기호가 바로 밑에 있으면 표제어로 확정 */
  const anchors=cand.filter(c=>lines.some(o=>o!==c&&ipaLike(o.t)&&o.y>c.y&&o.y-c.y<=c.h*2.4&&Math.abs(o.x-c.x)<c.h*2.5));
  /* 3. 발음기호가 없는 표제어(숙어 등)는 앞뒤 표제어가 이루는 세로 줄 위에 있고 글자 크기가 비슷하면 포함 */
  const heads=anchors.slice();
  if(anchors.length>=2){
    const medH=anchors.map(a=>a.h).sort((a,b)=>a-b)[Math.floor(anchors.length/2)];
    for(const c of cand){
      if(heads.includes(c))continue;
      const near=anchors.filter(a=>Math.abs(a.x-c.x)<medH*2.5).sort((a,b)=>Math.abs(a.y-c.y)-Math.abs(b.y-c.y));
      if(near.length&&c.h>=medH*0.8&&Math.abs(near[0].x-c.x)<medH*1.6)heads.push(c);
    }
  }
  /* 파생어·유의어: 표제어 밑 왼쪽 칸의 「영어 + 한글 뜻」 줄. 앞 4글자가 표제어와 같으면 파생어, 아니면 유의어 */
  const relOf=H=>{
    const nextY=Math.min(...heads.filter(o=>o!==H&&o.y>H.y&&Math.abs(o.x-H.x)<H.h*3).map(o=>o.y).concat([Infinity]));
    const rows=lines.filter(o=>o.y>H.y+H.h*0.8&&o.y<nextY-H.h*0.5&&Math.abs(o.x-H.x)<H.h*3&&!ipaLike(o.t));
    const rel=[];
    for(const o of rows){
      let m=o.t.match(/^([A-Za-z][A-Za-z\- ']{1,30}?)\s*([가-힣(~].*)$/);
      if(!m&&latinOnly(o.t)){const k=lines.find(q=>isKo(q.t)&&!/[A-Za-z]/.test(q.t)&&q.x>o.x+o.w&&q.x<o.x+o.w+o.h*4&&Math.abs((q.y+q.h/2)-(o.y+o.h/2))<o.h);if(k)m=[0,o.t,k.t]}
      if(!m)continue;
      const w=m[1].trim(),ko=m[2].replace(/^[명동형부]\s+/,"").replace(/[.\s]+$/,"").trim();
      if(!ko||w.toLowerCase()===H.t.toLowerCase())continue;
      const a=w.toLowerCase(),b=H.t.toLowerCase();
      rel.push({w,ko,kind:a.slice(0,4)===b.slice(0,4)?"der":"syn"});
    }
    return rel;
  };
  /* 4. 표제어마다 오른쪽 칸에서 뜻 찾기 */
  const out=[];
  for(const H of heads){
    const right=lines.filter(o=>o.x>H.x+H.w+H.h&&o.y>H.y-H.h*4&&o.y<H.y+H.h*3);
    if(!right.length){out.push({w:H.t,ko:"",y:H.y,x:H.x});continue}
    const minx=Math.min(...right.filter(o=>isKo(o.t)).map(o=>o.x).concat([Infinity]));
    const col=right.filter(o=>o.x>=minx-H.h*1.5&&o.x<=minx+H.h*4).sort((a,b)=>a.y-b.y);
    const E=col.find(o=>engSentence(o.t)&&o.y>H.y-H.h*1.5);
    const kos=col.filter(o=>isKo(o.t)&&o.y<(E?E.y:H.y+H.h)&&o.y>H.y-H.h*4);
    const run=[];
    for(let i=kos.length-1;i>=0;i--){
      const cur=kos[i];
      if(!run.length){run.unshift(cur);continue}
      const below=run[0],gap=below.y-(cur.y+cur.h);
      if(/다\s*\.\s*$/.test(cur.t)||gap>Math.min(cur.h,below.h)*0.6)break;
      run.unshift(cur);
    }
    let ko=run.map(o=>o.t).join(" ");
    ko=ko.replace(/^[0oO○◎●Bb]\s*(?=[가-힣(])/,"").replace(/([가-힣])\.\s+(?=[가-힣(])/g,"$1, ").replace(/\s*[|ㅣ]\s*/g,", ").replace(/\s+([.,])/g,"$1").replace(/[.\s]+$/,"").trim();
    const item={w:H.t.replace(/\s+/g," "),ko,y:H.y,x:H.x};
    if(opt.full)item.rel=relOf(H);
    out.push(item);
  }
  /* 왼쪽 쪽부터, 위에서 아래로 */
  const xs=out.map(o=>o.x).sort((a,b)=>a-b),split=xs.length?(xs[0]+xs[xs.length-1])/2:0;
  const page=o=>(xs.length>1&&xs[xs.length-1]-xs[0]>400)?(o.x>split?1:0):0;
  out.sort((a,b)=>page(a)-page(b)||a.y-b.y);
  return out.map(o=>opt.full?{w:o.w,ko:o.ko,rel:o.rel||[]}:{w:o.w,ko:o.ko});
}
if(typeof module!=="undefined")module.exports=pagodaParse;
</script>

function lastBatch(){const l=Object.values(S.words).filter(w=>w.batch).map(w=>w.batch);if(!l.length)return null;const id=l.sort().pop();const ids=Object.entries(S.words).filter(([,w])=>w.batch===id&&!w.del).map(([k])=>k);const meta=(S.cfg["b_"+id]||{}).v||{};return {id,ids,when:meta.when||"",skip:meta.skip||0,front:meta.front||0,rel:meta.rel||0,bad:""}}
window.onOcrResult=function(json,pending){
  if(typeof pending==="number")ocrPending=pending;
  let r;try{r=JSON.parse(json)}catch(e){r={error:"결과를 읽는 중에 문제가 생겼어요"}}
  const full=photoFull();
  const rows=r.error?[]:pagodaParse(r.lines||[],{full}).filter(x=>x.w&&x.ko);
  if(!rows.length){toast("사진 한 장에서 단어를 찾지 못했어요. 쪽 전체가 들어오게 다시 찍어 주세요");if(view==="words")vWords();return}
  const idx={};for(const w of allWords())idx[w.w.toLowerCase()]=w;
  const batch=Date.now().toString(36),n=new Date(),when=(n.getMonth()+1)+"/"+n.getDate()+" "+p2(n.getHours())+":"+p2(n.getMinutes());
  const pd=(pagodaDay(todayStr())||{}).day||null;let added=0,skip=0,front=0,rel=0;
  for(const x of rows){const k=x.w.toLowerCase(),ex=idx[k];
    if(ex){
      if(full&&x.rel&&x.rel.length){const o=S.words[ex.id]||{};const der=x.rel.filter(q=>q.kind==="der"),syn=x.rel.filter(q=>q.kind==="syn");
        if(der.length)o.der=der.map(q=>({w:q.w,ko:q.ko}));if(syn.length)o.syn2=syn.map(q=>({w:q.w,ko:q.ko}));o.relBatch=batch;o.t=Date.now();S.words[ex.id]=o;rel+=x.rel.length}
      else if(ex.id[0]==="c"&&!S.srs[ex.id]&&!(S.words[ex.id]||{}).pq){const o=S.words[ex.id]||{};o.pq=Date.now();o.pday=pd;o.t=Date.now();S.words[ex.id]=o;front++}
      else skip++;
      continue}
    const id=addUserWord(x.w,x.ko,"pagoda",pd);S.words[id].batch=batch;
    if(full&&x.rel){const der=x.rel.filter(q=>q.kind==="der"),syn=x.rel.filter(q=>q.kind==="syn");if(der.length)S.words[id].der=der.map(q=>({w:q.w,ko:q.ko}));if(syn.length)S.words[id].syn2=syn.map(q=>({w:q.w,ko:q.ko}));rel+=x.rel.length}
    idx[k]={id};added++}
  S.cfg["b_"+batch]={v:{when,skip,front,rel},t:Date.now()};changed();
  toast(`사진에서 새 단어 ${added}개${front?" · 먼저 나오게 한 단어 "+front+"개":""}${rel?" · 유의어·파생어 "+rel+"개":""}${skip?" · 이미 있는 "+skip+"개 건너뜀":""}`,added||rel?()=>undoBatch(batch):null);
  if(view==="words")vWords();else if(view==="today")render();
};
function undoBatch(b){for(const [id,w] of Object.entries(S.words)){if(w.batch===b){w.del=true;w.t=Date.now()}if(w.relBatch===b){delete w.der;delete w.syn2;delete w.relBatch;w.t=Date.now()}}changed();toast("그 사진에서 추가한 단어를 지웠어요");if(view==="words")vWords()}

/* ---------- 공부법 ---------- */
function vMethod(){
  M.innerHTML=`<section class="card"><h2>목표: 330점</h2><p>영역별 목표 청해 ${TARGET.L} · 독해 ${TARGET.R} · 어휘 ${TARGET.V} · 문법 ${TARGET.G}. 문항으로는 청해 40개 중 28개, 독해 35개 중 23개, 어휘·문법은 각 30개 중 17~18개쯤이에요 (배점이 회차마다 달라 추정치).</p><p class="sub">청해·독해가 점수의 80% 이상이라 시간도 그만큼 써요.</p></section>
  <section class="card">
  <details open><summary>단어</summary><ul class="list-plain"><li>330은 빈출 500~1,000개면 충분. 어려운 단어 수천 개는 시간 낭비 [A][B]</li><li>사전 뜻보다 예문 속 뜻으로, 동의어·반의어와 같이 외우기. 정답 보기는 바꿔 말한 표현으로 나와요 [F]</li><li>시험은 예문 빈칸 채우기가 가장 좋음 [F]. 이 앱 시험에 빈칸·동의어 문제가 섞여 나와요</li><li>청해용 숙어·구동사는 발음을 들으며 외우기 [A][B]</li><li>잊는 건 정상. 반복할수록 외우는 시간이 줄어들어요 [D]</li></ul></details>
  <details><summary>문법 (해석용)</summary><ul class="list-plain"><li>문법 문제를 따로 파기보다 해석에 필요한 구문 위주 [A][B]. 매회 비중이 큰 동사·분사 먼저 [D]</li><li>해석용 7가지 [A]: 주어·동사 찾기 / -ing·p.p.·to부정사 수식어가 어디까지 무엇을 꾸미는지 / 동사 뒤 대상 2개 구조 / 「당하다」가 아닌 수동태 / 전치사의 특수한 뜻과 범위 / 절이 2개 넘는 문장(관계사) / 강조구문·가주어</li><li>가정법·도치·so~that 은 387 이상 목표에서 [A]</li></ul></details>
  <details><summary>청해</summary><ul class="list-plain"><li>파트 1~3에 집중, 파트 4·5는 반만 맞혀도 됨 [A][B][D]</li><li>10문항씩 풀고 확신 없는 문제 표시 → 다시 듣기 → 채점 → 오답 보기가 왜 틀렸는지 분석 [B]</li><li>안 들리면 느리게 듣고 점점 원래 속도로 [A]</li><li>들린 단어를 그대로 쓴 보기가 함정, 돌려 말한 답이 정답인 경우가 많음 [A]</li><li>파트 3는 짧게 받아 적기 [A]. 330에는 섀도잉·받아쓰기가 꼭 필요하지 않음 [A][D]</li></ul></details>
  <details><summary>독해</summary><ul class="list-plain"><li>푸는 순서 [A]: 1~6 → 9~21 → 23 → 26~끝. 시간이 남으면 긴 지문 남은 것 → 22 → 7·8 → 24·25</li><li>빈칸은 글 전체를 포괄하는 보기가 정답, 지문 일부 세부 내용은 함정 [A]</li><li>평균 문항당 80초 [B]. 문제마다 타이머로 몰아붙이는 연습은 이해력을 떨어뜨린다는 의견도 있음 [A]</li><li>리뷰 때 정답 근거 1~2문장과 연결어에 표시, 지문 구조(통념 → 반전 → 부연) 보기 [B]</li></ul></details>
  <details><summary>실전·리뷰</summary><ul class="list-plain"><li>모의고사 최소 4회, 쉬는 시간 없이 시험 시각(오후)에 [A][F]</li><li>채점하며 틀린 문제에 「왜 그 보기를 골랐는지」 바로 적기. 해설 없이 원인부터 [A][D]</li><li>틀린 문제뿐 아니라 맞힌 문제도 헤맨 곳을 복습 [D]</li><li>정기시험은 되도록 모두 응시, 당일 복원 정답으로 가채점 [A][C]</li><li>시험장: 어휘는 10분 안에, 독해는 한 문제 풀 때마다 답안지에 바로 표시 [D]</li></ul></details>
  </section>
  <section class="card"><h2>참고 영상</h2><ul class="list-plain">
  <li>[A] 컨설텝스 · 2주 만에 텝스 327점 받는법</li><li>[B] 텝스19 · 텝스 327점의 모든 것 (초보자용)</li><li>[C] 컨설텝스 · 텝스 독학 가이드 A-Z</li><li>[D] 시원스쿨랩 · 서울대생이 텝스 6번 만점 받은 공부법</li><li>[E] 컨설텝스 · 점수대별 공부법 (배점이 문항마다 다름)</li><li>[F] 컨설텝스 · 3주 만에 387점 (단어 시험 방식만 참고)</li></ul>
  <p class="sub">자동 자막을 읽고 정리해서 낱말이나 숫자가 조금 틀렸을 수 있어요. 영상끼리 의견이 다른 곳(독해 시간 재기, 문법 따로 공부)은 둘 다 적었어요.</p></section>`;
}

  h+=`<section class="card"><h2>시험 회차</h2><div class="sw"><span class="lab"><b>418회(3월 6일)도 보기</b><div class="hint">성적이 3월 12일에 나와서 3월 중순 마감에 맞아요. 끄면 달력에서 빠져요</div></span><input type="checkbox" class="toggle" id="x3" ${cfg("exam3")==="1"?"checked":""} aria-label="418회 보기"></div><p class="sub">1차 415회(1/30), 2차 417회(2/27)는 공식 일정으로 고정돼 있어요.</p></section>`;

  <label class="f" for="tok">GitHub 토큰 (Gist 권한만)</label><div class="row"><input type="password" id="tok" value="${esc(tok)}" placeholder="github_pat_..." autocomplete="off" class="grow"><button class="btn small" id="tokShow" aria-pressed="false">보기</button></div>
