,"weakness"],"ant":["strength"],"lv":1,"cat":"voc"},{"w":"flourish","pos":"v","ko":"번창하다, 잘 자라다","ex":"Small businesses tend to flourish in neighborhoods where rents are affordable and foot traffic is high.","ans":"flourish","exKo":"소규모 사업체는 임대료가 저렴하고 유동 인구가 많은 동네에서 번창하는 경향이 있다.","syn":["thrive","prosper","boom"],"ant":["decline","wither"],"lv":1,"cat":"voc"},{"w":"foster","pos":"v","ko":"육성하다, 조성하다, 위탁 양육하다","ex":"Teachers should foster a classroom environment where students feel comfortable asking questions.","ans":"foster","exKo":"교사는 학생들이 편하게 질문할 수 있는 교실 환경을 조성해야 한다.","syn":["encourage","promote","cultivate"],"ant":["discourage"],"lv":1,"cat":"voc"},{"w":"forfeit","pos":"v","ko":"몰수당하다, 박탈당하다","ex":"Passengers who cancel less than 24 hours before departure will forfeit their deposit.","ans":"forfeit","exKo":"출발 24시간 이내에 취소하는 승객은 보증금을 돌려받지 못한다.","syn":["lose","surrender","give up"],"ant":["retain"],"lv":3,"cat":"voc"},{"w":"formidable","pos":"adj","ko":"만만찮은, 가공할","ex":"The young startup now faces formidable competition from established technology giants in the global market.","ans":"formidable","exKo":"그 신생 기업은 이제 세계 시장에서 기존 거대 기술 기업들과의 만만찮은 경쟁에 직면해 있다.","syn":["daunting","intimidating","powerful"],"ant":["weak"],"lv":2,"cat":"voc"},{"w":"frantic","pos":"adj","ko":"정신없는, 미친 듯한","ex":"There was a frantic search for the missing documents just minutes before the board meeting began.","ans":"frantic","exKo":"이사회가 시작되기 몇 분 전에 사라진 서류를 찾느라 정신없는 수색이 벌어졌다.","syn":["frenzied","desperate","hectic"],"ant":["calm"],"lv":2,"cat":"voc"},{"w":"fraud","pos":"n","ko":"사기, 사기꾼","ex":"Bank customers are urged to report any suspicious transactions that may indicate credit card fraud.","ans":"fraud","exKo":"은행 고객은 신용카드 사기일 수 있는 의심스러운 거래를 신고하도록 권고받는다.","syn":["deception","scam","swindle"],"ant":["honesty"],"lv":1,"cat":"voc"},{"w":"friction","pos":"n","ko":"마찰, 불화","ex":"Disagreements over the budget have caused friction between the marketing and finance teams.","ans":"friction","exKo":"예산을 둘러싼 의견 차이로 마케팅팀과 재무팀 사이에 마찰이 생겼다.","syn":["conflict","tension","discord"],"ant":["harmony"],"lv":2,"cat":"voc"},{"w":"futile","pos":"adj","ko":"헛된, 소용없는","ex":"Further negotiations seemed futile, so the union decided to go on strike the following week.","ans":"futile","exKo":"더 이상의 협상은 소용없어 보였기 때문에 노조는 다음 주에 파업에 들어가기로 했다.","syn":["useless","pointless","vain"],"ant":["fruitful","effective"],"lv":2,"cat":"voc"},{"w":"fiscal","pos":"adj","ko":"재정의, 회계의","ex":"The company reported record profits for the fiscal year ending in March, surprising many analysts.","ans":"fiscal","exKo":"그 회사는 3월에 끝나는 회계 연도에 사상 최대 이익을 기록해 많은 분석가를 놀라게 했다.","syn":["financial","budgetary"],"ant":[],"lv":2,"cat":"voc"},{"w":"figure out","pos":"phr","ko":"알아내다, 이해하다","ex":"It took the technician nearly an hour to figure out why the printer kept jamming.","ans":"figure out","exKo":"기술자가 프린터에 왜 계속 종이가 걸리는지 알아내는 데 거의 한 시간이 걸렸다.","syn":["work out","understand","solve"],"ant":[],"lv":1,"cat":"voc"},{"w":"fill in for","pos":"phr","ko":"~을 대신하다","ex":"Could you fill in for me at the client meeting tomorrow while I am on a business trip?","ans":"fill in for","exKo":"내가 내일 출장 가 있는 동안 고객 회의에 나 대신 들어가 줄 수 있어?","syn":["substitute for","cover for","stand in for"],"ant":[],"lv":2,"cat":"voc"},{"w":"flexible","pos":"adj","ko":"유연한, 융통성 있는","ex":"Many employees prefer companies that offer flexible working hours and the option to work remotely.","ans":"flexible","exKo":"많은 직원들이 유연한 근무 시간과 재택근무 선택권을 제공하는 회사를 선호한다.","syn":["adaptable","adjustable"],"ant":["rigid"],"lv":1,"cat":"voc"},{"w":"forecast","pos":"n","ko":"예보, 예측","ex":"According to the latest weather forecast, heavy rain is expected throughout the weekend in the southern region.","ans":"forecast","exKo":"최신 일기 예보에 따르면 남부 지방에 주말 내내 많은 비가 예상된다.","syn":["prediction","projection","outlook"],"ant":[],"lv":1,"cat":"voc"},{"w":"fortify","pos":"v","ko":"강화하다, 요새화하다","ex":"The city plans to fortify its sea walls to protect coastal homes from rising water levels.","ans":"fortify","exKo":"시는 해수면 상승으로부터 해안 주택을 보호하기 위해 방파제를 보강할 계획이다.","syn":["strengthen","reinforce"],"ant":["weaken"],"lv":3,"cat":"voc"},{"w":"gauge","pos":"v","ko":"측정하다, 판단하다","ex":"The survey was conducted to gauge public reaction to the proposed tax increase.","ans":"gauge","exKo":"그 설문 조사는 제안된 세금 인상에 대한 대중의 반응을 가늠하기 위해 실시되었다.","syn":["measure","assess","evaluate"],"ant":[],"lv":2,"cat":"voc"},{"w":"generate","pos":"v","ko":"발생시키다, 만들어 내다","ex":"Solar panels on the roof generate enough electricity to power the entire office building.","ans":"generate","exKo":"지붕의 태양광 패널은 사무실 건물 전체에 전력을 공급할 만큼의 전기를 생산한다.","syn":["produce","create","yield"],"ant":[],"lv":1,"cat":"voc"},{"w":"genuine","pos":"adj","ko":"진짜의, 진심의","ex":"Experts confirmed that the painting was a genuine work by the famous nineteenth-century artist.","ans":"genuine","exKo":"전문가들은 그 그림이 유명한 19세기 화가의 진품이라고 확인했다.","syn":["authentic","real","sincere"],"ant":["fake","counterfeit"],"lv":1,"cat":"voc"},{"w":"gradual","pos":"adj","ko":"점진적인, 서서히 일어나는","ex":"Doctors recommend a gradual increase in exercise rather than a sudden change in daily routine.","ans":"gradual","exKo":"의사들은 일상의 갑작스러운 변화보다 운동량을 점진적으로 늘리는 것을 권한다.","syn":["steady","progressive","step-by-step"],"ant":["sudden","abrupt"],"lv":1,"cat":"voc"},{"w":"grant","pos":"v","ko":"승인하다, 허락하다, 주다","ex":"The university granted her permission to postpone her final exam due to a family emergency.","ans":"granted","exKo":"대학은 집안의 급한 일 때문에 그녀가 기말고사를 연기하도록 허락했다.","syn":["allow","award","give"],"ant":["deny","refuse"],"lv":1,"cat":"voc"},{"w":"grievance","pos":"n","ko":"불만, 고충","ex":"Employees can submit a formal grievance to the human resources department if they feel treated unfairly.","ans":"grievance","exKo":"직원들은 부당한 대우를 받는다고 느끼면 인사부에 정식 고충을 제기할 수 있다.","syn":["complaint","objection"],"ant":[],"lv":3,"cat":"voc"},{"w":"gullible","pos":"adj","ko":"잘 속는","ex":"Scammers often target gullible investors with promises of quick and guaranteed returns.","ans":"gullible","exKo":"사기꾼들은 빠르고 확실한 수익을 약속하며 잘 속는 투자자들을 노린다.","syn":["naive","credulous"],"ant":["skeptical"],"lv":3,"cat":"voc"},{"w":"give in","pos":"phr","ko":"굴복하다, 양보하다","ex":"After weeks of protests, the management finally gave in to the workers' demands for higher wages.","ans":"gave in","exKo":"몇 주간의 항의 끝에 경영진은 결국 임금 인상을 요구하는 노동자들에게 굴복했다.","syn":["yield","surrender","give way"],"ant":["resist"],"lv":2,"cat":"voc"},{"w":"get by","pos":"phr","ko":"그럭저럭 살아가다","ex":"Many students struggle to get by on part-time jobs while paying high tuition fees.","ans":"get by","exKo":"많은 학생들이 비싼 등록금을 내면서 아르바이트로 겨우 생활을 꾸려 간다.","syn":["manage","make ends meet","survive"],"ant":[],"lv":2,"cat":"voc"},{"w":"go over","pos":"phr","ko":"검토하다, 살펴보다","ex":"Let's go over the presentation slides once more before we meet the clients this afternoon.","ans":"go over","exKo":"오늘 오후 고객을 만나기 전에 발표 슬라이드를 한 번 더 검토합시다.","syn":["review","examine","check"],"ant":[],"lv":1,"cat":"voc"},{"w":"glimpse","pos":"n","ko":"언뜻 봄, 일별","ex":"Visitors to the history museum can catch a glimpse of daily life in ancient Rome.","ans":"glimpse","exKo":"역사 박물관 방문객들은 고대 로마의 일상생활을 엿볼 수 있다.","syn":["glance","peek","look"],"ant":[],"lv":2,"cat":"voc"},{"w":"grasp","pos":"v","ko":"파악하다, 이해하다, 움켜잡다","ex":"It took the new interns several weeks to fully grasp how the accounting system worked.","ans":"grasp","exKo":"신입 인턴들이 회계 시스템이 어떻게 돌아가는지 완전히 파악하는 데 몇 주가 걸렸다.","syn":["understand","comprehend","grip"],"ant":["misunderstand"],"lv":1,"cat":"voc"},{"w":"gratitude","pos":"n","ko":"감사, 고마움","ex":"The mayor expressed his gratitude to the volunteers who helped clean up after the flood.","ans":"gratitude","exKo":"시장은 홍수 후 복구를 도운 자원봉사자들에게 감사를 표했다.","syn":["thanks","appreciation"],"ant":["ingratitude"],"lv":2,"cat":"voc"},{"w":"gregarious","pos":"adj","ko":"사교적인, 군집하는","ex":"Being naturally gregarious, he quickly made friends with everyone in his new department.","ans":"gregarious","exKo":"원래 사교적인 성격이라 그는 새 부서의 모든 사람과 금세 친해졌다.","syn":["sociable","outgoing"],"ant":["introverted","reserved"],"lv":3,"cat":"voc"},{"w":"guarantee","pos":"v","ko":"보장하다, 보증하다","ex":"The manufacturer guarantees a full refund if customers are not satisfied within thirty days.","ans":"guarantees","exKo":"제조사는 고객이 30일 안에 만족하지 않으면 전액 환불을 보장한다.","syn":["ensure","assure","promise"],"ant":[],"lv":1,"cat":"voc"},{"w":"gloomy","pos":"adj","ko":"우울한, 비관적인, 어두운","ex":"Analysts offered a gloomy outlook for the housing market, predicting further declines in prices.","ans":"gloomy","exKo":"분석가들은 주택 시장에 대해 가격이 더 떨어질 것으로 예측하며 비관적인 전망을 내놓았다.","syn":["pessimistic","bleak","dismal"],"ant":["optimistic","bright"],"lv":2,"cat":"voc"},{"w":"halt","pos":"v","ko":"중단시키다, 멈추다","ex":"Production at the factory was temporarily halted after a fire broke out in the warehouse.","ans":"halted","exKo":"창고에서 화재가 발생한 뒤 공장 생산이 일시 중단되었다.","syn":["stop","suspend","cease"],"ant":["resume","continue"],"lv":1,"cat":"voc"},{"w":"hamper","pos":"v","ko":"방해하다, 지장을 주다","ex":"Rescue efforts were hampered by strong winds and heavy snowfall in the mountain area.","ans":"hampered","exKo":"산간 지역의 강풍과 폭설로 구조 작업에 지장이 생겼다.","syn":["hinder","obstruct","impede"],"ant":["facilitate"],"lv":2,"cat":"voc"},{"w":"hazardous","pos":"adj","ko":"위험한, 유해한","ex":"Workers must wear protective gear when handling hazardous chemicals in the laboratory.","ans":"hazardous","exKo":"작업자는 실험실에서 유해 화학 물질을 다룰 때 보호 장비를 착용해야 한다.","syn":["dangerous","harmful","risky"],"ant":["safe"],"lv":1,"cat":"voc"},{"w":"hesitant","pos":"adj","ko":"주저하는, 망설이는","ex":"Many consumers are hesitant to share personal information with online retailers they do not know.","ans":"hesitant","exKo":"많은 소비자가 잘 모르는 온라인 판매업체에 개인 정보를 제공하기를 망설인다.","syn":["reluctant","unwilling","uncertain"],"ant":["eager","willing"],"lv":1,"cat":"voc"},{"w":"hinder","pos":"v","ko":"방해하다, 저해하다","ex":"A lack of reliable internet access continues to hinder economic growth in rural regions.","ans":"hinder","exKo":"안정적인 인터넷 접속 환경이 없어 농촌 지역의 경제 성장이 계속 저해되고 있다.","syn":["impede","obstruct","hamper"],"ant":["help","promote"],"lv":2,"cat":"voc"},{"w":"hostile","pos":"adj","ko":"적대적인","ex":"The board rejected the hostile takeover bid from a rival firm based in Singapore.","ans":"hostile","exKo":"이사회는 싱가포르에 본사를 둔 경쟁사의 적대적 인수 제안을 거부했다.","syn":["antagonistic","unfriendly","aggressive"],"ant":["friendly"],"lv":2,"cat":"voc"},{"w":"humble","pos":"adj","ko":"겸손한, 소박한","ex":"Despite winning the national award, the chef remained humble and thanked his kitchen staff.","ans":"humble","exKo":"전국 규모의 상을 받았음에도 그 요리사는 겸손함을 잃지 않고 주방 직원들에게 감사를 전했다.","syn":["modest","unassuming"],"ant":["arrogant","proud"],"lv":1,"cat":"voc"},{"w":"hypothesis","pos":"n","ko":"가설","ex":"Scientists designed a series of experiments to test the hypothesis that sleep improves memory.","ans":"hypothesis","exKo":"과학자들은 수면이 기억력을 향상시킨다는 가설을 검증하기 위해 일련의 실험을 설계했다.","syn":["theory","assumption","premise"],"ant":[],"lv":2,"cat":"voc"},{"w":"hand out","pos":"phr","ko":"나눠 주다, 배포하다","ex":"Volunteers will hand out free bottles of water to runners along the marathon route.","ans":"hand out","exKo":"자원봉사자들이 마라톤 코스를 따라 달리는 사람들에게 무료 생수를 나눠 줄 것이다.","syn":["distribute","give out","pass out"],"ant":["collect"],"lv":1,"cat":"voc"},{"w":"hold off","pos":"phr","ko":"미루다, 보류하다","ex":"We decided to hold off on buying a new car until prices come down next year.","ans":"hold off","exKo":"우리는 내년에 가격이 내려갈 때까지 새 차 구입을 미루기로 했다.","syn":["postpone","delay","put off"],"ant":[],"lv":2,"cat":"voc"},{"w":"hectic","pos":"adj","ko":"매우 바쁜, 정신없는","ex":"It was a hectic week at the office because of the year-end audit and several deadlines.","ans":"hectic","exKo":"연말 감사와 여러 마감 때문에 사무실은 정신없이 바쁜 한 주를 보냈다.","syn":["busy","frantic","chaotic"],"ant":["calm","leisurely"],"lv":1,"cat":"voc"},{"w":"heritage","pos":"n","ko":"유산, 전통","ex":"The old palace has been designated a world heritage site by UNESCO for its unique architecture.","ans":"heritage","exKo":"그 옛 궁궐은 독특한 건축 양식으로 유네스코 세계 유산으로 지정되었다.","syn":["legacy","tradition","inheritance"],"ant":[],"lv":2,"cat":"voc"},{"w":"hasty","pos":"adj","ko":"성급한, 서두른","ex":"The manager warned against making a hasty decision without consulting the legal team first.","ans":"hasty","exKo":"관리자는 법무팀과 먼저 상의하지 않고 성급한 결정을 내리지 말라고 경고했다.","syn":["hurried","rash","impulsive"],"ant":["careful","deliberate"],"lv":2,"cat":"voc"},{"w":"harsh","pos":"adj","ko":"가혹한, 혹독한, 거친","ex":"The plants could not survive the harsh winter conditions in the northern part of the country.","ans":"harsh","exKo":"그 식물들은 그 나라 북부의 혹독한 겨울 환경에서 살아남지 못했다.","syn":["severe","brutal","rough"],"ant":["mild","gentle"],"lv":1,"cat":"voc"},{"w":"hinge on","pos":"phr","ko":"~에 달려 있다","ex":"The success of the project will hinge on whether we can secure additional funding next month.","ans":"hinge on","exKo":"그 사업의 성공은 다음 달에 추가 자금을 확보할 수 있느냐에 달려 있다.","syn":["depend on","rest on","hang on"],"ant":[],"lv":3,"cat":"voc"},{"w":"hoard","pos":"v","ko":"비축하다, 사재기하다","ex":"Fearing a shortage, some shoppers began to hoard rice and canned goods at local supermarkets.","ans":"hoard","exKo":"물자 부족을 우려해 일부 소비자들이 동네 슈퍼마켓에서 쌀과 통조림을 사재기하기 시작했다.","syn":["stockpile","store up","amass"],"ant":["squander"],"lv":3,"cat":"voc"},{"w":"identical","pos":"adj","ko":"동일한, 똑같은","ex":"The twins look identical, but their personalities and interests are completely different from each other.","ans":"identical","exKo":"그 쌍둥이는 똑같이 생겼지만 성격과 관심사는 서로 완전히 다르다.","syn":["the same","indistinguishable","alike"],"ant":["different"],"lv":1,"cat":"voc"},{"w":"illegible","pos":"adj","ko":"읽기 어려운, 판독 불가능한","ex":"The pharmacist could not fill the prescription because the doctor's handwriting was illegible.","ans":"illegible","exKo":"의사의 글씨를 알아볼 수 없어서 약사는 처방전대로 조제할 수 없었다.","syn":["unreadable","indecipherable"],"ant":["legible","readable"],"lv":3,"cat":"voc"},{"w":"illuminate","pos":"v","ko":"밝히다, 해명하다, 비추다","ex":"The study helps illuminate how social media affects the mental health of teenagers.","ans":"illuminate","exKo":"그 연구는 소셜 미디어가 십 대의 정신 건강에 어떻게 영향을 미치는지 밝히는 데 도움이 된다.","syn":["clarify","explain","light up"],"ant":["obscure"],"lv":3,"cat":"voc"},{"w":"immense","pos":"adj","ko":"막대한, 거대한","ex":"The new highway project will require an immense amount of money and labor over the next decade.","ans":"immense","exKo":"새 고속도로 사업에는 향후 10년간 막대한 돈과 노동력이 필요할 것이다.","syn":["huge","enormous","vast"],"ant":["tiny"],"lv":1,"cat":"voc"},{"w":"imminent","pos":"adj","ko":"임박한, 곧 닥칠","ex":"Residents were evacuated because meteorologists warned that a major storm was imminent.","ans":"imminent","exKo":"기상학자들이 큰 폭풍이 임박했다고 경고해 주민들이 대피했다.","syn":["impending","approaching","forthcoming"],"ant":["distant"],"lv":2,"cat":"voc"},{"w":"impair","pos":"v","ko":"손상시키다, 약화시키다","ex":"Drinking even small amounts of alcohol can seriously impair your ability to drive safely at night.","ans":"impair","exKo":"적은 양의 술이라도 야간에 안전하게 운전하는 능력을 크게 떨어뜨릴 수 있다.","syn":["damage","weaken","harm"],"ant":["improve","enhance"],"lv":2,"cat":"voc"},{"w":"impartial","pos":"adj","ko":"공정한, 편견 없는","ex":"Judges are expected to remain impartial and base their rulings solely on the evidence presented.","ans":"impartial","exKo":"판사는 공정함을 유지하고 제출된 증거만을 근거로 판결을 내려야 한다.","syn":["unbiased","neutral","fair"],"ant":["biased","partial"],"lv":2,"cat":"voc"},{"w":"impede","pos":"v","ko":"방해하다, 지연시키다","ex":"Some economists warn that excessive regulations may impede innovation in the technology sector.","ans":"impede","exKo":"일부 경제학자들은 과도한 규제가 기술 분야의 혁신을 방해할 수 있다고 경고한다.","syn":["hinder","obstruct","hamper"],"ant":["facilitate"],"lv":3,"cat":"voc"},{"w":"implement","pos":"v","ko":"시행하다, 실행하다","ex":"The city government plans to implement a new recycling program starting next January.","ans":"implement","exKo":"시 정부는 내년 1월부터 새 재활용 제도를 시행할 계획이다.","syn":["carry out","execute","put into effect"],"ant":["abandon"],"lv":1,"cat":"voc"},{"w":"implication","pos":"n","ko":"영향, 함의, 암시","ex":"Economists are still debating the long-term implications of the new trade agreement.","ans":"implications","exKo":"경제학자들은 새 무역 협정의 장기적 영향에 대해 여전히 논쟁 중이다.","syn":["consequence","effect","suggestion"],"ant":[],"lv":2,"cat":"voc"},{"w":"imply","pos":"v","ko":"암시하다, 내포하다","ex":"Her silence during the meeting seemed to imply that she did not agree with the proposal.","ans":"imply","exKo":"회의 중 그녀의 침묵은 그 제안에 동의하지 않는다는 것을 암시하는 듯했다.","syn":["suggest","indicate","hint"],"ant":["state"],"lv":1,"cat":"voc"},{"w":"impose","pos":"v","ko":"부과하다, 강요하다","ex":"The government decided to impose a heavy tax on sugary drinks to reduce obesity.","ans":"impose","exKo":"정부는 비만을 줄이기 위해 설탕이 든 음료에 무거운 세금을 부과하기로 했다.","syn":["levy","enforce","inflict"],"ant":["lift","remove"],"lv":1,"cat":"voc"},{"w":"impulsive","pos":"adj","ko":"충동적인","ex":"Online advertisements are often designed to encourage impulsive purchases late at night.","ans":"impulsive","exKo":"온라인 광고는 흔히 늦은 밤 충동구매를 부추기도록 만들어진다.","syn":["rash","spontaneous","hasty"],"ant":["cautious","deliberate"],"lv":2,"cat":"voc"},{"w":"inadvertently","pos":"adv","ko":"무심코, 실수로","ex":"The assistant inadvertently sent the confidential report to the wrong email address yesterday.","ans":"inadvertently","exKo":"비서가 어제 실수로 기밀 보고서를 잘못된 이메일 주소로 보냈다.","syn":["accidentally","unintentionally"],"ant":["deliberately","intentionally"],"lv":3,"cat":"voc"},{"w":"incentive","pos":"n","ko":"장려책, 유인, 성과급","ex":"The company offers financial incentives to employees who use public transportation to commute.","ans":"incentives","exKo":"그 회사는 대중교통으로 출퇴근하는 직원들에게 금전적 혜택을 제공한다.","syn":["inducement","motivation","bonus"],"ant":["deterrent"],"lv":1,"cat":"voc"},{"w":"incidental","pos":"adj","ko":"부수적인, 부차적인","ex":"The travel allowance covers meals, lodging, and other incidental expenses during business trips.","ans":"incidental","exKo":"출장비에는 출장 중 식비, 숙박비 및 기타 부대 비용이 포함된다.","syn":["minor","secondary","accompanying"],"ant":["essential"],"lv":3,"cat":"voc"},{"w":"inclined","pos":"adj","ko":"~하는 경향이 있는, ~하고 싶은","ex":"People are more inclined to buy products recommended by friends than those promoted by celebrities.","ans":"inclined","exKo":"사람들은 유명인이 홍보하는 제품보다 친구가 추천한 제품을 사는 경향이 더 크다.","syn":["likely","disposed","prone"],"ant":["reluctant"],"lv":2,"cat":"voc"},{"w":"incompatible","pos":"adj","ko":"호환되지 않는, 양립할 수 없는","ex":"Unfortunately, the old printer is incompatible with the latest version of the operating system.","ans":"incompatible","exKo":"안타깝게도 그 오래된 프린터는 최신 운영 체제와 호환되지 않는다.","syn":["inconsistent","mismatched","conflicting"],"ant":["compatible"],"lv":2,"cat":"voc"},{"w":"incorporate","pos":"v","ko":"포함하다, 통합하다","ex":"The architect incorporated several energy-saving features into the design of the new library.","ans":"incorporated","exKo":"건축가는 새 도서관 설계에 여러 에너지 절약 요소를 포함시켰다.","syn":["include","integrate","combine"],"ant":["exclude"],"lv":1,"cat":"voc"},{"w":"indispensable","pos":"adj","ko":"필수적인, 없어서는 안 될","ex":"Smartphones have become an indispensable tool for both work and daily life in modern society.","ans":"indispensable","exKo":"현대 사회에서 스마트폰은 업무와 일상생활 모두에 없어서는 안 될 도구가 되었다.","syn":["essential","vital","necessary"],"ant":["unnecessary","dispensable"],"lv":1,"cat":"voc"},{"w":"induce","pos":"v","ko":"유도하다, 유발하다, 설득하다","ex":"The medication may induce drowsiness, so patients should avoid driving or operating machinery.","ans":"induce","exKo":"이 약은 졸음을 유발할 수 있으므로 환자는 운전이나 기계 조작을 피해야 한다.","syn":["cause","bring about","persuade"],"ant":["prevent"],"lv":2,"cat":"voc"},{"w":"inevitable","pos":"adj","ko":"불가피한, 피할 수 없는","ex":"Some job losses are inevitable as factories become increasingly automated in the coming years.","ans":"inevitable","exKo":"앞으로 공장 자동화가 진행됨에 따라 일부 일자리 감소는 불가피하다.","syn":["unavoidable","certain","inescapable"],"ant":["avoidable"],"lv":1,"cat":"voc"},{"w":"infer","pos":"v","ko":"추론하다, 추측하다","ex":"From the speaker's tone, we can infer that she was disappointed with the survey results.","ans":"infer","exKo":"화자의 어조로 보아 그녀가 설문 결과에 실망했다는 것을 추론할 수 있다.","syn":["deduce","conclude","gather"],"ant":[],"lv":1,"cat":"voc"},{"w":"inflation","pos":"n","ko":"물가 상승, 인플레이션","ex":"The central bank raised interest rates again in an effort to control rising inflation.","ans":"inflation","exKo":"중앙은행은 치솟는 물가 상승을 억제하기 위해 다시 금리를 올렸다.","syn":["price increase","rising prices"],"ant":["deflation"],"lv":1,"cat":"voc"},{"w":"influx","pos":"n","ko":"유입, 쇄도","ex":"The small coastal city has struggled to accommodate the sudden influx of tourists during the summer.","ans":"influx","exKo":"그 작은 해안 도시는 여름철 갑작스럽게 몰려드는 관광객을 수용하느라 애를 먹었다.","syn":["inflow","flood","rush"],"ant":["exodus","outflow"],"lv":2,"cat":"voc"},{"w":"ingredient","pos":"n","ko":"재료, 구성 요소","ex":"Fresh local ingredients are the key to the restaurant's popular seasonal menu.","ans":"ingredients","exKo":"신선한 지역 재료가 그 식당의 인기 있는 계절 메뉴의 비결이다.","syn":["component","element","constituent"],"ant":[],"lv":1,"cat":"voc"},{"w":"inherent","pos":"adj","ko":"고유한, 내재된","ex":"There are risks inherent in any investment, no matter how carefully it is planned.","ans":"inherent","exKo":"아무리 신중하게 계획해도 모든 투자에는 내재된 위험이 있다.","syn":["intrinsic","built-in","innate"],"ant":["external"],"lv":2,"cat":"voc"},{"w":"inhibit","pos":"v","ko":"억제하다, 저해하다","ex":"Certain chemicals left in the soil can inhibit the growth of crops for several years.","ans":"inhibit","exKo":"토양에 남은 특정 화학 물질은 수년간 작물의 성장을 억제할 수 있다.","syn":["restrain","suppress","hinder"],"ant":["encourage","promote"],"lv":3,"cat":"voc"},{"w":"initiative","pos":"n","ko":"계획, 진취성, 주도권","ex":"The mayor launched a new initiative to provide free meals to elderly residents living alone.","ans":"initiative","exKo":"시장은 홀로 사는 노인 주민들에게 무료 식사를 제공하는 새 사업을 시작했다.","syn":["plan","program","scheme"],"ant":[],"lv":1,"cat":"voc"},{"w":"innovative","pos":"adj","ko":"혁신적인","ex":"The firm is widely known for its innovative approach to designing affordable housing.","ans":"innovative","exKo":"그 회사는 저렴한 주택을 설계하는 혁신적인 방식으로 널리 알려져 있다.","syn":["inventive","creative","groundbreaking"],"ant":["conventional","traditional"],"lv":1,"cat":"voc"},{"w":"inquiry","pos":"n","ko":"문의, 질문, 조사","ex":"For further inquiries, please contact our customer service center between 9 a.m. and 6 p.m.","ans":"inquiries","exKo":"추가 문의는 오전 9시에서 오후 6시 사이에 고객 센터로 연락해 주십시오.","syn":["question","query","investigation"],"ant":[],"lv":1,"cat":"voc"},{"w":"insight","pos":"n","ko":"통찰, 이해","ex":"The documentary offers valuable insight into the lives of refugees living in temporary camps.","ans":"insight","exKo":"그 다큐멘터리는 임시 수용소에 사는 난민들의 삶에 대한 귀중한 통찰을 제공한다.","syn":["understanding","perception","awareness"],"ant":[],"lv":2,"cat":"voc"},{"w":"insist","pos":"v","ko":"주장하다, 고집하다","ex":"The customer insisted on speaking directly to the store manager about the defective product.","ans":"insisted","exKo":"그 고객은 불량품에 대해 매장 관리자와 직접 이야기하겠다고 고집했다.","syn":["demand","maintain","assert"],"ant":["give up"],"lv":1,"cat":"voc"},{"w":"installment","pos":"n","ko":"할부금, 1회분, 연재물","ex":"You can pay for the laptop in twelve monthly installments without any additional interest.","ans":"installments","exKo":"그 노트북은 추가 이자 없이 12개월 할부로 결제할 수 있다.","syn":["payment","portion","episode"],"ant":["lump sum"],"lv":2,"cat":"voc"},{"w":"integral","pos":"adj","ko":"필수적인, 없어서는 안 될","ex":"Regular feedback from managers is an integral part of the employee development process.","ans":"integral","exKo":"관리자의 정기적인 피드백은 직원 역량 개발 과정의 필수 요소이다.","syn":["essential","fundamental","indispensable"],"ant":["peripheral"],"lv":3,"cat":"voc"},{"w":"integrity","pos":"n","ko":"정직, 진실성, 온전함","ex":"Voters want leaders who demonstrate honesty and integrity while serving in public office.","ans":"integrity","exKo":"유권자들은 공직에 있는 동안 정직함과 청렴함을 보여 주는 지도자를 원한다.","syn":["honesty","principle","uprightness"],"ant":["dishonesty","corruption"],"lv":2,"cat":"voc"},{"w":"intensive","pos":"adj","ko":"집중적인, 집약적인","ex":"The company provides an intensive two-week training course for all new sales staff.","ans":"intensive","exKo":"그 회사는 모든 신입 영업 직원에게 2주간의 집중 교육 과정을 제공한다.","syn":["concentrated","thorough","rigorous"],"ant":["superficial"],"lv":2,"cat":"voc"},{"w":"intervene","pos":"v","ko":"개입하다, 중재하다","ex":"The government was forced to intervene in the market to stabilize the falling currency.","ans":"intervene","exKo":"정부는 하락하는 통화 가치를 안정시키기 위해 시장에 개입할 수밖에 없었다.","syn":["step in","interfere","mediate"],"ant":[],"lv":2,"cat":"voc"},{"w":"intricate","pos":"adj","ko":"복잡한, 정교한","ex":"The antique watch is admired for its intricate design and precise mechanical parts.","ans":"intricate","exKo":"그 골동품 시계는 정교한 디자인과 정밀한 기계 부품으로 찬사를 받는다.","syn":["complex","elaborate","complicated"],"ant":["simple"],"lv":3,"cat":"voc"},{"w":"intrinsic","pos":"adj","ko":"본질적인, 내재적인","ex":"Psychologists argue that intrinsic motivation leads to better learning than external rewards do.","ans":"intrinsic","exKo":"심리학자들은 내적 동기가 외적 보상보다 학습에 더 좋은 결과를 가져온다고 주장한다.","syn":["inherent","innate","fundamental"],"ant":["extrinsic"],"lv":3,"cat":"voc"},{"w":"invaluable","pos":"adj","ko":"매우 귀중한","ex":"Your advice was invaluable in helping me prepare for the job interview last week.","ans":"invaluable","exKo":"지난주 면접을 준비하는 데 당신의 조언이 정말 큰 도움이 되었다.","syn":["priceless","precious","extremely useful"],"ant":["worthless"],"lv":2,"cat":"voc"},{"w":"irrelevant","pos":"adj","ko":"무관한, 상관없는","ex":"The lawyer objected that the witness's comments were completely irrelevant to the case.","ans":"irrelevant","exKo":"변호사는 증인의 발언이 사건과 전혀 관련이 없다며 이의를 제기했다.","syn":["unrelated","beside the point"],"ant":["relevant","pertinent"],"lv":1,"cat":"voc"},{"w":"irritate","pos":"v","ko":"짜증 나게 하다, 자극하다","ex":"The constant noise from the construction site began to irritate residents of the nearby apartments.","ans":"irritate","exKo":"공사장에서 계속 나는 소음이 인근 아파트 주민들을 짜증 나게 하기 시작했다.","syn":["annoy","bother","aggravate"],"ant":["soothe"],"lv":2,"cat":"voc"},{"w":"itinerary","pos":"n","ko":"여행 일정표","ex":"The travel agency will email your detailed itinerary, including flight times and hotel addresses.","ans":"itinerary","exKo":"여행사가 비행 시간과 호텔 주소가 포함된 상세 일정표를 이메일로 보내 줄 것이다.","syn":["schedule","travel plan","route"],"ant":[],"lv":1,"cat":"voc"},{"w":"isolated","pos":"adj","ko":"고립된, 외딴","ex":"Volunteers regularly deliver medical supplies to isolated villages high in the mountains.","ans":"isolated","exKo":"자원봉사자들은 높은 산속의 외딴 마을에 정기적으로 의약품을 전달한다.","syn":["remote","secluded","cut off"],"ant":["accessible"],"lv":2,"cat":"voc"},{"w":"immune","pos":"adj","ko":"면역된, 영향받지 않는","ex":"No country is completely immune to the effects of a global economic slowdown.","ans":"immune","exKo":"어떤 나라도 세계 경기 둔화의 영향에서 완전히 자유로울 수는 없다.","syn":["resistant","unaffected","exempt"],"ant":["vulnerable","susceptible"],"lv":2,"cat":"voc"},{"w":"insolvent","pos":"adj","ko":"지급 불능의, 파산한","ex":"The budget airline was declared insolvent after failing to repay its debts to several banks.","ans":"insolvent","exKo":"그 저가 항공사는 여러 은행에 진 빚을 갚지 못해 지급 불능 판정을 받았다.","syn":["bankrupt","broke"],"ant":["solvent"],"lv":3,"cat":"voc"},{"w":"interim","pos":"adj","ko":"임시의, 중간의","ex":"An interim director will lead the organization until a permanent replacement is found.","ans":"interim","exKo":"정식 후임자를 찾을 때까지 임시 이사가 조직을 이끌 것이다.","syn":["temporary","provisional","acting"],"ant":["permanent"],"lv":3,"cat":"voc"},{"w":"jeopardize","pos":"v","ko":"위태롭게 하다","ex":"Missing another deadline could seriously jeopardize our contract with the overseas client next year.","ans":"jeopardize","exKo":"마감을 또 놓치면 내년 해외 고객과의 계약이 심각하게 위태로워질 수 있다.","syn":["endanger","threaten","risk"],"ant":["protect","safeguard"],"lv":2,"cat":"voc"},{"w":"justify","pos":"v","ko":"정당화하다, 해명하다","ex":"The manager had to justify the high cost of the new equipment to the board of directors.","ans":"justify","exKo":"관리자는 이사회에 새 장비의 높은 비용을 정당화해야 했다.","syn":["defend","explain","warrant"],"ant":[],"lv":1,"cat":"voc"},{"w":"jot down","pos":"phr","ko":"적어 두다, 메모하다","ex":"Let me jot down your phone number so I can call you when the parts arrive.","ans":"jot down","exKo":"부품이 도착하면 연락드릴 수 있게 전화번호를 적어 둘게요.","syn":["note down","write down","record"],"ant":[],"lv":2,"cat":"voc"},{"w":"judicious","pos":"adj","ko":"현명한, 신중한","ex":"The judicious use of antibiotics is essential to prevent the spread of drug-resistant bacteria.","ans":"judicious","exKo":"약물 내성균의 확산을 막으려면 항생제를 신중하게 사용하는 것이 필수적이다.","syn":["wise","prudent","sensible"],"ant":["reckless","unwise"],"lv":3,"cat":"voc"},{"w":"jargon","pos":"n","ko":"전문 용어, 특수 용어","ex":"The doctor explained the diagnosis clearly, avoiding medical jargon that patients might not understand.","ans":"jargon","exKo":"의사는 환자가 이해하지 못할 수 있는 의학 전문 용어를 피하며 진단을 명확히 설명했다.","syn":["terminology","technical language"],"ant":["plain language"],"lv":2,"cat":"voc"},{"w":"joint","pos":"adj","ko":"공동의, 합동의","ex":"The two companies announced a joint venture to develop batteries for electric vehicles.","ans":"joint","exKo":"두 회사는 전기차용 배터리를 개발하기 위한 합작 투자를 발표했다.","syn":["shared","collective","combined"],"ant":["individual","separate"],"lv":1,"cat":"voc"},{"w":"keen","pos":"adj","ko":"열망하는, 예리한, 열정적인","ex":"She is keen to gain international experience and has applied for a position in London.","ans":"keen","exKo":"그녀는 해외 경험을 쌓기를 열망해 런던의 한 일자리에 지원했다.","syn":["eager","enthusiastic","sharp"],"ant":["reluctant","indifferent"],"lv":1,"cat":"voc"},{"w":"keep up with","pos":"phr","ko":"~에 뒤처지지 않다, 따라가다","ex":"It is hard for small retailers to keep up with rapid changes in consumer trends.","ans":"keep up with","exKo":"소규모 소매업체가 소비자 유행의 빠른 변화를 따라가기는 어렵다.","syn":["keep pace with","stay abreast of"],"ant":["fall behind"],"lv":1,"cat":"voc"},{"w":"kindle","pos":"v","ko":"불러일으키다, 불붙이다","ex":"The professor's lecture on black holes kindled her lifelong interest in astrophysics.","ans":"kindled","exKo":"블랙홀에 관한 교수의 강의가 그녀에게 평생 이어질 천체물리학에 대한 관심을 불러일으켰다.","syn":["spark","arouse","ignite"],"ant":["extinguish","dampen"],"lv":3,"cat":"voc"},{"w":"knack","pos":"n","ko":"재주, 요령","ex":"He has a real knack for explaining complicated ideas in simple and memorable terms.","ans":"knack","exKo":"그는 복잡한 생각을 쉽고 기억에 남는 말로 설명하는 재주가 있다.","syn":["talent","gift","flair"],"ant":[],"lv":2,"cat":"voc"},{"w":"lag","pos":"v","ko":"뒤처지다","ex":"Wages have continued to lag behind rising living costs for most workers in the region.","ans":"lag","exKo":"그 지역 대부분의 노동자에게 임금은 계속 오르는 생활비를 따라가지 못하고 있다.","syn":["fall behind","trail"],"ant":["lead","keep up"],"lv":2,"cat":"voc"},{"w":"lament","pos":"v","ko":"한탄하다, 애도하다","ex":"Older residents lament the loss of traditional markets as large supermarkets take over the town.","ans":"lament","exKo":"대형 슈퍼마켓이 동네를 장악하면서 나이 든 주민들은 전통 시장이 사라지는 것을 한탄한다.","syn":["mourn","grieve","regret"],"ant":["celebrate"],"lv":3,"cat":"voc"},{"w":"landmark","pos":"n","ko":"랜드마크, 획기적인 사건","ex":"The court's decision was hailed as a landmark ruling for environmental protection.","ans":"landmark","exKo":"법원의 결정은 환경 보호를 위한 획기적인 판결로 환영받았다.","syn":["milestone","turning point","monument"],"ant":[],"lv":2,"cat":"voc"},{"w":"lapse","pos":"n","ko":"실수, 착오, (시간의) 경과","ex":"A momentary lapse in concentration caused the driver to miss the highway exit.","ans":"lapse","exKo":"순간적인 집중력 저하로 운전자는 고속도로 출구를 놓쳤다.","syn":["slip","error","failure"],"ant":[],"lv":3,"cat":"voc"},{"w":"lavish","pos":"adj","ko":"호화로운, 사치스러운","ex":"Critics condemned the lavish spending of public officials during the economic crisis.","ans":"lavish","exKo":"비평가들은 경제 위기 중 공직자들의 호화로운 지출을 비난했다.","syn":["extravagant","luxurious","generous"],"ant":["frugal","modest"],"lv":2,"cat":"voc"},{"w":"lax","pos":"adj","ko":"느슨한, 해이한","ex":"Lax security measures allowed hackers to access thousands of customer accounts last month.","ans":"Lax","exKo":"허술한 보안 조치 때문에 지난달 해커들이 수천 개의 고객 계정에 접근했다.","syn":["loose","careless","slack"],"ant":["strict","rigorous"],"lv":3,"cat":"voc"},{"w":"legitimate","pos":"adj","ko":"합법적인, 정당한","ex":"Employees may take unplanned leave only for legitimate reasons such as illness or family emergencies.","ans":"legitimate","exKo":"직원들은 질병이나 가족의 긴급 상황 같은 정당한 이유가 있을 때만 예정에 없던 휴가를 쓸 수 있다.","syn":["lawful","valid","justifiable"],"ant":["illegitimate","illegal"],"lv":2,"cat":"voc"},{"w":"lenient","pos":"adj","ko":"관대한, 너그러운","ex":"Some critics argued that the judge's sentence was too lenient for such a serious crime.","ans":"lenient","exKo":"일부 비평가들은 그렇게 심각한 범죄에 비해 판사의 형량이 너무 관대하다고 주장했다.","syn":["merciful","tolerant","soft"],"ant":["strict","harsh"],"lv":2,"cat":"voc"},{"w":"liability","pos":"n","ko":"법적 책임, 부채, 골칫거리","ex":"The company denied any liability for the injuries caused by the faulty product.","ans":"liability","exKo":"회사는 결함 제품으로 인한 부상에 대해 어떠한 법적 책임도 부인했다.","syn":["responsibility","accountability","debt"],"ant":["asset"],"lv":2,"cat":"voc"},{"w":"likewise","pos":"adv","ko":"마찬가지로, 똑같이","ex":"The first experiment failed, and the second attempt likewise produced no meaningful results.","ans":"likewise","exKo":"첫 번째 실험은 실패했고, 두 번째 시도도 마찬가지로 의미 있는 결과를 내지 못했다.","syn":["similarly","also","in the same way"],"ant":["conversely"],"lv":1,"cat":"voc"},{"w":"linger","pos":"v","ko":"오래 남다, 머무르다","ex":"The smell of smoke lingered in the apartment for days after the kitchen fire.","ans":"lingered","exKo":"주방 화재 후 며칠 동안 아파트에 연기 냄새가 남아 있었다.","syn":["remain","persist","stay"],"ant":["vanish","disappear"],"lv":2,"cat":"voc"},{"w":"literacy","pos":"n","ko":"읽고 쓰는 능력, 활용 능력","ex":"The charity runs programs to improve literacy among children in low-income areas.","ans":"literacy","exKo":"그 자선 단체는 저소득 지역 아이들의 읽기·쓰기 능력을 높이는 프로그램을 운영한다.","syn":["reading ability","competence"],"ant":["illiteracy"],"lv":2,"cat":"voc"},{"w":"lucrative","pos":"adj","ko":"수익성 좋은, 돈벌이가 되는","ex":"Online advertising has become a highly lucrative business for social media companies.","ans":"lucrative","exKo":"온라인 광고는 소셜 미디어 기업들에게 매우 수익성 높은 사업이 되었다.","syn":["profitable","rewarding","moneymaking"],"ant":["unprofitable"],"lv":1,"cat":"voc"},{"w":"look into","pos":"phr","ko":"조사하다, 살펴보다","ex":"The airline promised to look into the complaint about luggage lost on the overnight flight.","ans":"look into","exKo":"항공사는 야간 항공편에서 분실된 수하물에 관한 불만을 조사하겠다고 약속했다.","syn":["investigate","examine","explore"],"ant":["ignore"],"lv":1,"cat":"voc"},{"w":"lay off","pos":"phr","ko":"해고하다, 일시 해고하다","ex":"The automaker plans to lay off two thousand workers due to falling sales overseas.","ans":"lay off","exKo":"그 자동차 회사는 해외 판매 감소로 노동자 2천 명을 해고할 계획이다.","syn":["dismiss","let go","cut"],"ant":["hire","employ"],"lv":1,"cat":"voc"},{"w":"let down","pos":"phr","ko":"실망시키다","ex":"Fans felt let down when the band canceled its concert at the last minute without explanation.","ans":"let down","exKo":"밴드가 설명 없이 막판에 콘서트를 취소하자 팬들은 실망했다.","syn":["disappoint","fail"],"ant":["satisfy"],"lv":2,"cat":"voc"},{"w":"locate","pos":"v","ko":"위치시키다, 찾아내다","ex":"The new branch office is conveniently located near the central subway station downtown.","ans":"located","exKo":"새 지점은 시내 중앙 지하철역 근처의 편리한 곳에 있다.","syn":["situate","place","find"],"ant":[],"lv":1,"cat":"voc"},{"w":"longevity","pos":"n","ko":"장수, 수명","ex":"Researchers believe that diet and social connections play a key role in human longevity.","ans":"longevity","exKo":"연구자들은 식단과 사회적 관계가 인간의 장수에 중요한 역할을 한다고 본다.","syn":["long life","durability","lifespan"],"ant":[],"lv":3,"cat":"voc"},{"w":"loyal","pos":"adj","ko":"충성스러운, 충실한","ex":"The coffee shop rewards loyal customers with a free drink after every ten purchases.","ans":"loyal","exKo":"그 카페는 단골손님에게 열 번 구매할 때마다 무료 음료를 제공한다.","syn":["faithful","devoted","dedicated"],"ant":["disloyal"],"lv":1,"cat":"voc"},{"w":"liable","pos":"adj","ko":"~하기 쉬운, 법적 책임이 있는","ex":"Drivers who exceed the speed limit in school zones are liable to pay heavy fines.","ans":"liable","exKo":"어린이 보호 구역에서 제한 속도를 넘는 운전자는 무거운 벌금을 물 수 있다.","syn":["responsible","likely","subject"],"ant":["exempt"],"lv":2,"cat":"voc"},{"w":"magnitude","pos":"n","ko":"규모, 크기, 중요성","ex":"Officials initially underestimated the magnitude of the damage caused by the earthquake.","ans":"magnitude","exKo":"당국은 처음에 지진으로 인한 피해 규모를 과소평가했다.","syn":["scale","extent","size"],"ant":[],"lv":2,"cat":"voc"},{"w":"maintain","pos":"v","ko":"유지하다, 주장하다","ex":"Experts say it is important to maintain a healthy balance between work and personal life.","ans":"maintain","exKo":"전문가들은 일과 개인 생활 사이에 건강한 균형을 유지하는 것이 중요하다고 말한다.","syn":["keep","sustain","claim"],"ant":["abandon"],"lv":1,"cat":"voc"},{"w":"malfunction","pos":"n","ko":"오작동, 고장","ex":"A software malfunction caused the stock trading system to shut down for two hours.","ans":"malfunction","exKo":"소프트웨어 오작동으로 주식 거래 시스템이 두 시간 동안 멈췄다.","syn":["breakdown","failure","glitch"],"ant":[],"lv":1,"cat":"voc"},{"w":"mandatory","pos":"adj","ko":"의무적인, 강제의","ex":"Attendance at the safety training session is mandatory for all factory employees.","ans":"mandatory","exKo":"안전 교육 참석은 모든 공장 직원에게 의무이다.","syn":["compulsory","required","obligatory"],"ant":["optional","voluntary"],"lv":1,"cat":"voc"},{"w":"manipulate","pos":"v","ko":"조작하다, 교묘히 다루다","ex":"The company was accused of trying to manipulate stock prices before the official announcement.","ans":"manipulate","exKo":"그 회사는 공식 발표 전에 주가를 조작하려 했다는 혐의를 받았다.","syn":["rig","control","exploit"],"ant":[],"lv":2,"cat":"voc"},{"w":"marginal","pos":"adj","ko":"미미한, 주변부의","ex":"The new education policy produced only marginal improvements in student test scores.","ans":"marginal","exKo":"새 교육 정책은 학생들의 시험 점수를 아주 조금 올리는 데 그쳤다.","syn":["slight","minimal","negligible"],"ant":["significant","substantial"],"lv":2,"cat":"voc"},{"w":"meager","pos":"adj","ko":"빈약한, 얼마 안 되는","ex":"Many retirees in rural areas struggle to survive on a meager monthly pension.","ans":"meager","exKo":"농촌의 많은 은퇴자들이 얼마 안 되는 월 연금으로 생활하느라 힘겨워한다.","syn":["scanty","paltry","insufficient"],"ant":["ample","abundant"],"lv":3,"cat":"voc"},{"w":"mediate","pos":"v","ko":"중재하다","ex":"A neutral third party was invited to mediate the dispute between the landlord and tenants.","ans":"mediate","exKo":"집주인과 세입자 간의 분쟁을 중재하기 위해 중립적인 제3자가 초빙되었다.","syn":["arbitrate","negotiate","intervene"],"ant":[],"lv":2,"cat":"voc"},{"w":"merge","pos":"v","ko":"합병하다, 합치다","ex":"The two banks agreed to merge in order to compete with larger international firms.","ans":"merge","exKo":"두 은행은 더 큰 국제 기업들과 경쟁하기 위해 합병하기로 합의했다.","syn":["combine","unite","consolidate"],"ant":["separate","split"],"lv":1,"cat":"voc"},{"w":"meticulous","pos":"adj","ko":"꼼꼼한, 세심한","ex":"The editor is meticulous about checking every fact before an article is published.","ans":"meticulous","exKo":"그 편집자는 기사가 발행되기 전에 모든 사실을 꼼꼼하게 확인한다.","syn":["thorough","careful","precise"],"ant":["careless","sloppy"],"lv":2,"cat":"voc"},{"w":"migrate","pos":"v","ko":"이주하다, 이동하다","ex":"Many young people migrate to large cities in search of better job opportunities.","ans":"migrate","exKo":"많은 젊은이가 더 나은 일자리를 찾아 대도시로 이주한다.","syn":["move","relocate","emigrate"],"ant":["stay"],"lv":2,"cat":"voc"},{"w":"minimize","pos":"v","ko":"최소화하다","ex":"Wearing a seatbelt can significantly minimize the risk of serious injury in a car accident.","ans":"minimize","exKo":"안전벨트를 매면 자동차 사고에서 중상을 입을 위험을 크게 줄일 수 있다.","syn":["reduce","lessen","decrease"],"ant":["maximize","increase"],"lv":1,"cat":"voc"},{"w":"misleading","pos":"adj","ko":"오해의 소지가 있는, 호도하는","ex":"The advertisement was banned for making misleading claims about the product's health benefits.","ans":"misleading","exKo":"그 광고는 제품의 건강 효능에 대해 오해를 일으키는 주장을 해 금지되었다.","syn":["deceptive","false","confusing"],"ant":["accurate","truthful"],"lv":1,"cat":"voc"},{"w":"mitigate","pos":"v","ko":"완화하다, 경감하다","ex":"Planting more trees in urban areas can help mitigate the effects of extreme summer heat.","ans":"mitigate","exKo":"도심에 나무를 더 심으면 극심한 여름 더위의 영향을 완화하는 데 도움이 된다.","syn":["alleviate","ease","reduce"],"ant":["aggravate","worsen"],"lv":2,"cat":"voc"},{"w":"modest","pos":"adj","ko":"겸손한, 적당한, 수수한","ex":"Economists expect a modest increase in consumer spending during the upcoming holiday season.","ans":"modest","exKo":"경제학자들은 다가오는 연휴 기간에 소비 지출이 소폭 증가할 것으로 예상한다.","syn":["moderate","small","humble"],"ant":["huge","arrogant"],"lv":1,"cat":"voc"},{"w":"momentum","pos":"n","ko":"추진력, 기세","ex":"The environmental campaign gained momentum after several famous celebrities publicly supported it on social media.","ans":"momentum","exKo":"여러 유명인이 소셜 미디어에서 공개적으로 지지한 뒤 그 환경 캠페인은 탄력을 받았다.","syn":["impetus","drive","force"],"ant":[],"lv":2,"cat":"voc"},{"w":"monopoly","pos":"n","ko":"독점, 독점권","ex":"Regulators are investigating whether the tech giant holds an unfair monopoly in online search.","ans":"monopoly","exKo":"규제 당국은 그 거대 기술 기업이 온라인 검색 시장을 부당하게 독점하고 있는지 조사 중이다.","syn":["exclusive control","dominance"],"ant":["competition"],"lv":2,"cat":"voc"},{"w":"monotonous","pos":"adj","ko":"단조로운, 지루한","ex":"Factory workers often complain that assembly line tasks are monotonous and physically tiring.","ans":"monotonous","exKo":"공장 노동자들은 조립 라인 작업이 단조롭고 육체적으로 힘들다고 자주 불평한다.","syn":["repetitive","dull","tedious"],"ant":["varied","exciting"],"lv":2,"cat":"voc"},{"w":"morale","pos":"n","ko":"사기, 의욕","ex":"Frequent layoffs over the past year have severely damaged employee morale at the company.","ans":"morale","exKo":"지난 1년간의 잦은 해고로 회사 직원들의 사기가 크게 떨어졌다.","syn":["spirit","confidence","motivation"],"ant":[],"lv":2,"cat":"voc"},{"w":"mundane","pos":"adj","ko":"일상적인, 평범한","ex":"Robots can take over mundane tasks, allowing staff to focus on more creative work.","ans":"mundane","exKo":"로봇이 일상적인 업무를 맡으면 직원들은 더 창의적인 일에 집중할 수 있다.","syn":["ordinary","routine","dull"],"ant":["extraordinary","exciting"],"lv":3,"cat":"voc"},{"w":"mutual","pos":"adj","ko":"상호의, 공동의","ex":"The partnership is based on mutual trust and a shared commitment to product quality.","ans":"mutual","exKo":"그 협력 관계는 상호 신뢰와 제품 품질에 대한 공동의 의지에 바탕을 두고 있다.","syn":["reciprocal","shared","common"],"ant":["one-sided"],"lv":1,"cat":"voc"},{"w":"make up for","pos":"phr","ko":"보상하다, 만회하다","ex":"The airline offered free travel vouchers to make up for the long flight delay.","ans":"make up for","exKo":"항공사는 장시간 비행 지연을 보상하기 위해 무료 여행권을 제공했다.","syn":["compensate for","offset","atone for"],"ant":[],"lv":1,"cat":"voc"},{"w":"mull over","pos":"phr","ko":"숙고하다, 곰곰이 생각하다","ex":"I need a few days to mull over the job offer before giving the company my answer.","ans":"mull over","exKo":"회사에 답을 주기 전에 그 일자리 제안을 곰곰이 생각할 며칠이 필요하다.","syn":["consider","ponder","think over"],"ant":[],"lv":3,"cat":"voc"},{"w":"moderate","pos":"adj","ko":"적당한, 온건한, 중간의","ex":"Doctors recommend moderate exercise, such as brisk walking, for at least thirty minutes a day.","ans":"moderate","exKo":"의사들은 빠르게 걷기 같은 적당한 운동을 하루 최소 30분 하라고 권한다.","syn":["reasonable","medium","mild"],"ant":["extreme","excessive"],"lv":1,"cat":"voc"},{"w":"mandate","pos":"n","ko":"권한, 위임, 명령","ex":"The newly elected president claimed a clear mandate to reform the national healthcare system.","ans":"mandate","exKo":"새로 당선된 대통령은 국가 의료 제도를 개혁할 분명한 권한을 위임받았다고 주장했다.","syn":["authority","order","directive"],"ant":[],"lv":3,"cat":"voc"},{"w":"massive","pos":"adj","ko":"거대한, 대규모의","ex":"The tropical storm caused massive power outages across the eastern coast last night.","ans":"massive","exKo":"열대 폭풍이 어젯밤 동부 해안 전역에 대규모 정전을 일으켰다.","syn":["huge","enormous","extensive"],"ant":["tiny","small"],"lv":1,"cat":"voc"},{"w":"measure","pos":"n","ko":"조치, 대책, 척도","ex":"The government introduced strict measures to curb the spread of the virus in crowded areas.","ans":"measures","exKo":"정부는 붐비는 지역에서 바이러스 확산을 억제하기 위해 엄격한 조치를 도입했다.","syn":["step","action","policy"],"ant":[],"lv":1,"cat":"voc"},{"w":"misplace","pos":"v","ko":"잘못 두다, 둔 곳을 잊다","ex":"I must have misplaced my keys, because they are not in my bag or my coat pocket.","ans":"misplaced","exKo":"열쇠가 가방에도 외투 주머니에도 없는 걸 보니 어딘가에 잘못 둔 것 같다.","syn":["lose","mislay"],"ant":["find"],"lv":2,"cat":"voc"},{"w":"mobilize","pos":"v","ko":"동원하다, 결집하다","ex":"Local activists mobilized thousands of volunteers to clean up the polluted beach over the weekend.","ans":"mobilized","exKo":"지역 활동가들은 주말 동안 오염된 해변을 청소하기 위해 수천 명의 자원봉사자를 동원했다.","syn":["rally","organize","gather"],"ant":["disband"],"lv":3,"cat":"voc"},{"w":"naive","pos":"adj","ko":"순진한, 세상 물정 모르는","ex":"It would be naive to believe that the problem will solve itself without any action from us.","ans":"naive","exKo":"우리가 아무것도 하지 않아도 문제가 저절로 해결될 거라고 믿는 것은 순진한 생각이다.","syn":["innocent","gullible","inexperienced"],"ant":["sophisticated","worldly"],"lv":2,"cat":"voc"},{"w":"narrow down","pos":"phr","ko":"좁히다, 줄이다","ex":"The hiring committee has narrowed down the list of candidates to three finalists.","ans":"narrowed down","exKo":"채용 위원회는 후보자 명단을 최종 후보 세 명으로 좁혔다.","syn":["reduce","limit","shortlist"],"ant":["expand"],"lv":1,"cat":"voc"},{"w":"negligent","pos":"adj","ko":"태만한, 부주의한","ex":"The hospital was found negligent for failing to monitor the patient properly after surgery.","ans":"negligent","exKo":"그 병원은 수술 후 환자를 제대로 관찰하지 않아 과실이 있다는 판결을 받았다.","syn":["careless","irresponsible","neglectful"],"ant":["careful","diligent"],"lv":2,"cat":"voc"},{"w":"negligible","pos":"adj","ko":"무시해도 될 정도의, 사소한","ex":"The difference in price between the two models is negligible, so choose the one you like better.","ans":"negligible","exKo":"두 모델의 가격 차이는 무시해도 될 정도이니 더 마음에 드는 것을 고르세요.","syn":["insignificant","trivial","minor"],"ant":["significant","considerable"],"lv":2,"cat":"voc"},{"w":"negotiate","pos":"v","ko":"협상하다, 교섭하다","ex":"Union leaders are negotiating with management over wages and working conditions this week.","ans":"negotiating","exKo":"노조 지도부는 이번 주에 임금과 근로 조건을 두고 경영진과 협상하고 있다.","syn":["bargain","discuss","deal"],"ant":[],"lv":1,"cat":"voc"},{"w":"notable","pos":"adj","ko":"주목할 만한, 눈에 띄는","ex":"One notable feature of the new smartphone is its battery, which lasts for two full days.","ans":"notable","exKo":"새 스마트폰의 주목할 만한 특징 하나는 꼬박 이틀 가는 배터리이다.","syn":["remarkable","noteworthy","significant"],"ant":["ordinary","insignificant"],"lv":1,"cat":"voc"},{"w":"notify","pos":"v","ko":"통지하다, 알리다","ex":"Passengers will be notified by text message if their flight is delayed or canceled.","ans":"notified","exKo":"항공편이 지연되거나 취소되면 승객에게 문자 메시지로 통지된다.","syn":["inform","advise","alert"],"ant":[],"lv":1,"cat":"voc"},{"w":"notorious","pos":"adj","ko":"악명 높은","ex":"The downtown intersection is notorious for traffic accidents during the evening rush hour.","ans":"notorious","exKo":"그 시내 교차로는 저녁 출퇴근 시간대 교통사고로 악명이 높다.","syn":["infamous","disreputable"],"ant":["renowned","reputable"],"lv":2,"cat":"voc"},{"w":"novice","pos":"n","ko":"초보자, 신참","ex":"This cooking class is designed for novices who have never prepared a meal from scratch.","ans":"novices","exKo":"이 요리 수업은 처음부터 직접 음식을 만들어 본 적 없는 초보자를 위한 것이다.","syn":["beginner","newcomer","amateur"],"ant":["expert","veteran"],"lv":2,"cat":"voc"},{"w":"nuisance","pos":"n","ko":"성가신 것, 골칫거리","ex":"Loud music from the bar next door has become a nuisance for local residents at night.","ans":"nuisance","exKo":"옆 술집의 시끄러운 음악이 밤마다 동네 주민들에게 골칫거리가 되었다.","syn":["annoyance","bother","pest"],"ant":[],"lv":2,"cat":"voc"},{"w":"nurture","pos":"v","ko":"기르다, 양성하다","ex":"The government program aims to nurture young entrepreneurs through mentoring and funding.","ans":"nurture","exKo":"그 정부 프로그램은 멘토링과 자금 지원으로 젊은 창업가를 육성하는 것을 목표로 한다.","syn":["foster","cultivate","raise"],"ant":["neglect"],"lv":2,"cat":"voc"},{"w":"nominal","pos":"adj","ko":"명목상의, 아주 적은","ex":"Members can use the community gym facilities for a nominal fee of five dollars a month.","ans":"nominal","exKo":"회원은 한 달에 5달러라는 아주 적은 요금으로 주민 체육관 시설을 이용할 수 있다.","syn":["token","minimal","symbolic"],"ant":["substantial","actual"],"lv":3,"cat":"voc"},{"w":"nostalgia","pos":"n","ko":"향수, 옛것에 대한 그리움","ex":"The old songs played at the concert filled many listeners with nostalgia for their childhood.","ans":"nostalgia","exKo":"콘서트에서 나온 옛 노래들은 많은 청중에게 어린 시절에 대한 향수를 불러일으켰다.","syn":["longing","wistfulness","reminiscence"],"ant":[],"lv":3,"cat":"voc"},{"w":"neutral","pos":"adj","ko":"중립의, 중립적인","ex":"Journalists are expected to remain neutral when reporting on sensitive political issues.","ans":"neutral","exKo":"기자는 민감한 정치 문제를 보도할 때 중립을 지켜야 한다.","syn":["impartial","unbiased","objective"],"ant":["biased","partial"],"lv":1,"cat":"voc"},{"w":"nonetheless","pos":"adv","ko":"그럼에도 불구하고","ex":"The plan was extremely risky; nonetheless, the board decided to approve it after a long debate.","ans":"nonetheless","exKo":"그 계획은 매우 위험했지만, 그럼에도 이사회는 긴 논의 끝에 승인하기로 했다.","syn":["nevertheless","however","even so"],"ant":[],"lv":1,"cat":"voc"},{"w":"obligation","pos":"n","ko":"의무, 책임","ex":"Employers have a legal obligation to provide a safe working environment for their staff.","ans":"obligation","exKo":"고용주는 직원에게 안전한 작업 환경을 제공할 법적 의무가 있다.","syn":["duty","responsibility","requirement"],"ant":["option"],"lv":1,"cat":"voc"},{"w":"obscure","pos":"adj","ko":"모호한, 잘 알려지지 않은","ex":"The meaning of the poem remains obscure even to many professors of literature.","ans":"obscure","exKo":"그 시의 의미는 많은 문학 교수들에게조차 여전히 모호하다.","syn":["unclear","vague","little-known"],"ant":["clear","famous"],"lv":2,"cat":"voc"},{"w":"observe","pos":"v","ko":"관찰하다, 준수하다","ex":"All visitors must observe the safety rules while touring the factory floor with a guide.","ans":"observe","exKo":"모든 방문객은 안내원과 함께 공장 작업장을 둘러보는 동안 안전 수칙을 지켜야 한다.","syn":["follow","obey","watch"],"ant":["violate","ignore"],"lv":1,"cat":"voc"},{"w":"obsolete","pos":"adj","ko":"구식의, 더 이상 쓰이지 않는","ex":"Many traditional jobs may become obsolete as artificial intelligence continues to advance.","ans":"obsolete","exKo":"인공지능이 계속 발전하면서 많은 전통적인 직업이 사라질 수 있다.","syn":["outdated","out of date","antiquated"],"ant":["modern","current"],"lv":1,"cat":"voc"},{"w":"obstacle","pos":"n","ko":"장애물, 방해","ex":"Lack of funding remains the biggest obstacle to expanding the research program abroad.","ans":"obstacle","exKo":"자금 부족이 그 연구 프로그램을 해외로 확대하는 데 여전히 가장 큰 걸림돌이다.","syn":["barrier","hurdle","impediment"],"ant":["advantage"],"lv":1,"cat":"voc"},{"w":"obtain","pos":"v","ko":"얻다, 획득하다","ex":"Foreign applicants must obtain a work permit before they can officially start their jobs.","ans":"obtain","exKo":"외국인 지원자는 공식적으로 일을 시작하기 전에 취업 허가를 받아야 한다.","syn":["acquire","get","secure"],"ant":["lose"],"lv":1,"cat":"voc"},{"w":"occupation","pos":"n","ko":"직업, 점유, 점령","ex":"Please state your full name, age, and occupation on the first page of the application form.","ans":"occupation","exKo":"신청서 첫 페이지에 성명, 나이, 직업을 기재해 주십시오.","syn":["job","profession","career"],"ant":[],"lv":1,"cat":"voc"},{"w":"offset","pos":"v","ko":"상쇄하다, 벌충하다","ex":"Higher fuel costs were partly offset by an increase in passenger numbers this quarter.","ans":"offset","exKo":"이번 분기에는 늘어난 연료비가 승객 수 증가로 일부 상쇄되었다.","syn":["counterbalance","compensate for","cancel out"],"ant":[],"lv":2,"cat":"voc"},{"w":"ominous","pos":"adj","ko":"불길한","ex":"Dark clouds gathered over the stadium, an ominous sign for the outdoor concert that evening.","ans":"ominous","exKo":"경기장 위로 먹구름이 몰려왔는데, 그날 저녁 야외 콘서트에는 불길한 징조였다.","syn":["threatening","menacing","foreboding"],"ant":["promising","auspicious"],"lv":3,"cat":"voc"},{"w":"omit","pos":"v","ko":"빠뜨리다, 생략하다","ex":"Several important details were omitted from the final version of the annual report.","ans":"omitted","exKo":"연례 보고서 최종본에서 몇 가지 중요한 세부 사항이 빠졌다.","syn":["leave out","exclude","skip"],"ant":["include"],"lv":2,"cat":"voc"},{"w":"ongoing","pos":"adj","ko":"진행 중인","ex":"The police said the investigation into the downtown bank robbery is still ongoing.","ans":"ongoing","exKo":"경찰은 시내 은행 강도 사건에 대한 수사가 아직 진행 중이라고 밝혔다.","syn":["continuing","in progress","current"],"ant":["finished","completed"],"lv":1,"cat":"voc"},{"w":"onset","pos":"n","ko":"시작, 발병, 개시","ex":"Early treatment can delay the onset of serious symptoms in patients with diabetes.","ans":"onset","exKo":"조기 치료는 당뇨병 환자에게 심각한 증상이 나타나는 시점을 늦출 수 있다.","syn":["beginning","start","outbreak"],"ant":["end"],"lv":3,"cat":"voc"},{"w":"opt","pos":"v","ko":"선택하다, 고르다","ex":"More and more employees are opting to work from home at least two days a week.","ans":"opting","exKo":"일주일에 최소 이틀은 재택근무를 선택하는 직원이 점점 늘고 있다.","syn":["choose","elect","decide"],"ant":[],"lv":2,"cat":"voc"},{"w":"optimal","pos":"adj","ko":"최적의","ex":"Researchers are studying the optimal amount of sleep for teenagers' academic performance.","ans":"optimal","exKo":"연구자들은 십 대의 학업 성취에 가장 알맞은 수면 시간을 연구하고 있다.","syn":["best","ideal","optimum"],"ant":["worst"],"lv":2,"cat":"voc"},{"w":"ordeal","pos":"n","ko":"시련, 고된 경험","ex":"The hikers described their three days lost in the forest as a terrible ordeal.","ans":"ordeal","exKo":"등산객들은 숲속에서 길을 잃었던 사흘을 끔찍한 시련이었다고 묘사했다.","syn":["hardship","trial","nightmare"],"ant":[],"lv":3,"cat":"voc"},{"w":"outbreak","pos":"n","ko":"발생, 발발","ex":"Health officials are working to contain the outbreak of food poisoning at the elementary school.","ans":"outbreak","exKo":"보건 당국은 그 초등학교에서 발생한 식중독 확산을 막기 위해 애쓰고 있다.","syn":["eruption","epidemic","onset"],"ant":[],"lv":1,"cat":"voc"},{"w":"outcome","pos":"n","ko":"결과, 성과","ex":"Both parties are waiting anxiously for the outcome of the court's decision next week.","ans":"outcome","exKo":"양측은 다음 주 법원 결정의 결과를 초조하게 기다리고 있다.","syn":["result","consequence","upshot"],"ant":["cause"],"lv":1,"cat":"voc"},{"w":"outdated","pos":"adj","ko":"구식의, 시대에 뒤떨어진","ex":"The small hospital still relies on outdated equipment that frequently breaks down.","ans":"outdated","exKo":"그 작은 병원은 아직도 자주 고장 나는 낡은 장비에 의존하고 있다.","syn":["obsolete","old-fashioned","out of date"],"ant":["modern","up-to-date"],"lv":1,"cat":"voc"},{"w":"outlook","pos":"n","ko":"전망, 관점","ex":"The bank revised its economic outlook for next year, citing weaker exports to China.","ans":"outlook","exKo":"그 은행은 중국 수출 약화를 이유로 내년 경제 전망을 수정했다.","syn":["prospect","forecast","perspective"],"ant":[],"lv":2,"cat":"voc"},{"w":"outweigh","pos":"v","ko":"~보다 더 크다, 능가하다","ex":"Doctors believe the benefits of the new treatment far outweigh its potential side effects.","ans":"outweigh","exKo":"의사들은 새 치료법의 이점이 잠재적 부작용보다 훨씬 크다고 본다.","syn":["exceed","surpass","override"],"ant":[],"lv":2,"cat":"voc"},{"w":"overdue","pos":"adj","ko":"기한이 지난, 연체된","ex":"You will be charged a late fee if your library books are more than a week overdue.","ans":"overdue","exKo":"도서관 책 반납이 일주일 넘게 늦어지면 연체료가 부과된다.","syn":["late","past due","delayed"],"ant":["early","on time"],"lv":1,"cat":"voc"},{"w":"overlook","pos":"v","ko":"간과하다, 내려다보다","ex":"The auditors overlooked several errors in the company's financial statements last year.","ans":"overlooked","exKo":"감사인들은 작년 회사 재무제표의 몇몇 오류를 간과했다.","syn":["miss","neglect","disregard"],"ant":["notice"],"lv":1,"cat":"voc"},{"w":"overwhelming","pos":"adj","ko":"압도적인, 감당하기 힘든","ex":"The merger proposal was approved by an overwhelming majority of the shareholders.","ans":"overwhelming","exKo":"합병안은 주주들의 압도적인 다수의 찬성으로 승인되었다.","syn":["overpowering","massive","crushing"],"ant":["slight"],"lv":1,"cat":"voc"},{"w":"oversee","pos":"v","ko":"감독하다, 관리하다","ex":"She was hired to oversee the construction of the company's new headquarters in Busan.","ans":"oversee","exKo":"그녀는 부산에 짓는 회사 새 본사의 건설을 감독하기 위해 채용되었다.","syn":["supervise","manage","direct"],"ant":[],"lv":2,"cat":"voc"},{"w":"oblivious","pos":"adj","ko":"의식하지 못하는, 무관심한","ex":"Absorbed in his phone, he was completely oblivious to the traffic moving around him.","ans":"oblivious","exKo":"휴대폰에 빠져 그는 주변을 오가는 차량을 전혀 의식하지 못했다.","syn":["unaware","unconscious","heedless"],"ant":["aware","mindful"],"lv":3,"cat":"voc"},{"w":"out of stock","pos":"phr","ko":"품절된, 재고가 없는","ex":"I'm sorry, but the blue sweater you ordered online is currently out of stock.","ans":"out of stock","exKo":"죄송하지만 온라인으로 주문하신 파란 스웨터는 현재 품절입니다.","syn":["sold out","unavailable"],"ant":["in stock","available"],"lv":1,"cat":"voc"},{"w":"overhaul","pos":"v","ko":"정비하다, 전면 개편하다","ex":"The new minister promised to overhaul the country's outdated pension system within two years.","ans":"overhaul","exKo":"새 장관은 2년 안에 나라의 낡은 연금 제도를 전면 개편하겠다고 약속했다.","syn":["revamp","renovate","reform"],"ant":[],"lv":3,"cat":"voc"},{"w":"participate","pos":"v","ko":"참여하다, 참가하다","ex":"All employees are encouraged to participate in the safety workshop scheduled for next Thursday afternoon.","ans":"participate","exKo":"모든 직원은 다음 주 목요일 오후로 예정된 안전 워크숍에 참여하도록 권장된다.","syn":["take part","join","engage"],"ant":["abstain"],"lv":1,"cat":"voc"},{"w":"patron","pos":"n","ko":"고객, 후원자","ex":"The library thanked its loyal patrons for their donations during the annual fundraising campaign.","ans":"patrons","exKo":"도서관은 연례 모금 행사 기간 동안 기부해 준 충실한 후원자들에게 감사를 표했다.","syn":["customer","supporter","sponsor"],"ant":[],"lv":2,"cat":"voc"},{"w":"pay off","pos":"phr","ko":"성과를 거두다, 빚을 다 갚다","ex":"Her months of hard work finally paid off when she was promoted to regional manager.","ans":"paid off","exKo":"그녀가 지역 관리자로 승진하면서 몇 달간의 노력이 마침내 결실을 맺었다.","syn":["succeed","be worthwhile"],"ant":["fail"],"lv":1,"cat":"voc"},{"w":"penalty","pos":"n","ko":"벌금, 처벌","ex":"Customers who cancel their contracts early will have to pay a penalty of fifty dollars.","ans":"penalty","exKo":"계약을 조기에 해지하는 고객은 50달러의 위약금을 내야 한다.","syn":["fine","punishment"],"ant":["reward"],"lv":1,"cat":"voc"},{"w":"periodically","pos":"adv","ko":"주기적으로, 정기적으로","ex":"Users should periodically change their passwords to protect their accounts from hackers.","ans":"periodically","exKo":"사용자는 해커로부터 계정을 보호하기 위해 주기적으로 비밀번호를 바꿔야 한다.","syn":["regularly","from time to time"],"ant":["constantly"],"lv":2,"cat":"voc"},{"w":"perishable","pos":"adj","ko":"상하기 쉬운","ex":"Perishable items such as milk and fresh fish must be stored in the refrigerator immediately.","ans":"Perishable","exKo":"우유나 생선 같은 상하기 쉬운 식품은 즉시 냉장고에 보관해야 한다.","syn":["spoilable","short-lived"],"ant":["durable","nonperishable"],"lv":2,"cat":"voc"},{"w":"permanent","pos":"adj","ko":"영구적인, 정규직의","ex":"After a six-month trial period, he was offered a permanent position at the design firm.","ans":"permanent","exKo":"6개월의 수습 기간이 끝난 뒤 그는 디자인 회사의 정규직 자리를 제안받았다.","syn":["lasting","stable"],"ant":["temporary"],"lv":1,"cat":"voc"},{"w":"persuade","pos":"v","ko":"설득하다","ex":"The sales team tried to persuade the client to sign a longer contract with better terms.","ans":"persuade","exKo":"영업팀은 고객이 더 좋은 조건의 장기 계약을 맺도록 설득하려 했다.","syn":["convince","talk into"],"ant":["dissuade"],"lv":1,"cat":"voc"},{"w":"pertinent","pos":"adj","ko":"관련 있는, 적절한","ex":"Please include only pertinent information in your report so that readers can focus on the main issue.","ans":"pertinent","exKo":"독자가 핵심 문제에 집중할 수 있도록 보고서에는 관련 있는 정보만 넣어 주세요.","syn":["relevant","applicable"],"ant":["irrelevant"],"lv":3,"cat":"voc"},{"w":"pharmacy","pos":"n","ko":"약국","ex":"You can pick up your prescription at the pharmacy on the first floor of the hospital.","ans":"pharmacy","exKo":"처방약은 병원 1층 약국에서 받으실 수 있습니다.","syn":["drugstore","chemist"],"ant":[],"lv":1,"cat":"voc"},{"w":"phenomenon","pos":"n","ko":"현상","ex":"Scientists are still studying the phenomenon of rising sea temperatures in the Pacific Ocean.","ans":"phenomenon","exKo":"과학자들은 태평양의 해수 온도 상승 현상을 여전히 연구하고 있다.","syn":["occurrence","event"],"ant":[],"lv":1,"cat":"voc"},{"w":"pinpoint","pos":"v","ko":"정확히 찾아내다, 집어내다","ex":"Engineers have not yet been able to pinpoint the exact cause of the power outage.","ans":"pinpoint","exKo":"기술자들은 아직 정전의 정확한 원인을 찾아내지 못했다.","syn":["identify","locate"],"ant":[],"lv":3,"cat":"voc"},{"w":"placate","pos":"v","ko":"달래다, 진정시키다","ex":"The airline offered free meal vouchers to placate passengers whose flights had been delayed for hours.","ans":"placate","exKo":"항공사는 항공편이 몇 시간 지연된 승객들을 달래기 위해 무료 식사권을 제공했다.","syn":["appease","pacify","soothe"],"ant":["provoke","anger"],"lv":3,"cat":"voc"},{"w":"plausible","pos":"adj","ko":"그럴듯한, 타당해 보이는","ex":"The detective found the suspect's explanation plausible, but he still checked every detail.","ans":"plausible","exKo":"형사는 용의자의 설명이 그럴듯하다고 생각했지만 그래도 세부 사항을 모두 확인했다.","syn":["believable","credible","likely"],"ant":["implausible","unlikely"],"lv":2,"cat":"voc"},{"w":"poised","pos":"adj","ko":"~할 태세를 갖춘, 침착한","ex":"The company is poised to become the largest electric car maker in Asia by next year.","ans":"poised","exKo":"그 회사는 내년까지 아시아 최대 전기차 제조사가 될 태세를 갖추고 있다.","syn":["ready","prepared","set"],"ant":["unprepared"],"lv":3,"cat":"voc"},{"w":"portable","pos":"adj","ko":"휴대용의, 들고 다닐 수 있는","ex":"This portable charger is small enough to fit in your pocket and can charge two phones.","ans":"portable","exKo":"이 휴대용 충전기는 주머니에 들어갈 만큼 작고 휴대폰 두 대를 충전할 수 있다.","syn":["handheld","mobile","compact"],"ant":["stationary"],"lv":1,"cat":"voc"},{"w":"postpone","pos":"v","ko":"연기하다, 미루다","ex":"The outdoor concert was postponed until next weekend because of the heavy rain forecast.","ans":"postponed","exKo":"폭우 예보 때문에 야외 콘서트가 다음 주말로 연기되었다.","syn":["delay","put off","defer"],"ant":["advance"],"lv":1,"cat":"voc"},{"w":"potent","pos":"adj","ko":"강력한, 효능이 있는","ex":"The new medicine is more potent than older drugs, so patients need only a smaller dose.","ans":"potent","exKo":"새 약은 기존 약보다 효능이 강해서 환자는 더 적은 양만 복용하면 된다.","syn":["powerful","strong","effective"],"ant":["weak"],"lv":3,"cat":"voc"},{"w":"precaution","pos":"n","ko":"예방 조치, 주의","ex":"As a precaution, visitors are asked to wear masks inside the hospital at all times.","ans":"precaution","exKo":"예방 조치로 방문객은 병원 안에서 항상 마스크를 착용해야 한다.","syn":["safeguard","preventive measure"],"ant":["carelessness"],"lv":1,"cat":"voc"},{"w":"precede","pos":"v","ko":"앞서다, 선행하다","ex":"A short welcome speech by the mayor will precede the opening ceremony of the festival.","ans":"precede","exKo":"축제 개막식에 앞서 시장의 짧은 환영사가 있을 예정이다.","syn":["come before","go before"],"ant":["follow","succeed"],"lv":2,"cat":"voc"},{"w":"predecessor","pos":"n","ko":"전임자, 이전 모델","ex":"The new smartphone has a longer battery life and a brighter screen than its predecessor.","ans":"predecessor","exKo":"새 스마트폰은 이전 모델보다 배터리 수명이 길고 화면이 더 밝다.","syn":["forerunner","previous version"],"ant":["successor"],"lv":2,"cat":"voc"},{"w":"preliminary","pos":"adj","ko":"예비의, 사전의","ex":"Preliminary results from the survey suggest that most residents support the new park project.","ans":"Preliminary","exKo":"설문 조사의 예비 결과는 대부분의 주민이 새 공원 사업을 지지한다는 것을 보여 준다.","syn":["initial","introductory","early"],"ant":["final"],"lv":2,"cat":"voc"},{"w":"premise","pos":"n","ko":"전제, (복수) 부지·구내","ex":"Smoking is strictly prohibited anywhere on the premises, including the parking lot.","ans":"premises","exKo":"주차장을 포함한 구내 어디에서도 흡연은 엄격히 금지된다.","syn":["grounds","property","assumption"],"ant":[],"lv":3,"cat":"voc"},{"w":"prerequisite","pos":"n","ko":"전제 조건, 선수 과목","ex":"Introductory Statistics is a prerequisite for the advanced data analysis course offered this fall.","ans":"prerequisite","exKo":"통계학 입문은 이번 가을에 개설되는 고급 데이터 분석 과목의 선수 과목이다.","syn":["requirement","precondition"],"ant":[],"lv":2,"cat":"voc"},{"w":"prescription","pos":"n","ko":"처방전, 처방약","ex":"This medication is only available with a prescription from a licensed doctor.","ans":"prescription","exKo":"이 약은 면허가 있는 의사의 처방전이 있어야만 구입할 수 있다.","syn":["medical order"],"ant":[],"lv":1,"cat":"voc"},{"w":"preserve","pos":"v","ko":"보존하다, 지키다","ex":"The city council voted to preserve the old train station as a historical landmark.","ans":"preserve","exKo":"시의회는 옛 기차역을 역사적 명소로 보존하기로 의결했다.","syn":["protect","conserve","maintain"],"ant":["destroy"],"lv":1,"cat":"voc"},{"w":"presume","pos":"v","ko":"추정하다, 가정하다","ex":"I presume the meeting has been canceled, since nobody has arrived in the conference room yet.","ans":"presume","exKo":"아직 아무도 회의실에 오지 않은 것을 보니 회의가 취소된 것 같다.","syn":["assume","suppose"],"ant":[],"lv":2,"cat":"voc"},{"w":"prevail","pos":"v","ko":"우세하다, 널리 퍼지다","ex":"Calm finally prevailed after the police arrived and the protesters agreed to leave peacefully.","ans":"prevailed","exKo":"경찰이 도착하고 시위대가 평화롭게 해산하기로 하자 마침내 평온이 찾아왔다.","syn":["win","predominate"],"ant":["lose"],"lv":2,"cat":"voc"},{"w":"prevalent","pos":"adj","ko":"널리 퍼진, 일반적인","ex":"Obesity has become increasingly prevalent among children who spend most of their free time indoors.","ans":"prevalent","exKo":"여가 시간 대부분을 실내에서 보내는 아이들 사이에서 비만이 점점 흔해지고 있다.","syn":["widespread","common"],"ant":["rare"],"lv":2,"cat":"voc"},{"w":"pricey","pos":"adj","ko":"값비싼","ex":"The restaurant has a great view of the river, but the dishes are a little pricey for students.","ans":"pricey","exKo":"그 식당은 강 전망이 좋지만 음식이 학생들에게는 조금 비싸다.","syn":["expensive","costly"],"ant":["cheap","affordable"],"lv":1,"cat":"voc"},{"w":"proceed","pos":"v","ko":"진행하다, 나아가다","ex":"Passengers for Flight 207 should proceed to Gate 12, where boarding will begin shortly.","ans":"proceed","exKo":"207편 승객께서는 곧 탑승이 시작될 12번 게이트로 이동해 주십시오.","syn":["go ahead","continue","move on"],"ant":["stop","halt"],"lv":1,"cat":"voc"},{"w":"procrastinate","pos":"v","ko":"미루다, 꾸물거리다","ex":"If you procrastinate until the night before the exam, you will not have enough time to review.","ans":"procrastinate","exKo":"시험 전날 밤까지 미루면 복습할 시간이 충분하지 않을 것이다.","syn":["delay","put off","dawdle"],"ant":["act promptly"],"lv":2,"cat":"voc"},{"w":"productivity","pos":"n","ko":"생산성","ex":"The study found that flexible working hours significantly improved employee productivity and morale.","ans":"productivity","exKo":"그 연구는 유연 근무제가 직원의 생산성과 사기를 크게 높였다는 것을 발견했다.","syn":["efficiency","output"],"ant":["inefficiency"],"lv":1,"cat":"voc"},{"w":"proficient","pos":"adj","ko":"능숙한, 숙달된","ex":"Applicants must be proficient in at least one foreign language and basic spreadsheet software.","ans":"proficient","exKo":"지원자는 최소 한 개의 외국어와 기본적인 스프레드시트 프로그램에 능숙해야 한다.","syn":["skilled","competent","expert"],"ant":["incompetent","unskilled"],"lv":2,"cat":"voc"},{"w":"profound","pos":"adj","ko":"깊은, 심오한, 엄청난","ex":"The invention of the internet has had a profound impact on the way people communicate.","ans":"profound","exKo":"인터넷의 발명은 사람들이 소통하는 방식에 지대한 영향을 미쳤다.","syn":["deep","significant","far-reaching"],"ant":["superficial","shallow"],"lv":2,"cat":"voc"},{"w":"prohibit","pos":"v","ko":"금지하다","ex":"The new law prohibits drivers from using mobile phones without a hands-free device.","ans":"prohibits","exKo":"새 법은 운전자가 핸즈프리 장치 없이 휴대폰을 사용하는 것을 금지한다.","syn":["ban","forbid"],"ant":["allow","permit"],"lv":1,"cat":"voc"},{"w":"prolong","pos":"v","ko":"연장하다, 늘이다","ex":"Regular maintenance can prolong the life of your car and save you money on repairs.","ans":"prolong","exKo":"정기적인 정비는 자동차 수명을 늘리고 수리비를 아껴 줄 수 있다.","syn":["extend","lengthen"],"ant":["shorten"],"lv":2,"cat":"voc"},{"w":"prominent","pos":"adj","ko":"저명한, 두드러진","ex":"A prominent economist will give the keynote speech at this year's business conference.","ans":"prominent","exKo":"저명한 경제학자가 올해 경영 학회에서 기조연설을 할 예정이다.","syn":["famous","eminent","noticeable"],"ant":["obscure","unknown"],"lv":2,"cat":"voc"},{"w":"prompt","pos":"v","ko":"촉발하다, 자극하다","ex":"The sudden rise in fuel prices prompted many commuters to switch to public transportation.","ans":"prompted","exKo":"갑작스러운 유가 상승으로 많은 통근자가 대중교통으로 바꾸었다.","syn":["cause","trigger","spur"],"ant":["prevent"],"lv":1,"cat":"voc"},{"w":"proponent","pos":"n","ko":"지지자, 옹호자","ex":"Proponents of the plan argue that the new subway line will reduce traffic in the city center.","ans":"Proponents","exKo":"그 계획의 지지자들은 새 지하철 노선이 도심 교통량을 줄일 것이라고 주장한다.","syn":["advocate","supporter"],"ant":["opponent","critic"],"lv":3,"cat":"voc"},{"w":"prospect","pos":"n","ko":"전망, 가능성","ex":"The prospect of higher wages attracted thousands of young workers to the growing city.","ans":"prospect","exKo":"더 높은 임금에 대한 전망이 수천 명의 젊은 노동자를 성장하는 그 도시로 끌어들였다.","syn":["outlook","possibility","chance"],"ant":[],"lv":1,"cat":"voc"},{"w":"provision","pos":"n","ko":"조항, 공급, 대비","ex":"The contract includes a provision that allows either party to end the agreement with thirty days' notice.","ans":"provision","exKo":"그 계약에는 어느 쪽이든 30일 전에 통보하면 계약을 끝낼 수 있다는 조항이 있다.","syn":["clause","term","supply"],"ant":[],"lv":2,"cat":"voc"},{"w":"provoke","pos":"v","ko":"유발하다, 화나게 하다","ex":"The minister's comments about raising taxes provoked strong criticism from opposition lawmakers.","ans":"provoked","exKo":"증세에 관한 장관의 발언은 야당 의원들의 거센 비판을 불러일으켰다.","syn":["cause","arouse","anger"],"ant":["calm","soothe"],"lv":2,"cat":"voc"},{"w":"prudent","pos":"adj","ko":"신중한, 현명한","ex":"It would be prudent to save some of your bonus rather than spending it all at once.","ans":"prudent","exKo":"보너스를 한꺼번에 다 쓰기보다 일부를 저축하는 것이 현명할 것이다.","syn":["wise","sensible","careful"],"ant":["reckless","rash"],"lv":3,"cat":"voc"},{"w":"publicize","pos":"v","ko":"알리다, 홍보하다","ex":"The museum used social media to publicize its new exhibition on ancient Korean pottery.","ans":"publicize","exKo":"박물관은 고대 한국 도자기에 관한 새 전시를 홍보하기 위해 소셜 미디어를 활용했다.","syn":["promote","advertise","announce"],"ant":["conceal"],"lv":2,"cat":"voc"},{"w":"punctual","pos":"adj","ko":"시간을 잘 지키는","ex":"Our manager is always punctual, so she expects everyone to arrive at meetings on time.","ans":"punctual","exKo":"우리 관리자는 항상 시간을 잘 지켜서 모두가 회의에 제시간에 오기를 기대한다.","syn":["on time","prompt"],"ant":["late","tardy"],"lv":1,"cat":"voc"},{"w":"purchase","pos":"v","ko":"구매하다","ex":"Tickets can be purchased online or at the box office up to one hour before the show.","ans":"purchased","exKo":"표는 온라인이나 매표소에서 공연 시작 한 시간 전까지 구매할 수 있다.","syn":["buy","acquire"],"ant":["sell"],"lv":1,"cat":"voc"},{"w":"pursue","pos":"v","ko":"추구하다, 계속하다","ex":"After graduating, she decided to pursue a career in environmental law instead of medicine.","ans":"pursue","exKo":"졸업 후 그녀는 의학 대신 환경법 분야의 경력을 쌓기로 결심했다.","syn":["seek","follow","strive for"],"ant":["abandon","give up"],"lv":1,"cat":"voc"},{"w":"put off","pos":"phr","ko":"미루다, 연기하다","ex":"I keep putting off my dental appointment because I am so nervous about the treatment.","ans":"putting off","exKo":"치료가 너무 걱정돼서 치과 예약을 계속 미루고 있다.","syn":["postpone","delay"],"ant":["move up"],"lv":1,"cat":"voc"},{"w":"qualified","pos":"adj","ko":"자격을 갖춘, 적임의","ex":"We are looking for qualified candidates with at least three years of experience in marketing.","ans":"qualified","exKo":"마케팅 분야에서 최소 3년의 경력을 가진 자격 있는 지원자를 찾고 있습니다.","syn":["eligible","competent","certified"],"ant":["unqualified"],"lv":1,"cat":"voc"},{"w":"quarantine","pos":"n","ko":"격리, 검역","ex":"Travelers arriving from the affected region were placed in quarantine for fourteen days.","ans":"quarantine","exKo":"피해 지역에서 도착한 여행객들은 14일 동안 격리되었다.","syn":["isolation","seclusion"],"ant":[],"lv":2,"cat":"voc"},{"w":"query","pos":"n","ko":"문의, 질문","ex":"If you have any queries about your bill, please contact our customer service team by email.","ans":"queries","exKo":"요금 청구서에 관해 문의 사항이 있으시면 이메일로 고객 서비스팀에 연락해 주십시오.","syn":["question","inquiry"],"ant":["answer"],"lv":2,"cat":"voc"},{"w":"questionnaire","pos":"n","ko":"설문지","ex":"Participants were asked to complete a short questionnaire about their sleeping habits.","ans":"questionnaire","exKo":"참가자들은 수면 습관에 관한 짧은 설문지를 작성해 달라는 요청을 받았다.","syn":["survey","form"],"ant":[],"lv":2,"cat":"voc"},{"w":"quota","pos":"n","ko":"할당량, 몫","ex":"Each salesperson must meet a monthly quota of twenty new contracts to receive a bonus.","ans":"quota","exKo":"각 영업 사원은 보너스를 받으려면 신규 계약 20건이라는 월간 할당량을 채워야 한다.","syn":["allocation","share","target"],"ant":[],"lv":2,"cat":"voc"},{"w":"rampant","pos":"adj","ko":"만연한, 걷잡을 수 없는","ex":"Corruption was rampant in the local government until a new mayor launched a strict investigation.","ans":"rampant","exKo":"새 시장이 엄격한 조사를 시작하기 전까지 지방 정부에는 부패가 만연했다.","syn":["widespread","unchecked"],"ant":["controlled"],"lv":3,"cat":"voc"},{"w":"rapport","pos":"n","ko":"친밀한 관계, 신뢰","ex":"Good teachers quickly build rapport with their students by listening carefully to their concerns.","ans":"rapport","exKo":"좋은 교사는 학생들의 고민을 귀 기울여 들으며 빠르게 신뢰 관계를 쌓는다.","syn":["bond","connection","relationship"],"ant":["hostility"],"lv":3,"cat":"voc"},{"w":"ratify","pos":"v","ko":"비준하다, 승인하다","ex":"The treaty will take effect only after it has been ratified by the parliaments of both countries.","ans":"ratified","exKo":"그 조약은 양국 의회가 비준한 후에야 효력이 발생한다.","syn":["approve","confirm","endorse"],"ant":["reject"],"lv":3,"cat":"voc"},{"w":"reasonable","pos":"adj","ko":"합리적인, (가격이) 적당한","ex":"The hotel offers clean rooms and friendly service at a very reasonable price.","ans":"reasonable","exKo":"그 호텔은 깨끗한 객실과 친절한 서비스를 매우 적당한 가격에 제공한다.","syn":["fair","sensible","affordable"],"ant":["unreasonable","excessive"],"lv":1,"cat":"voc"},{"w":"reassure","pos":"v","ko":"안심시키다","ex":"The doctor reassured the patient that the surgery was routine and the risks were very low.","ans":"reassured","exKo":"의사는 그 수술이 일반적이고 위험이 매우 낮다며 환자를 안심시켰다.","syn":["comfort","encourage"],"ant":["alarm","worry"],"lv":2,"cat":"voc"},{"w":"recession","pos":"n","ko":"경기 침체, 불황","ex":"Many small businesses were forced to close during the recession that followed the financial crisis.","ans":"recession","exKo":"금융 위기 이후 찾아온 경기 침체 동안 많은 소규모 사업체가 문을 닫아야 했다.","syn":["downturn","slump","depression"],"ant":["boom","recovery"],"lv":1,"cat":"voc"},{"w":"recipient","pos":"n","ko":"수령인, 받는 사람","ex":"This year's scholarship recipients will be announced on the university website next Monday.","ans":"recipients","exKo":"올해 장학금 수혜자는 다음 주 월요일 대학 홈페이지에 발표된다.","syn":["receiver","beneficiary"],"ant":["sender","donor"],"lv":2,"cat":"voc"},{"w":"reckless","pos":"adj","ko":"무모한, 난폭한","ex":"The driver was fined for reckless driving after speeding through a crowded school zone.","ans":"reckless","exKo":"그 운전자는 붐비는 어린이 보호 구역을 과속으로 지나가 난폭 운전으로 벌금을 받았다.","syn":["careless","rash"],"ant":["cautious","careful"],"lv":2,"cat":"voc"},{"w":"reconcile","pos":"v","ko":"화해시키다, 조화시키다","ex":"It is often difficult to reconcile economic growth with the need to protect the environment.","ans":"reconcile","exKo":"경제 성장과 환경 보호의 필요성을 조화시키는 것은 종종 어렵다.","syn":["harmonize","resolve","make peace"],"ant":["alienate"],"lv":3,"cat":"voc"},{"w":"recruit","pos":"v","ko":"모집하다, 채용하다","ex":"The tech company plans to recruit two hundred new engineers by the end of the year.","ans":"recruit","exKo":"그 기술 기업은 연말까지 신입 엔지니어 200명을 채용할 계획이다.","syn":["hire","enlist","employ"],"ant":["dismiss","lay off"],"lv":1,"cat":"voc"},{"w":"redundant","pos":"adj","ko":"불필요한, 중복되는, 정리 해고된","ex":"The editor removed several redundant sentences to make the article shorter and clearer.","ans":"redundant","exKo":"편집자는 기사를 더 짧고 명확하게 만들기 위해 불필요한 문장 몇 개를 삭제했다.","syn":["unnecessary","superfluous","repetitive"],"ant":["essential","necessary"],"lv":2,"cat":"voc"},{"w":"refrain","pos":"v","ko":"삼가다, 자제하다","ex":"Audience members are asked to refrain from taking photographs during the performance.","ans":"refrain","exKo":"관객 여러분께서는 공연 중 사진 촬영을 삼가 주시기 바랍니다.","syn":["abstain","avoid","hold back"],"ant":["indulge"],"lv":1,"cat":"voc"},{"w":"refund","pos":"n","ko":"환불, 환불금","ex":"If the product is damaged, you can return it within thirty days for a full refund.","ans":"refund","exKo":"제품이 손상되었다면 30일 이내에 반품하여 전액 환불받을 수 있다.","syn":["reimbursement","repayment"],"ant":["charge"],"lv":1,"cat":"voc"},{"w":"regulation","pos":"n","ko":"규정, 규제","ex":"New safety regulations require all construction workers to wear helmets and protective boots.","ans":"regulations","exKo":"새 안전 규정에 따라 모든 건설 노동자는 안전모와 보호용 장화를 착용해야 한다.","syn":["rule","law","guideline"],"ant":["deregulation"],"lv":1,"cat":"voc"},{"w":"reimburse","pos":"v","ko":"(비용을) 환급하다, 변상하다","ex":"The company will reimburse employees for travel expenses if they submit their receipts within a week.","ans":"reimburse","exKo":"직원이 일주일 안에 영수증을 제출하면 회사가 출장 경비를 환급해 준다.","syn":["repay","refund","compensate"],"ant":["charge"],"lv":1,"cat":"voc"},{"w":"reinforce","pos":"v","ko":"강화하다, 보강하다","ex":"The new evidence reinforces the theory that regular exercise reduces the risk of heart disease.","ans":"reinforces","exKo":"새 증거는 규칙적인 운동이 심장병 위험을 줄인다는 이론을 강화한다.","syn":["strengthen","support","bolster"],"ant":["weaken","undermine"],"lv":2,"cat":"voc"},{"w":"relevant","pos":"adj","ko":"관련 있는, 적절한","ex":"Applicants should have a degree in engineering or another relevant field to apply for this job.","ans":"relevant","exKo":"이 일자리에 지원하려면 공학이나 그 밖의 관련 분야 학위가 있어야 한다.","syn":["related","pertinent","applicable"],"ant":["irrelevant"],"lv":1,"cat":"voc"},{"w":"relieve","pos":"v","ko":"완화하다, 덜어 주다","ex":"This cream helps relieve muscle pain after long hours of exercise or physical work.","ans":"relieve","exKo":"이 크림은 오랜 시간 운동하거나 육체노동을 한 뒤의 근육통을 완화하는 데 도움이 된다.","syn":["ease","alleviate","reduce"],"ant":["worsen","aggravate"],"lv":1,"cat":"voc"},{"w":"relocate","pos":"v","ko":"이전하다, 이주하다","ex":"The firm decided to relocate its headquarters to a cheaper office building outside the capital.","ans":"relocate","exKo":"그 회사는 본사를 수도 외곽의 더 저렴한 사무용 건물로 이전하기로 결정했다.","syn":["move","transfer"],"ant":["stay"],"lv":1,"cat":"voc"},{"w":"reluctant","pos":"adj","ko":"꺼리는, 마지못한","ex":"Many consumers are reluctant to share their personal information with online shopping sites.","ans":"reluctant","exKo":"많은 소비자가 온라인 쇼핑몰에 개인 정보를 제공하는 것을 꺼린다.","syn":["unwilling","hesitant"],"ant":["willing","eager"],"lv":1,"cat":"voc"},{"w":"remedy","pos":"n","ko":"치료법, 해결책","ex":"Honey and warm lemon water is a popular home remedy for a sore throat.","ans":"remedy","exKo":"꿀과 따뜻한 레몬물은 목 통증에 많이 쓰는 민간요법이다.","syn":["cure","treatment","solution"],"ant":[],"lv":2,"cat":"voc"},{"w":"remote","pos":"adj","ko":"외딴, 원격의, (가능성이) 희박한","ex":"Since the pandemic, more companies have allowed employees to do remote work from home.","ans":"remote","exKo":"팬데믹 이후 더 많은 회사가 직원들의 재택 원격 근무를 허용했다.","syn":["distant","isolated","virtual"],"ant":["nearby","on-site"],"lv":1,"cat":"voc"},{"w":"render","pos":"v","ko":"(어떤 상태로) 만들다, 제공하다","ex":"The heavy snowfall rendered the mountain roads impassable for most of the weekend.","ans":"rendered","exKo":"폭설로 주말 대부분 동안 산길이 통행할 수 없게 되었다.","syn":["make","cause to be","provide"],"ant":[],"lv":3,"cat":"voc"},{"w":"renovate","pos":"v","ko":"개조하다, 보수하다","ex":"The hotel lobby is being renovated, so guests should use the side entrance until next month.","ans":"renovated","exKo":"호텔 로비를 보수하고 있으므로 투숙객은 다음 달까지 옆문을 이용해야 한다.","syn":["refurbish","remodel","restore"],"ant":[],"lv":1,"cat":"voc"},{"w":"replenish","pos":"v","ko":"보충하다, 다시 채우다","ex":"The store replenishes its shelves every morning before customers start to arrive.","ans":"replenishes","exKo":"그 가게는 매일 아침 손님이 오기 전에 진열대를 다시 채운다.","syn":["refill","restock","renew"],"ant":["deplete","exhaust"],"lv":2,"cat":"voc"},{"w":"replicate","pos":"v","ko":"복제하다, 재현하다","ex":"Other researchers were unable to replicate the results of the original experiment.","ans":"replicate","exKo":"다른 연구자들은 원래 실험의 결과를 재현하지 못했다.","syn":["reproduce","copy","duplicate"],"ant":[],"lv":2,"cat":"voc"},{"w":"reputation","pos":"n","ko":"평판, 명성","ex":"The bakery has earned a reputation for using only fresh, locally grown ingredients.","ans":"reputation","exKo":"그 빵집은 신선한 지역 재료만 쓰는 곳이라는 평판을 얻었다.","syn":["name","standing","fame"],"ant":["infamy"],"lv":1,"cat":"voc"},{"w":"reside","pos":"v","ko":"거주하다, 살다","ex":"Only people who reside in the district are eligible for the free parking permit.","ans":"reside","exKo":"그 구역에 거주하는 사람만 무료 주차 허가증을 받을 자격이 있다.","syn":["live","dwell","inhabit"],"ant":[],"lv":2,"cat":"voc"},{"w":"resign","pos":"v","ko":"사임하다, 사직하다","ex":"The CEO resigned after the board discovered serious errors in the company's financial reports.","ans":"resigned","exKo":"이사회가 회사 재무 보고서에서 심각한 오류를 발견하자 최고경영자는 사임했다.","syn":["quit","step down","leave"],"ant":["remain","stay on"],"lv":1,"cat":"voc"},{"w":"resilient","pos":"adj","ko":"회복력 있는, 탄력 있는","ex":"Children are often more resilient than adults and adapt quickly to new schools and friends.","ans":"resilient","exKo":"아이들은 종종 어른보다 회복력이 강해 새 학교와 친구에게 빨리 적응한다.","syn":["tough","adaptable","flexible"],"ant":["fragile","vulnerable"],"lv":2,"cat":"voc"},{"w":"resolve","pos":"v","ko":"해결하다, 결심하다","ex":"The technician resolved the network problem within an hour, and the office was back online.","ans":"resolved","exKo":"기술자가 한 시간 만에 네트워크 문제를 해결해 사무실이 다시 인터넷에 연결되었다.","syn":["solve","settle","fix"],"ant":[],"lv":1,"cat":"voc"},{"w":
