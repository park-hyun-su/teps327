  num("qs","quizSize",1,30,"알람마다 낼 문제 수");num("np","newPerDay",0,100,"Claude 목록 하루 새 단어 수");num("vd","vocabDays",1,100,"Unit 수");
  document.getElementById("vs").onchange=e=>{if(e.target.value){setCfg("vocabStart",e.target.value);toast("저장했어요")}};
  M.querySelectorAll("input[name=theme]").forEach(r=>r.onchange=()=>{setCfg("theme",r.value);applyTheme();toast("화면 모드를 바꿨어요")});
  document.getElementById("pfull").onchange=e=>{setCfg("photoFull",e.target.checked?"1":"0");toast(e.target.checked?"사진에서 유의어·파생어도 읽어요":"사진에서 큰 단어만 읽어요");vSet()};
  const pa=document.getElementById("pauto");if(pa)pa.onclick=()=>{setCfg("photoFull","auto");vSet()};
  document.getElementById("x3").onchange=e=>{setCfg("exam3",e.target.checked?"1":"0");toast(e.target.checked?"418회를 달력에 넣었어요":"418회를 달력에서 뺐어요")};
  document.getElementById("tokShow").onclick=e=>{const i=document.getElementById("tok"),sh=i.type==="password";i.type=sh?"text":"password";e.target.textContent=sh?"숨기기":"보기";e.target.setAttribute("aria-pressed",String(sh))};
  document.getElementById("tokSave").onclick=async()=>{localStorage.setItem(LSTOK,document.getElementById("tok").value.trim());localStorage.removeItem(LSGIST);await sync(true);vSet()};
  document.getElementById("syncNow").onclick=async()=>{await sync(true);vSet()};
  const td=document.getElementById("tokDel");if(td)td.onclick=()=>{localStorage.removeItem(LSTOK);localStorage.removeItem(LSGIST);syncText="이 기기에만 저장 중";vSet()};
  document.getElementById("exp").onclick=()=>{const data=JSON.stringify(S,null,1);if(IS_APP&&Android.saveFile){Android.saveFile("teps330_backup_"+todayStr()+".json",data);return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="teps330_backup_"+todayStr()+".json";a.click()};
}
function nextAlarm(){if(cfg("alarmsOn")!=="1")return null;const on=cfg("alarms").filter(a=>a[1]).map(a=>a[0]).sort();if(!on.length)return null;const n=new Date(),hm=p2(n.getHours())+":"+p2(n.getMinutes());const t=on.find(x=>x>hm);return t?["오늘",t]:["내일",on[0]]}
function nextAlarmText(){const a=nextAlarm();return a?"다음 알람: "+a[0]+" "+a[1]:"켜진 알람이 없어요"}
function pushAlarms(){if(IS_APP&&Android.setAlarms)Android.setAlarms(JSON.stringify({size:Number(cfg("quizSize"))||5,on:cfg("alarmsOn")==="1",times:cfg("alarms").filter(a=>a[1]).map(a=>a[0])}))}

/* ====================== 동기화 (GitHub Gist) ====================== */
let syncText="이 기기에만 저장 중";
function setLine(m){syncText=m;const e=document.getElementById("syncLine");if(e)e.textContent=m}
function merge(a,b){const o=blank();for(const p of PARTS){const A=a[p]||{},B=b[p]||{};for(const k of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[k],y=B[k];o[p][k]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)}}return o}
async function gh(method,path,body){const r=await fetch("https://api.github.com"+path,{method,headers:{Authorization:"Bearer "+localStorage.getItem(LSTOK),Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
async function findGist(){let id=localStorage.getItem(LSGIST);if(id)return id;
  for(let page=1;page<=5;page++){const l=await gh("GET","/gists?per_page=100&page="+page);const g=l.find(g=>g.files&&g.files[FILE]);if(g){id=g.id;break}if(l.length<100)break}
  if(!id){const g=await gh("POST","/gists",{description:"TEPS 공부 기록 (공부계획 앱이 씀)",public:false,files:{[FILE]:{content:JSON.stringify(S)}}});id=g.id}
  localStorage.setItem(LSGIST,id);return id}
let busy=false,again=false,timer=null;
async function sync(verbose){
  if(!localStorage.getItem(LSTOK)){if(verbose){const sm=document.getElementById("syncMsg");if(sm)sm.innerHTML=`<span class="err" style="display:inline">토큰을 먼저 넣어 주세요.</span>`}return}if(busy){again=true;return}busy=true;setLine("동기화 중…");
  ["syncNow","tokSave"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true});const smm=document.getElementById("syncMsg");if(smm)smm.textContent="동기화 중…";
  try{const id=await findGist();const g=await gh("GET","/gists/"+id);let remote=blank();try{remote=JSON.parse(g.files[FILE].content)}catch(e){}
    const before=JSON.stringify(S.cfg.alarms||null)+JSON.stringify(S.cfg.alarmsOn||null);
    const m=merge(S,remote),js=JSON.stringify(m);S=m;_bank=null;saveLocal();
    if(js!==JSON.stringify(Object.assign(blank(),remote)))await gh("PATCH","/gists/"+id,{files:{[FILE]:{content:js}}});
    if(JSON.stringify(S.cfg.alarms||null)+JSON.stringify(S.cfg.alarmsOn||null)!==before)pushAlarms();
    const t=new Date();setLine("동기화됨 "+p2(t.getHours())+":"+p2(t.getMinutes()));applyTheme();const ae=document.activeElement;if(!["quiz","learn","ocr","set","score","words","list"].includes(view)&&!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render();
  }catch(e){const m=/401|403/.test(e.message)?"토큰이 맞지 않거나 만료됐어요":/404/.test(e.message)?"기록 Gist 를 찾지 못했어요":"인터넷 연결을 확인해 주세요";setLine("동기화 실패: "+m+" · 이 기기에는 저장됨");const sm=document.getElementById("syncMsg");if(sm)sm.innerHTML=`<span class="err" style="display:inline">${esc(m)}</span> <button class="btn small" id="syncRetry">다시 시도</button>`;const rb=document.getElementById("syncRetry");if(rb)rb.onclick=()=>sync(true)}
  busy=false;["syncNow","tokSave"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=false});const sm2=document.getElementById("syncMsg");if(sm2&&!sm2.querySelector(".err"))sm2.textContent=syncText;if(again){again=false;sync()}
}
function changed(){_bank=null;saveLocal();clearTimeout(timer);timer=setTimeout(()=>sync(),1500)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){sync();if(view==="today")render()}});

function applyTheme(){const t=cfg("theme")||"system";if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
/* ====================== 시작 ====================== */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{fromAlarm=false;go(b.dataset.v)});
window.onAlarm=function(){fromAlarm=true;view="today";quiz=null;learn=null;render();window.scrollTo(0,0)};
document.addEventListener("keydown",e=>{if(view==="quiz"&&quiz&&!/INPUT/.test(e.target.tagName)){const n=Number(e.key);if(quiz.answered==null&&n>=1&&n<=4)answer(n-1);else if(quiz.answered!=null&&e.key==="Enter"&&e.target.tagName!=="BUTTON"){quiz.i++;quiz.answered=null;render()}}});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!IS_APP)navigator.serviceWorker.register("sw.js").catch(()=>{});
{const h=location.hash.slice(1);if(h==="alarm")fromAlarm=true;else if(TITLES[h]&&!["quiz","learn","ocr"].includes(h))view=h}
history.replaceState({v:view},"","#"+view);
applyTheme();autoQuizDone();render();pushAlarms();sync();
</script>
