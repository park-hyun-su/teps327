<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEPS 327">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TEPS 327</title>
<style>
:root{
  --bg:#ffffff;--soft:#f3f5f9;--line:#e6e9f0;--text:#1c2330;--sub:#6b7385;--faint:#a3aaba;
  --blue:#2f6fde;--sun:#e0453a;--sat:#2f6fde;--ok:#1f9d55;
  --c-voc:#2fa36b;--c-lis:#2f6fde;--c-gram:#7a5af5;--c-read:#0f9bb0;--c-mock:#f08a24;--c-exam:#e0453a;--c-etc:#8a93a6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;line-height:1.45}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top .r1{display:flex;align-items:center;gap:8px}
.top h1{font-size:22px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.top h1 small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.ib{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text)}
.today-btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.sync{font-size:11px;color:var(--faint);margin-top:4px;display:flex;justify-content:space-between}
.dday{color:var(--sun);font-weight:700}
/* month grid */
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 6px 0;font-size:12px;color:var(--sub);text-align:center}
.wk div:first-child{color:var(--sun)}.wk div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 6px 6px;touch-action:pan-y}
.cell{min-height:74px;border-top:1px solid var(--line);padding:3px 2px 4px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;border-radius:0}
.cell.out{opacity:.35}
.cell.off{opacity:.25;cursor:default}
.num{align-self:center;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;font-size:13px;font-weight:600}
.cell.sun .num,.cell.hol .num{color:var(--sun)}.cell.sat .num{color:var(--sat)}
.cell.today .num{background:var(--blue);color:#fff}
.cell.sel{background:#eef3fd;border-radius:10px}
.hname{font-size:9px;color:var(--sun);text-align:center;line-height:1;white-space:nowrap;overflow:hidden}
.chip{font-size:10px;line-height:15px;border-radius:4px;padding:0 3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:600}
.dots{display:flex;justify-content:center;gap:3px;margin-top:1px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.prog{height:3px;background:var(--line);border-radius:2px;margin:auto 4px 0;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ok)}
.cell.full .num::after{content:"✓";position:absolute;top:2px;right:4px;font-size:10px;color:var(--ok);font-weight:800}
/* day sheet */
.sheet{border-top:8px solid var(--soft);padding:14px 16px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.sh .d{font-size:18px;font-weight:800}
.sh .p{font-size:12px;color:var(--sub);flex:1;text-align:right}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:6px 0 8px}
.meter .bar{font-family:Consolas,"D2Coding",monospace;letter-spacing:-1px;color:var(--ok)}
.meter b{color:var(--text)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 10px;margin:6px 0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c-etc);border-radius:10px;cursor:pointer}
.task input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--faint);border-radius:50%;flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-content:center}
.task input:checked{background:var(--ok);border-color:var(--ok)}
.task input:checked::after{content:"✓";color:#fff;font-size:13px;font-weight:800}
.task>div{min-width:0}
.task .t{font-size:15px}
.task .k{font-size:12px;color:var(--sub);margin-top:2px}
.task.done{opacity:.55}.task.done .t{text-decoration:line-through}
.tag{display:inline-block;font-size:11px;color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;font-weight:700}
/* list view */
.sec{padding:14px 16px 4px;font-size:13px;font-weight:800;color:var(--sub)}
.sec.warn{color:var(--sun)}
.lday{padding:0 16px}
.lday .h{font-size:14px;font-weight:700;margin:12px 0 2px;display:flex;justify-content:space-between}
.lday .h span{font-weight:500;color:var(--sub);font-size:12px}
/* cards */
.card{margin:12px 16px;border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:13px;margin:12px 0 4px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--sub);font-weight:600;font-size:12px}
td.l{text-align:left}
input[type=text],input[type=date],input[type=number],input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;margin-top:10px;font-family:inherit;font-weight:600}
.btn.gray{background:var(--soft);color:var(--text)}
.btn.sm{padding:4px 8px;font-size:12px;margin:0}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--sun);font-weight:800}
.note{font-size:13px;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 16px 0;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:760px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--faint);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{font-size:20px;line-height:22px}
.tabs button.on{color:var(--blue);font-weight:700}
@media (min-width:700px){.cell{min-height:92px}.chip{font-size:11px;line-height:17px}.num{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="r1">
      <h1 id="title">TEPS 327</h1>
      <button class="ib" id="pv" aria-label="이전">‹</button>
      <button class="ib" id="nx" aria-label="다음">›</button>
      <button class="today-btn" id="tb">오늘</button>
    </div>
    <div class="sync"><span id="syncLine">이 기기에만 저장 중</span><span id="dday"></span></div>
  </div>
  <div id="main"></div>
</div>
<div class="tabs"><div class="in">
  <button data-v="cal" class="on"><span class="ic">▦</span>달력</button>
  <button data-v="list"><span class="ic">☰</span>할 일 목록</button>
  <button data-v="score"><span class="ic">▲</span>진행·점수</button>
  <button data-v="set"><span class="ic">⚙</span>설정</button>
</div></div>
<script>
"use strict";
const START="2026-11-20", END="2027-03-14", LS="teps327_state_v1", LSTOK="teps327_token", LSGIST="teps327_gist";
const FILE="teps_progress.json";
const TARGET={L:[130,240],V:[30,60],G:[37,60],R:[130,240]};
const NAME={L:"청해",V:"어휘",G:"문법",R:"독해"};
const DEF={exam1:"",exam2:"",exam3:"",vocabDays:"30",vocabStart:"2026-11-19"};
const HOL={"2026-12-25":"성탄절","2027-01-01":"신정","2027-02-06":"설 연휴","2027-02-07":"설날","2027-02-08":"설 연휴","2027-02-09":"대체공휴일","2027-03-01":"삼일절"};
const CAT={voc:["보카","var(--c-voc)"],lis:["청해","var(--c-lis)"],gram:["문법","var(--c-gram)"],read:["독해","var(--c-read)"],mock:["기출","var(--c-mock)"],exam:["시험","var(--c-exam)"],etc:["할 일","var(--c-etc)"]};

/* ---------- date ---------- */
function p2(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function dow(s){return parse(s).getDay()}
const WD=["일","월","화","수","목","금","토"];
function label(s){const d=parse(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+WD[d.getDay()]+"요일"}
function todayStr(){return ymd(new Date())}

/* ---------- state ---------- */
function blank(){return {items:{},cfg:{},scores:{}}}
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.items)return s}catch(e){}return blank()}
function saveLocal(){localStorage.setItem(LS,JSON.stringify(S))}
function cfg(k){const c=S.cfg[k];return c?c.v:DEF[k]}
function setCfg(k,v){S.cfg[k]={v:v,t:Date.now()};changed()}
function isDone(key){const it=S.items[key];return !!(it&&it.v)}
function setDone(key,v){S.items[key]={v:v,t:Date.now()};changed()}
function scoresList(){return Object.entries(S.scores).filter(([,s])=>!s.del).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>a.date<b.date?-1:1)}

/* ---------- plan ---------- */
function phaseOf(d){
  const e1=cfg("exam1"),e2=cfg("exam2");
  if(d<"2026-11-23")return "0단계 · 진단";
  if(d<="2026-12-20")return "1단계 · 기본기";
  if(d<="2027-01-17")return "2단계 · 다지기";
  if(!e1||d<=e1)return "3단계 · 1차 응시 준비";
  if(!e2||d<=e2)return "4단계 · 약점 보강";
  return "예비 회차";
}
function weakest(){
  const l=scoresList().filter(s=>s.L!==""&&s.L!=null);if(!l.length)return null;
  const s=l[l.length-1];let best=null,min=9;
  for(const k of ["L","V","G","R"]){const r=Number(s[k])/TARGET[k][0];if(r<min){min=r;best=k}}
  return best;
}
function vocabTask(d){
  if(dow(d)===0)return {id:"voc",k:"매일",t:"보카 주간 복습: 이번 주 분량을 한 번에 다시 보기"};
  const vs=cfg("vocabStart"),n0=Math.max(1,Number(cfg("vocabDays"))||30);
  if(d<vs)return null;
  let n=0;for(let x=vs;x<=d;x=add(x,1))if(dow(x)!==0)n++;
  const day=((n-1)%n0)+1,round=Math.floor((n-1)/n0)+1;
  return {id:"voc",k:"매일 · 파고다 뉴텝스 보카",t:"보카 "+round+"회독 Day "+day+" 새로 외우기 + 전날 분량 복습"};
}
function tasksFor(d){
  const T=[],w=dow(d),wk=w>=1&&w<=5;
  const push=(id,t,k)=>T.push({id,t,k:k||""});
  const v=vocabTask(d);if(v)T.push(v);
  push("dict","청해 받아쓰기 20분: 그날 틀린 문제 음원을 받아쓰고 따라 읽기","매일");
  const e1=cfg("exam1"),e2=cfg("exam2"),e3=cfg("exam3");
  const mock=(id,n)=>{push(id,"기출 "+n+"회 실전 풀이: 청해 40분 → 어휘·문법 25분 → 독해 40분, 한 번에","공식 기출 5회분");push(id+"s","기출 "+n+"회 점수를 「진행·점수」 탭에 기록","기록")};
  const review=(id,n)=>push(id,"기출 "+n+"회 오답 정리: 모르는 단어는 보카 빈칸에, 틀린 청해는 받아쓰기","공식 기출 5회분");
  if(d==="2026-11-20")push("p","진단 준비: 기출 1회 풀 시간(105분)을 정하고 음원·답안지 준비","0단계");
  else if(d==="2026-11-21")mock("m1",1);
  else if(d==="2026-11-22")review("r1",1);
  else if(d<="2026-12-20"){
    const n=Math.floor(diff("2026-11-23",d)/7)+1;
    if(d==="2026-11-23")push("reg1","1차 시험 접수 (1월 하순 회차) 후 「설정」에 시험일 입력","할 일");
    if(wk){push("g","문법책 1회독: 이번 주 목차 "+n+"/4 구간 (하루 1/5씩)","해커스 텝스 중급 문법");push("l","청해책 앞 절반: 이번 주 "+n+"/4 구간 (하루 1/5씩)","뉴텝스 기본편 실전 300+ 청해")}
    else if(w===6){push("r","독해: 기출 1회 지문 다시 읽기, 모르는 단어 적기","독해");push("c","이번 주 문법·청해 밀린 분량 채우기","주말")}
    else push("c","한 주 점검: 이번 주 체크 안 된 항목 확인","주말");
  }
  else if(d<="2027-01-17"){
    const n=Math.floor(diff("2026-12-21",d)/7)+1;
    if(d==="2027-01-16")mock("m2",2);
    else if(d==="2027-01-17"){review("r2",2);push("cmp","진단과 기출 2회를 영역별로 비교: 오른 영역과 안 오른 영역","기록")}
    else if(wk){push("g","문법 2회독: 1회독에서 틀린 문제만 (이번 주 "+n+"/4 구간)","해커스 텝스 중급 문법");push("l","청해책 뒤 절반: 이번 주 "+n+"/4 구간 (하루 1/5씩)","뉴텝스 기본편 실전 300+ 청해")}
    else if(w===6){push("r","독해: 지난 회차 지문을 시간 재고 다시 풀기, 모르는 문제는 넘기기 연습","독해");push("c","이번 주 밀린 분량 채우기","주말")}
    else push("c","한 주 점검: 이번 주 체크 안 된 항목 확인","주말");
  }
  else if(!e1||d<=e1){
    if(d==="2027-01-18")push("reg2","2차 시험 접수 (2월 하순 회차) 후 「설정」에 시험일 입력","할 일");
    if(!e1){push("set1","「설정」에서 1차 시험일을 입력하면 이 기간 계획이 채워집니다","할 일");return T}
    const k=diff(d,e1);
    if(k===0){T.length=0;push("x1","1차 시험: 신분증 챙기기, 시험장 도착 시간 확인","시험")}
    else if(k===7)mock("m3",3);
    else if(k===6)review("r3",3);
    else if(k>=1&&k<=5){push("f","새 진도 없이 오답 노트와 보카만 다시 보기","시험 주간");if(k===1)push("idc","내일 준비물: 신분증, 수험표 출력","시험 주간")}
    else{push("g","문법·청해 오답 복습","복습");push("w","약한 영역 보충 (기출 2회 점수 기준 가장 낮은 영역)","복습")}
  }
  else if(!e2||d<=e2){
    const k1=diff(e1,d);
    if(k1===6)push("res1","1차 성적 확인 → 「진행·점수」 탭에 기록. 327 넘었으면 2차 취소 검토","기록");
    if(!e2){push("set2","「설정」에서 2차 시험일을 입력하면 이 기간 계획이 채워집니다","할 일");return T}
    const k=diff(d,e2),wkk=weakest();
    if(k===0){T.length=0;push("x2","2차 시험: 신분증 챙기기, 시험장 도착 시간 확인","시험")}
    else if(k===14)mock("m4",4);
    else if(k===13)review("r4",4);
    else if(k===7)mock("m5",5);
    else if(k===6)review("r5",5);
    else if(k>=1&&k<=5){push("f","새 진도 없이 오답 노트와 보카만 다시 보기","시험 주간");if(k===1)push("idc","내일 준비물: 신분증, 수험표 출력","시험 주간")}
    else push("w","약점 집중 (공부 시간의 절반): "+(wkk?NAME[wkk]+" (최근 기록 기준 목표 대비 가장 낮음)":"「진행·점수」 탭의 가장 낮은 영역"),"약점 보강");
  }
  else{
    const k2=diff(e2,d);
    if(k2===6)push("res2","2차 성적 확인 → 「진행·점수」 탭에 기록. 넘지 못했으면 예비 회차 응시","기록");
    if(e3){const k=diff(d,e3);if(k===0){T.length=0;push("x3","예비 시험: 신분증 챙기기","시험")}else if(k>0)push("w","기출 오답과 보카 2회독째 집중","예비")}
  }
  return T;
}
function catOf(id){
  if(id==="voc")return "voc";
  if(id==="dict"||id==="l")return "lis";
  if(id==="g")return "gram";
  if(id==="r")return "read";
  if(/^x\d/.test(id))return "exam";
  if(/^(m\d|r\d|cmp|res)/.test(id))return "mock";
  return "etc";
}
function chipOf(x){
  let m;
  if((m=/^x(\d)$/.exec(x.id)))return m[1]==="3"?"예비 시험":m[1]+"차 시험";
  if((m=/^m(\d)$/.exec(x.id)))return "기출 "+m[1]+"회";
  if((m=/^r(\d)$/.exec(x.id)))return "오답 "+m[1]+"회";
  if(/^reg/.test(x.id))return "접수";
  if(/^res/.test(x.id))return "성적 발표";
  return null;
}
function key(d,id){return d+"|"+id}
function dayProgress(d){const t=tasksFor(d);const n=t.filter(x=>isDone(key(d,x.id))).length;return [n,t.length]}
function bar(p,w){w=w||16;const f=Math.round(p*w);return "█".repeat(f)+"░".repeat(w-f)}
function streak(){let n=0,d=todayStr();const [a,b]=dayProgress(clamp(d));if(!(a===b&&b>0))d=add(d,-1);
  for(;d>=START;d=add(d,-1)){if(d>END)continue;const [x,y]=dayProgress(d);if(y&&x===y)n++;else break}return n}

/* ---------- view state ---------- */
let view="cal",sel=clamp(todayStr()),month=sel.slice(0,7);
function clamp(d){return d<START?START:d>END?END:d}
const M=document.getElementById("main");
function render(){
  const t=document.getElementById("title");
  if(view==="cal"){const [y,m]=month.split("-");t.innerHTML=Number(m)+"월<small>"+y+"</small>"}
  else t.textContent={list:"할 일 목록",score:"진행·점수",set:"설정"}[view];
  document.getElementById("pv").style.visibility=document.getElementById("nx").style.visibility=view==="cal"?"visible":"hidden";
  const e=[["exam1","1차"],["exam2","2차"]].map(([k,n])=>[cfg(k),n]).find(([d])=>d&&d>=todayStr());
  document.getElementById("dday").innerHTML=e?`<span class="dday">${e[1]} 시험 D-${diff(todayStr(),e[0])||"DAY"}</span>`:"";
  ({cal:vCal,list:vList,score:vScore,set:vSet})[view]();
}
function taskHTML(d,x){const k=key(d,x.id),dn=isDone(k),c=CAT[catOf(x.id)];
  return `<label class="task${dn?" done":""}" data-k="${k}" style="border-left-color:${c[1]}"><input type="checkbox"${dn?" checked":""}><div><div class="t">${x.t}</div><div class="k"><span class="tag" style="background:${c[1]}">${c[0]}</span>${x.k}</div></div></label>`}
function bindTasks(){M.querySelectorAll(".task input").forEach(i=>i.onchange=e=>{setDone(e.target.closest(".task").dataset.k,e.target.checked);render()})}
function vCal(){
  const first=month+"-01",lead=dow(first);let d=add(first,-lead);
  let h=`<div class="wk">${WD.map(w=>`<div>${w}</div>`).join("")}</div><div class="grid" id="grid">`;
  const td=todayStr();
  for(let i=0;i<42;i++,d=add(d,1)){
    if(i===35&&d.slice(0,7)!==month)break;
    const inR=d>=START&&d<=END,w=dow(d),cls=["cell"];
    if(d.slice(0,7)!==month)cls.push("out");if(!inR)cls.push("off");
    if(w===0)cls.push("sun");if(w===6)cls.push("sat");if(HOL[d])cls.push("hol");
    if(d===td)cls.push("today");if(d===sel&&view==="cal")cls.push("sel");
    let inner=`<div class="num">${Number(d.slice(8))}</div>`;
    if(HOL[d])inner+=`<div class="hname">${HOL[d]}</div>`;
    if(inR){
      const t=tasksFor(d),[n,c]=dayProgress(d);if(c&&n===c)cls.push("full");
      const chips=t.map(x=>[chipOf(x),catOf(x.id)]).filter(x=>x[0]);
      for(const [txt,ct] of chips.slice(0,2))inner+=`<div class="chip" style="background:${CAT[ct][1]}">${txt}</div>`;
      if(!chips.length){const cs=[...new Set(t.map(x=>catOf(x.id)))].filter(c=>c!=="etc");inner+=`<div class="dots">${cs.map(c=>`<i style="background:${CAT[c][1]}"></i>`).join("")}</div>`}
      inner+=`<div class="prog"><b style="width:${c?n/c*100:0}%"></b></div>`;
    }
    h+=`<div class="${cls.join(" ")}" data-d="${d}">${inner}</div>`;
  }
  h+=`</div><div class="legend">${["voc","lis","gram","read","mock","exam"].map(c=>`<span><i style="background:${CAT[c][1]}"></i>${CAT[c][0]}</span>`).join("")}</div>`;
  const t=tasksFor(sel),[n,c]=dayProgress(sel);
  h+=`<div class="sheet"><div class="sh"><div class="d">${label(sel)}</div><div class="p">${phaseOf(sel)}${HOL[sel]?" · "+HOL[sel]:""}</div></div>
  <div class="meter"><span class="bar">${bar(c?n/c:0)}</span><b>${c?Math.round(n/c*100):0}%</b><span>${n}/${c} 완료</span></div>
  ${t.map(x=>taskHTML(sel,x)).join("")}</div>`;
  M.innerHTML=h;bindTasks();
  M.querySelectorAll(".cell:not(.off)").forEach(e=>e.onclick=()=>{sel=e.dataset.d;if(sel.slice(0,7)!==month)month=sel.slice(0,7);render()});
  const g=document.getElementById("grid");let sx=null,sy=null;
  g.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  g.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)moveMonth(dx<0?1:-1)});
}
function moveMonth(k){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+k,1);const nm=ymd(d).slice(0,7);if(nm<START.slice(0,7)||nm>END.slice(0,7))return;month=nm;render()}
function vList(){
  const td=clamp(todayStr());let h="";
  const miss=[];for(let d=START;d<td;d=add(d,1)){const t=tasksFor(d).filter(x=>!isDone(key(d,x.id)));if(t.length)miss.push([d,t])}
  if(miss.length){h+=`<div class="sec warn">밀린 일 ${miss.reduce((a,[,t])=>a+t.length,0)}개</div>`;for(const [d,t] of miss)h+=`<div class="lday"><div class="h">${label(d)}<span>${phaseOf(d)}</span></div>${t.map(x=>taskHTML(d,x)).join("")}</div>`}
  h+=`<div class="sec">오늘과 다가오는 7일</div>`;
  for(let i=0;i<8;i++){const d=add(td,i);if(d>END)break;const t=tasksFor(d),[n,c]=dayProgress(d);
    h+=`<div class="lday"><div class="h">${i===0?"오늘 · ":i===1?"내일 · ":""}${label(d)}<span>${n}/${c}</span></div>${t.map(x=>taskHTML(d,x)).join("")}</div>`}
  M.innerHTML=h;bindTasks();
}
function vScore(){
  let tn=0,tc=0,pn=0,pc=0;const td=todayStr(),ph={};
  for(let d=START;d<=END;d=add(d,1)){const [n,c]=dayProgress(d),p=phaseOf(d);(ph[p]=ph[p]||[0,0,d,d]);ph[p][0]+=n;ph[p][1]+=c;ph[p][3]=d;tn+=n;tc+=c;if(d<=td){pn+=n;pc+=c}}
  const l=scoresList(),last=l[l.length-1],lastTot=last?["L","V","G","R"].reduce((a,k)=>a+(Number(last[k])||0),0):null;
  let h=`<div class="stats"><div class="stat"><b>${streak()}일</b><span>연속 완료</span></div><div class="stat"><b>${pc?Math.round(pn/pc*100):0}%</b><span>오늘까지 완료율</span></div><div class="stat"><b class="${lastTot===null?"":lastTot>=327?"pass":"fail"}">${lastTot===null?"-":lastTot}</b><span>최근 점수</span></div></div>
  <div class="card"><h2>전체 진행률</h2><div class="meter"><span class="bar">${bar(tc?tn/tc:0,20)}</span><b>${tc?Math.round(tn/tc*100):0}%</b><span>${tn}/${tc}</span></div>`;
  for(const [p,[n,c,a,b]] of Object.entries(ph))h+=`<h3>${p} · ${a.slice(5).replace("-","/")} ~ ${b.slice(5).replace("-","/")}</h3><div class="meter"><span class="bar">${bar(c?n/c:0)}</span><b>${c?Math.round(n/c*100):0}%</b><span>${n}/${c}</span></div>`;
  h+=`</div><div class="card"><h2>점수 기록</h2><table><tr><th class="l">회차</th><th>청해</th><th>어휘</th><th>문법</th><th>독해</th><th>합계</th><th></th></tr>
  <tr><td class="l note">목표</td><td class="note">130</td><td class="note">30</td><td class="note">37</td><td class="note">130</td><td class="note">327</td><td></td></tr>`;
  for(const s of l){const tot=["L","V","G","R"].reduce((a,k)=>a+(Number(s[k])||0),0);
    h+=`<tr><td class="l">${s.name}<div class="note">${s.date}</div></td>${["L","V","G","R"].map(k=>`<td>${s[k]}</td>`).join("")}<td class="${tot>=327?"pass":"fail"}">${tot}</td><td><button class="btn gray sm" data-del="${s.id}">삭제</button></td></tr>`}
  h+=`</table><div class="note" style="margin-top:6px">영역별 목표는 대략적인 기준입니다. 실제 점수는 문항 난이도를 반영해 환산됩니다.</div>
  <h3>새 기록</h3><label class="f">회차 이름</label><input type="text" id="sn" placeholder="예: 기출 1회 진단, 1차 시험">
  <label class="f">날짜</label><input type="date" id="sd" value="${todayStr()}">
  <div class="row">${["L","V","G","R"].map(k=>`<div><label class="f">${NAME[k]} /${TARGET[k][1]}</label><input type="number" id="s${k}" inputmode="numeric"></div>`).join("")}</div>
  <button class="btn" id="sadd">기록 추가</button></div>`;
  M.innerHTML=h;
  document.getElementById("sadd").onclick=()=>{const name=document.getElementById("sn").value.trim()||"기록";const o={name,date:document.getElementById("sd").value,t:Date.now()};
    for(const k of ["L","V","G","R"])o[k]=document.getElementById("s"+k).value;
    S.scores["s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]=o;changed();render()};
  M.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const s=S.scores[b.dataset.del];s.del=true;s.t=Date.now();changed();render()});
}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view==="set")render()});
function vSet(){
  const tok=localStorage.getItem(LSTOK)||"";
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  M.innerHTML=`<div class="card"><h2>홈 화면에 앱으로 설치</h2>
  ${deferredInstall?`<button class="btn" id="inst">지금 설치하기</button>`:""}
  <div class="note" style="margin-top:8px">${ios?"iPhone: Safari 아래쪽 공유 단추(네모에 화살표) → 「홈 화면에 추가」. Chrome 이면 주소창 오른쪽 공유 단추 → 「홈 화면에 추가」.":"안드로이드 Chrome: 오른쪽 위 ⋮ → 「홈 화면에 추가」 또는 「앱 설치」. 메뉴에 없으면 페이지를 한 번 새로 고친 뒤 다시 보세요."}
  ${matchMedia("(display-mode: standalone)").matches?"<br><b>지금 설치된 앱으로 열려 있습니다.</b>":""}</div></div>
  <div class="card"><h2>시험일</h2><div class="note">접수한 회차 날짜를 넣으면 기출 3~5회, 시험 주간, 성적 확인 날짜가 달력에 채워집니다.</div>
  <label class="f">1차 시험 (1월 하순 회차)</label><input type="date" id="e1" value="${cfg("exam1")}">
  <label class="f">2차 시험 (2월 하순 회차)</label><input type="date" id="e2" value="${cfg("exam2")}">
  <label class="f">예비 시험 (3월 첫 주 회차, 필요할 때만)</label><input type="date" id="e3" value="${cfg("exam3")}">
  <h3>파고다 뉴텝스 보카</h3>
  <label class="f">책의 Day 수</label><input type="number" id="vd" value="${cfg("vocabDays")}">
  <label class="f">보카 시작일</label><input type="date" id="vs" value="${cfg("vocabStart")}">
  <button class="btn" id="cfgSave">저장</button></div>
  <div class="card"><h2>휴대폰·컴퓨터 동기화</h2>
  <div class="note">기록은 GitHub 비공개 Gist 한 개(${FILE})에 저장됩니다. 두 기기에 같은 토큰을 한 번씩 넣으면 체크할 때마다 자동으로 주고받습니다. 토큰은 이 기기 브라우저에만 저장됩니다.</div>
  <label class="f">GitHub 토큰 (Gist 읽기·쓰기 권한만)</label><input type="password" id="tok" value="${tok}" placeholder="github_pat_...">
  <button class="btn" id="tokSave">연결</button> <button class="btn gray" id="syncNow">지금 동기화</button> <button class="btn gray" id="tokDel">연결 끊기</button>
  <div class="note" id="syncMsg" style="margin-top:8px">${tok?"Gist: "+(localStorage.getItem(LSGIST)||"아직 찾지 않음"):"연결 안 됨"}</div></div>
  <div class="card"><h2>백업</h2><button class="btn gray" id="exp">기록 파일로 받기</button></div>`;
  const ib=document.getElementById("inst");if(ib)ib.onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()};
  document.getElementById("cfgSave").onclick=()=>{for(const [id,k] of [["e1","exam1"],["e2","exam2"],["e3","exam3"],["vd","vocabDays"],["vs","vocabStart"]]){const v=document.getElementById(id).value;if(v!==cfg(k))setCfg(k,v)}alertMsg("저장했습니다.")};
  document.getElementById("tokSave").onclick=async()=>{localStorage.setItem(LSTOK,document.getElementById("tok").value.trim());localStorage.removeItem(LSGIST);await sync(true);vSet()};
  document.getElementById("syncNow").onclick=async()=>{await sync(true);vSet()};
  document.getElementById("tokDel").onclick=()=>{localStorage.removeItem(LSTOK);localStorage.removeItem(LSGIST);setLine("이 기기에만 저장 중");vSet()};
  document.getElementById("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="teps_progress_"+todayStr()+".json";a.click()};
}
function alertMsg(m){const e=document.getElementById("syncMsg");if(e)e.textContent=m;setLine(m)}
function setNav(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;setNav();render();window.scrollTo(0,0)});
document.getElementById("pv").onclick=()=>moveMonth(-1);
document.getElementById("nx").onclick=()=>moveMonth(1);
document.getElementById("tb").onclick=()=>{sel=clamp(todayStr());month=sel.slice(0,7);view="cal";setNav();render()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="t"||e.key==="T")document.getElementById("tb").click();
  else if(view==="cal"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){sel=clamp(add(sel,e.key==="ArrowLeft"?-1:1));month=sel.slice(0,7);render()}});

/* ---------- sync (GitHub Gist) ---------- */
function setLine(m){document.getElementById("syncLine").textContent=m}
function merge(a,b){const o=blank();for(const part of ["items","cfg","scores"]){const A=a[part]||{},B=b[part]||{};for(const k of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[k],y=B[k];o[part][k]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)}}return o}
async function gh(method,path,body){
  const r=await fetch("https://api.github.com"+path,{method,headers:{Authorization:"Bearer "+localStorage.getItem(LSTOK),Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(!r.ok)throw new Error("GitHub "+r.status);return r.json();
}
async function findGist(){
  let id=localStorage.getItem(LSGIST);if(id)return id;
  for(let page=1;page<=5;page++){const l=await gh("GET","/gists?per_page=100&page="+page);const g=l.find(g=>g.files&&g.files[FILE]);if(g){id=g.id;break}if(l.length<100)break}
  if(!id){const g=await gh("POST","/gists",{description:"TEPS 327 공부 기록 (공부계획 HTML 이 씀)",public:false,files:{[FILE]:{content:JSON.stringify(S)}}});id=g.id}
  localStorage.setItem(LSGIST,id);return id;
}
let busy=false,again=false,timer=null;
async function sync(verbose){
  if(!localStorage.getItem(LSTOK))return;
  if(busy){again=true;return}busy=true;setLine("동기화 중…");
  try{
    const id=await findGist();const g=await gh("GET","/gists/"+id);
    let remote=blank();try{remote=JSON.parse(g.files[FILE].content)}catch(e){}
    const m=merge(S,remote),js=JSON.stringify(m);
    S=m;saveLocal();
    if(js!==JSON.stringify(remote))await gh("PATCH","/gists/"+id,{files:{[FILE]:{content:js}}});
    const t=new Date();setLine("동기화됨 "+p2(t.getHours())+":"+p2(t.getMinutes()));
    if(view!=="set")render();else if(verbose)alertMsg("동기화됨 "+p2(t.getHours())+":"+p2(t.getMinutes()));
  }catch(e){setLine("동기화 실패: "+e.message+" (이 기기에는 저장됨)");if(verbose)alertMsg("동기화 실패: "+e.message+". 토큰과 인터넷 연결을 확인하세요.")}
  busy=false;if(again){again=false;sync()}
}
function changed(){saveLocal();clearTimeout(timer);timer=setTimeout(()=>sync(),1200)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();sync();
</script>
